# Deploy-only workflow for fpkg.fly.dev.
#
# Triggers:
#   - workflow_dispatch — tap "Run workflow" on the GitHub mobile app or
#     the web UI to ship whatever's currently on main.
#   - push to main that touches demo code, graph data, or the scraper.
#
# To use, you need the FLY_API_TOKEN repository secret. Generate one at
# https://fly.io/apps/fpkg/tokens (app-scoped deploy token recommended).
#
# This is the fast path. The rebuild-graphs workflow also calls flyctl
# at the end, so don't trigger both at once for the same commit.

name: deploy-fpkg

on:
  workflow_dispatch:
  push:
    branches: [claude/main, main]
    paths:
      - 'demos/parliament-live/**'
      # demos/python-interop/ is COPYed into the FPKG runtime image by
      # the Dockerfile (the canonical files live here; the in-web-tree
      # python-interop/ is symlinks pointing at this directory). Without
      # this path filter, commits that only touch python-interop don't
      # trigger a redeploy, so prod stays stuck on the old static files.
      - 'demos/python-interop/**'
      - 'third_party/data/**/*.nq.gz'
      - 'third_party/identity-graph/**/*.nq.gz'
      - 'lib/facilities/appg.mjs'
      - '.github/workflows/deploy-fpkg.yml'

permissions:
  contents: read

concurrency:
  group: deploy-fpkg
  cancel-in-progress: true     # newer push supersedes an in-flight build

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy . \
            --config demos/parliament-live/fly.toml \
            --remote-only \
            --strategy immediate

      - name: Smoke test the live endpoint
        run: |
          set -euo pipefail
          # Wait for fly to flip traffic AND for the container to boot
          # the Oxigraph store. Retry the health probe up to 18×5 s = 90 s
          # so a real outage fails the step rather than blocking silently.
          for i in $(seq 1 18); do
            if curl -fsS -m 10 https://fpkg.fly.dev/_health > /tmp/h.json; then
              echo "health OK after ${i} attempt(s):"
              cat /tmp/h.json && echo
              break
            fi
            if [ "$i" = "18" ]; then
              echo "::error::/_health never returned 200 within 90s"
              exit 1
            fi
            sleep 5
          done
          # The bundled SPARQL store should answer a trivial count.
          # Retries here too — first SPARQL hit may race Oxigraph readiness.
          for i in $(seq 1 12); do
            if curl -fsS -m 30 -H 'Accept: application/sparql-results+json' \
                "https://fpkg.fly.dev/kgx/query?query=SELECT%20(COUNT(*)%20AS%20%3Fn)%20WHERE%20%7B%20%3Fs%20%3Fp%20%3Fo%20%7D" \
                > /tmp/sparql.json; then
              echo "/kgx/query OK after ${i} attempt(s):"
              cat /tmp/sparql.json && echo
              # Sanity: must be a real JSON-results document, not empty / error
              jq -e '.results.bindings[0].n.value | tonumber > 0' /tmp/sparql.json \
                || { echo "::error::SPARQL endpoint returned non-positive count"; exit 1; }
              # Legacy /sparql must 301 to /kgx/query so existing bookmarks keep working.
              loc=$(curl -fsS -o /dev/null -w '%{redirect_url}' "https://fpkg.fly.dev/sparql?query=ASK%20%7B%7D")
              case "$loc" in
                *"/kgx/query?query=ASK%20%7B%7D"*) echo "legacy /sparql redirect OK -> $loc" ;;
                *) echo "::error::legacy /sparql did not redirect to /kgx/query (got: '$loc')"; exit 1 ;;
              esac
              exit 0
            fi
            sleep 5
          done
          echo "::error::/kgx/query never returned 200 within 60s"
          exit 1
