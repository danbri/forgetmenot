<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="forget-me-not flower">
  <!-- forgetmenot — an original forget-me-not motif: five sky-blue petals,
       a golden eye, green leaves. -->
  <!-- stem + leaves (behind the flower) -->
  <path d="M16 15 C 16 21, 15.5 25, 15 30" fill="none" stroke="#4f9d3a" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="10.5" cy="23" rx="4.8" ry="2.4" fill="#5aa84f" transform="rotate(-32 10.5 23)"/>
  <ellipse cx="21.5" cy="25.5" rx="4.4" ry="2.2" fill="#4f9d3a" transform="rotate(30 21.5 25.5)"/>
  <!-- five petals (forget-me-not blue) -->
  <g fill="#4f8fdb">
    <circle cx="16"    cy="5.5"  r="5.2"/>
    <circle cx="22.18" cy="9.99" r="5.2"/>
    <circle cx="19.82" cy="17.26" r="5.2"/>
    <circle cx="12.18" cy="17.26" r="5.2"/>
    <circle cx="9.82"  cy="9.99" r="5.2"/>
  </g>
  <!-- eye: white ring + golden centre -->
  <circle cx="16" cy="12" r="3.9" fill="#ffffff"/>
  <circle cx="16" cy="12" r="2.5" fill="#f6c23c"/>
</svg>
