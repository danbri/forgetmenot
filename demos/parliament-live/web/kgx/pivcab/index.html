<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pivcab — UK Cabinet over time</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f5ef;
    --surface: #ffffff;
    --surface-2: #f0ece2;
    --ink: #15171a;
    --ink-soft: #4a4d54;
    --ink-mute: #888a90;
    --accent: #2a4f76;
    --accent-on: #ffffff;
    --rule: #d6d2c5;
    --rule-soft: #e6e2d4;
    --good: #2d8a4e;
    --bad: #c0392b;
    --shadow: 0 1px 2px rgba(20,30,60,0.05), 0 6px 16px rgba(20,30,60,0.07);
    --shadow-lift: 0 10px 32px rgba(20,30,60,0.15);
    --edge: #b9b3a5;
    --edge-active: var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1d1f24;
      --surface-2: #24272d;
      --ink: #ececec;
      --ink-soft: #b8b8b8;
      --ink-mute: #80828a;
      --accent: #6da3d6;
      --accent-on: #0d1115;
      --rule: #2f3239;
      --rule-soft: #25272d;
      --good: #6acb6a;
      --bad: #ff9a8b;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 16px rgba(0,0,0,0.5);
      --shadow-lift: 0 10px 32px rgba(0,0,0,0.6);
      --edge: #4a4d54;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--accent); }
</style>
</head>
<body>

<pivcab-app></pivcab-app>

<script type="module">
'use strict';

// ===========================================================================
// pivcab — node-flow demo over UK Cabinet members
// ---------------------------------------------------------------------------
// This is the V1 of the architecture sketched in docs/kgx/node-flow-design.md.
// A small DAG of operations (Source → Filter → Snapshot → Combine → View)
// over the same set passes (typed entity bundles). All built as web
// components with mobile-first CSS, View Transitions, and a stripped-down
// bloom filter for set membership across larger snapshots.
// ===========================================================================

const QLEVER = 'https://qlever.dev/api/wikidata';

// Seed: every Wikidata person who held a position that is (transitively)
// a subclass of "Member of the Parliament of the United Kingdom"
// (Q16707842), with at least one term ending or starting on/after 1900.
// Probed 2026-05-28: 6,917 distinct people. 2,847 also carry P10428
// (parliament.uk member id) — the bridge to forgetmenot's Members API
// skill. Full set arrives in ~2 s / ~3 MB.
//
// `sitting` is detected from the *structural* shape of the latest term:
// an open-ended P39 statement (P580 bound, P582 unbound) with start year
// >= 2024 means the person is sitting in the current Parliament. This
// matters because MAX(endYear) alone misses currently-sitting MPs whose
// open term has no end-date qualifier — observed 193 Labour with the
// naive rule vs 400 with the structural rule (matches GE 2024 result).
const SEED_LIMIT = 7000;          // soft cap; current universe is 6917
const POST1900_MPS_QUERY = `
PREFIX wd:     <http://www.wikidata.org/entity/>
PREFIX wdt:    <http://www.wikidata.org/prop/direct/>
PREFIX p:      <http://www.wikidata.org/prop/>
PREFIX ps:     <http://www.wikidata.org/prop/statement/>
PREFIX pq:     <http://www.wikidata.org/prop/qualifier/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?p (SAMPLE(?lbl) AS ?l)
       (SAMPLE(?image) AS ?imgUri)
       (SAMPLE(?mp)    AS ?mpid)
       (MIN(?startYr)  AS ?firstYr)
       (MAX(?startYr)  AS ?latestStart)
       (MAX(?effEnd)   AS ?lastYr)
       (MAX(?openNow)  AS ?sittingFlag)
       (GROUP_CONCAT(DISTINCT ?partyLbl; separator="|") AS ?parties)
WHERE {
  ?p wdt:P39 ?pos .
  ?pos wdt:P279* wd:Q16707842 .          # position ⊑ Member of UK Parliament
  ?p p:P39 ?stmt . ?stmt ps:P39 ?pos .
  OPTIONAL { ?stmt pq:P580 ?start . BIND(YEAR(?start) AS ?startYr) }
  OPTIONAL { ?stmt pq:P582 ?end   . BIND(YEAR(?end)   AS ?endYr)   }
  # Sentinel 9999 for open-ended terms so MAX still flags currently-sitting.
  BIND(IF(BOUND(?endYr), ?endYr, 9999) AS ?effEnd)
  BIND(IF(BOUND(?startYr) && !BOUND(?endYr) && ?startYr >= 2024, 1, 0) AS ?openNow)
  FILTER( (BOUND(?startYr) && ?startYr >= 1900) ||
          (BOUND(?endYr)   && ?endYr   >= 1900) )
  OPTIONAL { ?p wdt:P18    ?image }
  OPTIONAL { ?p wdt:P10428 ?mp }                 # parliament.uk member id
  OPTIONAL { ?p wdt:P102   ?party0 .
             ?party0 rdfs:label ?partyLbl . FILTER(lang(?partyLbl) = "en") }
  OPTIONAL { ?p rdfs:label ?lbl . FILTER(lang(?lbl) = "en") }
}
GROUP BY ?p
LIMIT ${SEED_LIMIT}`;

// ===========================================================================
// Bloom filter — compact set-membership with tunable false-positive rate.
// Backed by a Uint32 typed array; bit twiddling stays cheap.
// FNV-1a + Murmur-ish mix for two independent hashes; the rest fold in via
// linear combination (Kirsch–Mitzenmacher).
// ===========================================================================
class Bloom {
  constructor(expectedItems = 1000, falsePositiveRate = 0.01) {
    // m = -n ln(p) / (ln 2)^2 ; k = (m/n) ln 2
    const m = Math.ceil(-expectedItems * Math.log(falsePositiveRate) / (Math.LN2 ** 2));
    this.m = Math.max(64, m);
    this.k = Math.max(2, Math.round((this.m / expectedItems) * Math.LN2));
    this.bits = new Uint32Array(Math.ceil(this.m / 32));
    this.n = 0;
  }
  _h1(s) { // FNV-1a
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    }
    return h >>> 0;
  }
  _h2(s) { // simple xorshift mix off FNV
    let h = this._h1(s);
    h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    return (h ^ (h >>> 16)) >>> 0;
  }
  add(s) {
    const h1 = this._h1(s), h2 = this._h2(s);
    for (let i = 0; i < this.k; i++) {
      const b = (h1 + i * h2) % this.m;
      this.bits[b >>> 5] |= (1 << (b & 31));
    }
    this.n++;
    return this;
  }
  has(s) {
    const h1 = this._h1(s), h2 = this._h2(s);
    for (let i = 0; i < this.k; i++) {
      const b = (h1 + i * h2) % this.m;
      if (!(this.bits[b >>> 5] & (1 << (b & 31)))) return false;
    }
    return true;
  }
  static from(items, p = 0.01) {
    const bf = new Bloom(items.length || 1, p);
    for (const x of items) bf.add(String(x));
    return bf;
  }
}

// ===========================================================================
// Typed set with provenance hash and lazy bloom. Wrap a small Set + the
// originating items so views can render thumbnails without re-querying.
// ===========================================================================
class Bundle {
  constructor(items, type = 'human', label = 'set') {
    this.items = items;
    this.type = type;
    this.label = label;
    this._idSet = null;
    this._bloom = null;
  }
  get ids() {
    if (!this._idSet) this._idSet = new Set(this.items.map((i) => i.uri));
    return this._idSet;
  }
  get bloom() {
    if (!this._bloom) this._bloom = Bloom.from([...this.ids], 0.005);
    return this._bloom;
  }
  get size() { return this.items.length; }

  static union(a, b) {
    const seen = new Set();
    const out = [];
    for (const x of [...a.items, ...b.items]) {
      if (!seen.has(x.uri)) { seen.add(x.uri); out.push(x); }
    }
    return new Bundle(out, a.type, `${a.label} ∪ ${b.label}`);
  }
  static intersect(a, b) {
    // The whole point of the bloom: skip the larger set's hash table
    // probe on items that can't possibly be in the smaller one. For
    // small sets the cost is mostly the bloom build, but the API is
    // ready for sets that are bigger than what fits in working memory.
    const [small, large] = a.size <= b.size ? [a, b] : [b, a];
    const smallBloom = small.bloom, smallIds = small.ids;
    const out = [];
    for (const x of large.items) {
      if (smallBloom.has(x.uri) && smallIds.has(x.uri)) out.push(x);
    }
    return new Bundle(out, a.type, `${a.label} ∩ ${b.label}`);
  }
  static difference(a, b) {
    const bBloom = b.bloom, bIds = b.ids;
    const out = a.items.filter((x) => !(bBloom.has(x.uri) && bIds.has(x.uri)));
    return new Bundle(out, a.type, `${a.label} ∖ ${b.label}`);
  }
}

// ===========================================================================
// Network helper — single funnel so a dev panel can subscribe.
// ===========================================================================
async function sparql(endpoint, query, label = 'sparql') {
  const u = new URL(endpoint);
  u.searchParams.set('query', query);
  const t0 = performance.now();
  console.log('[sparql]', label, '→', endpoint);
  const r = await fetch(u.toString(), { headers: { 'Accept': 'application/sparql-results+json' } });
  if (!r.ok) throw new Error(`${label}: HTTP ${r.status}`);
  const j = await r.json();
  console.log('[sparql]', label, '←', { ms: Math.round(performance.now() - t0), rows: j.results.bindings.length });
  return j;
}

function httpsify(u) { return String(u || '').replace(/^http:\/\//, 'https://'); }
function commonsThumb(url, w = 220) {
  if (!url) return '';
  const v = httpsify(url);
  if (/commons\.wikimedia\.org\/wiki\/Special:FilePath\//i.test(v)) {
    return v + (v.includes('?') ? '&' : '?') + 'width=' + w;
  }
  return v;
}

// ===========================================================================
// Seed loader — flatten Wikidata bindings into a person record.
// ===========================================================================
function parseMpRows(bindings) {
  return bindings.map((b) => {
    const uri = b.p.value;
    const firstYr = b.firstYr?.value ? parseInt(b.firstYr.value, 10) : null;
    const latestStart = b.latestStart?.value ? parseInt(b.latestStart.value, 10) : null;
    const rawLastEnd  = b.lastYr?.value  ? parseInt(b.lastYr.value,  10) : null;
    const sitting = b.sittingFlag?.value === '1';
    // 9999 sentinel marks an open-ended current term; collapse to null
    // for display / decade purposes so we never render "2024–9999".
    const lastYr = (rawLastEnd === 9999 || rawLastEnd === null) ? null : rawLastEnd;
    // Decade = the last decade they were active. For currently-sitting
    // members that's whichever decade the open term started in.
    const decadeYear = sitting ? latestStart : lastYr;
    const parties = (b.parties?.value || '').split('|').filter(Boolean);
    return {
      uri,
      label: b.l?.value || uri.replace(/^.*\//, ''),
      image: b.imgUri?.value || null,
      mpid:  b.mpid?.value || null,        // parliament.uk member id (bridge)
      firstYr, lastYr, latestStart, sitting,
      parties,
      decade: decadeYear ? `${Math.floor(decadeYear / 10) * 10}s` : null,
    };
  });
}

// ===========================================================================
// DAG state — nodes + edges + selection. Single source of truth.
// ===========================================================================
const state = {
  nodes: [],     // { id, kind, label, op, bundle, depth }
  edges: [],     // { from, to }
  selection: null,  // node id whose bundle the grid displays
  picked: new Set(), // up to 2 node ids — operands for the combine bar
};
const listeners = new Set();
function publish() { for (const fn of listeners) fn(); }

let _nodeIdSeq = 0;
function addNode(node) {
  node.id = node.id || 'n' + (++_nodeIdSeq);
  state.nodes.push(node);
  publish();
  return node;
}
function addEdge(from, to) {
  state.edges.push({ from, to });
}

// Layered layout: depth from sources.
function recomputeLayout() {
  const inbound = new Map(state.nodes.map((n) => [n.id, 0]));
  for (const e of state.edges) inbound.set(e.to, (inbound.get(e.to) || 0) + 1);
  for (const n of state.nodes) n.depth = 0;
  // Trivial BFS-ish: walk edges, depth(to) = max(depth(from)+1)
  let changed = true; let safety = 200;
  while (changed && safety--) {
    changed = false;
    for (const e of state.edges) {
      const a = state.nodes.find((n) => n.id === e.from);
      const b = state.nodes.find((n) => n.id === e.to);
      if (!a || !b) continue;
      if (b.depth < a.depth + 1) { b.depth = a.depth + 1; changed = true; }
    }
  }
}

// ===========================================================================
// Operations as pure functions over Bundles.
// ===========================================================================
function opSnapshot(parentBundle, predicate, label) {
  const filtered = new Bundle(parentBundle.items.filter(predicate), parentBundle.type, label);
  return filtered;
}

function opFilterByParty(parentBundle, party) {
  return opSnapshot(parentBundle, (x) => x.parties.includes(party),
    `${parentBundle.label} · ${party}`);
}
function opFilterByDecade(parentBundle, decade) {
  return opSnapshot(parentBundle, (x) => x.decade === decade,
    `${parentBundle.label} · ${decade}`);
}
function opFilterBySitting(parentBundle) {
  return opSnapshot(parentBundle, (x) => x.sitting,
    `${parentBundle.label} · sitting`);
}
function opFilterBridged(parentBundle) {
  return opSnapshot(parentBundle, (x) => !!x.mpid,
    `${parentBundle.label} · w/ Members API id`);
}

// ===========================================================================
// Web Components
// ===========================================================================

// Light-DOM tile factory — shadow DOM per tile was costing ~10ms each
// in V1 (250 tiles × shadow root + style block = noticeable). Plain
// HTML inside the grid's shadow root reuses one style block. Lazy
// image load via shared IntersectionObserver.
const tileIo = new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (en.isIntersecting) {
      const el = en.target;
      const url = el.dataset.src;
      if (url && !el._loaded) {
        el._loaded = true;
        el.src = url;
        el.addEventListener('load', () => el.classList.add('loaded'), { once: true });
        tileIo.unobserve(el);
      }
    }
  }
}, { rootMargin: '300px 0px' });

function tileHTML(person, meta) {
  const safeLabel = String(person.label || '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const metaStr = (meta || []).filter(Boolean).join(' · ');
  return `<div class="tile">`
    + `<div class="thumb">${person.image ? `<img class="thumb-img" alt="" data-src="${commonsThumb(person.image, 220)}">` : ''}</div>`
    + `<div class="body"><div class="name">${safeLabel}</div>${metaStr ? `<div class="meta">${metaStr}</div>` : ''}</div>`
    + `</div>`;
}

// <pivcab-tilegrid> — light-DOM tiles inside one shadow root. One style
// block serves every tile (vs V1's per-tile shadow root which was a
// measurable ~10 ms each). Bulk innerHTML in a single assignment; the
// browser parses it once.
class PivcabTilegrid extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.shadowRoot.innerHTML = `
      <style>
        :host { display: block; }
        .grid { display: grid; gap: 8px;
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        .head { display:flex; align-items: baseline; gap: 8px;
                font-size: 12px; color: var(--ink-mute); margin-bottom: 6px; }
        .head .n { color: var(--ink); font-weight: 600; font-size: 13px; }
        .tile { background: var(--surface); border: 1px solid var(--rule-soft);
                border-radius: 8px; overflow: hidden; box-shadow: var(--shadow);
                transition: transform 0.18s, box-shadow 0.18s; }
        .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
        .thumb { aspect-ratio: 1 / 1; background: var(--surface-2); }
        .thumb-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
                     display: block; transition: opacity 0.35s; opacity: 0; }
        .thumb-img.loaded { opacity: 1; }
        .body { padding: 6px 8px 8px; }
        .name { font: 13px/1.3 -apple-system, system-ui, sans-serif;
                color: var(--ink);
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; }
        .meta { font-size: 11px; color: var(--ink-mute); margin-top: 2px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      </style>
      <div class="head"><span class="n"></span><span class="lbl"></span></div>
      <div class="grid"></div>
    `;
  }
  set bundle(b) {
    this._bundle = b;
    if (!b) return;
    this.shadowRoot.querySelector('.n').textContent = b.size.toLocaleString();
    this.shadowRoot.querySelector('.lbl').textContent = b.label;
    const grid = this.shadowRoot.querySelector('.grid');
    // Cap initial DOM count; further scale needs true windowed scroll
    // recycling. 250 tiles is the V2 default seed size.
    const slice = b.items.slice(0, 3000);
    const html = new Array(slice.length);
    for (let i = 0; i < slice.length; i++) {
      const p = slice[i];
      let years = '';
      if (p.sitting && p.firstYr)        years = `${p.firstYr}–`;
      else if (p.firstYr && p.lastYr)    years = p.firstYr === p.lastYr ? `${p.firstYr}` : `${p.firstYr}–${p.lastYr}`;
      else if (p.lastYr)                 years = `${p.lastYr}`;
      else if (p.firstYr)                years = `${p.firstYr}–`;
      const meta = [years, p.parties?.[0] || ''].filter(Boolean);
      html[i] = tileHTML(p, meta);
    }
    grid.innerHTML = html.join('');
    for (const img of grid.querySelectorAll('img[data-src]')) tileIo.observe(img);
  }
}
customElements.define('pivcab-tilegrid', PivcabTilegrid);

// <pivcab-node> — one card in the DAG.
class PivcabNode extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }
  set node(n) {
    this._node = n;
    this.render();
  }
  render() {
    const n = this._node;
    if (!n) return;
    const isSelected = state.selection === n.id;
    const isPicked = state.picked.has(n.id);
    const pickIdx = isPicked ? ([...state.picked].indexOf(n.id) + 1) : 0;
    this.shadowRoot.innerHTML = `
      <style>
        :host { display: block; background: var(--surface);
                border: 1px solid var(--rule); border-radius: 10px;
                padding: 10px 12px; box-shadow: var(--shadow);
                cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s; }
        :host(:hover) { transform: translateY(-1px); box-shadow: var(--shadow-lift); }
        :host([selected]) { border-color: var(--accent); }
        :host([picked]) { border-color: var(--good); border-style: dashed; box-shadow: var(--shadow-lift); }
        .head { display: flex; gap: 6px; align-items: baseline; }
        .kind {
          font: 10px/1 ui-monospace, Menlo, monospace;
          background: var(--accent); color: var(--accent-on);
          padding: 2px 6px; border-radius: 3px; text-transform: uppercase;
          letter-spacing: 0.05em;
        }
        .pick {
          font: 10px/1 ui-monospace, Menlo, monospace;
          background: var(--good); color: white;
          padding: 2px 6px; border-radius: 3px; font-weight: 700;
        }
        .title { font-weight: 600; font-size: 13px; color: var(--ink);
                 overflow: hidden; text-overflow: ellipsis; }
        .n { margin-left: auto; font-size: 12px; color: var(--ink-mute);
             font-variant-numeric: tabular-nums; }
        .strip { display: flex; gap: 3px; margin-top: 8px;
                 height: 24px; overflow: hidden; border-radius: 4px; background: var(--surface-2); }
        .strip img { height: 24px; width: 24px; object-fit: cover; flex: 0 0 auto; }
      </style>
      <div class="head">
        <span class="kind"></span>
        <span class="pick" hidden></span>
        <span class="title"></span>
        <span class="n"></span>
      </div>
      <div class="strip"></div>
    `;
    if (isSelected) this.setAttribute('selected', '');
    else this.removeAttribute('selected');
    if (isPicked) this.setAttribute('picked', '');
    else this.removeAttribute('picked');
    const pickEl = this.shadowRoot.querySelector('.pick');
    if (pickIdx) { pickEl.hidden = false; pickEl.textContent = 'A B'.split(' ')[pickIdx - 1]; }
    else pickEl.hidden = true;

    this.shadowRoot.querySelector('.kind').textContent = n.kind;
    this.shadowRoot.querySelector('.title').textContent = n.label || n.kind;
    const sz = n.bundle ? n.bundle.size : 0;
    this.shadowRoot.querySelector('.n').textContent = sz.toLocaleString();

    // Strip of up to 6 sample thumbnails for visual recognisability
    const strip = this.shadowRoot.querySelector('.strip');
    if (n.bundle) {
      for (const person of n.bundle.items.slice(0, 6)) {
        if (!person.image) continue;
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = commonsThumb(person.image, 56);
        strip.appendChild(img);
      }
    }
  }
}
customElements.define('pivcab-node', PivcabNode);

// <pivcab-canvas> — DAG layout. SVG layer for edges, HTML for nodes.
class PivcabCanvas extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.shadowRoot.innerHTML = `
      <style>
        :host { display: block; position: relative;
                background: var(--surface-2);
                border-radius: 10px; padding: 10px; min-height: 260px;
                overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .layers { position: relative; min-height: 220px; }
        .layer { display: flex; flex-direction: column; gap: 12px;
                 align-items: center; }
        @media (min-width: 720px) {
          .layers { display: flex; gap: 36px; align-items: flex-start; }
        }
        @media (max-width: 719px) {
          .layers { display: flex; flex-direction: column; gap: 32px; }
        }
        svg { position: absolute; inset: 0; pointer-events: none;
              width: 100%; height: 100%; }
        path { fill: none; stroke: var(--edge); stroke-width: 1.4;
               opacity: 0.9; }
      </style>
      <svg><g class="edges"></g></svg>
      <div class="layers"></div>
    `;
    listeners.add(() => this.render());
  }
  render() {
    recomputeLayout();
    const maxD = state.nodes.reduce((m, n) => Math.max(m, n.depth || 0), 0);
    const layersDom = this.shadowRoot.querySelector('.layers');
    layersDom.innerHTML = '';
    const byDepth = [];
    for (let d = 0; d <= maxD; d++) byDepth[d] = [];
    for (const n of state.nodes) byDepth[n.depth || 0].push(n);
    for (const group of byDepth) {
      const col = document.createElement('div');
      col.className = 'layer';
      for (const n of group) {
        const el = document.createElement('pivcab-node');
        col.appendChild(el);
        el.node = n;
        el.addEventListener('click', () => this._onNodeTap(n));
      }
      layersDom.appendChild(col);
    }
    // Defer edge draw to next frame so layout has settled.
    requestAnimationFrame(() => this._drawEdges());
  }
  _onNodeTap(n) {
    // Combine model: a node tap toggles its membership in `state.picked`
    // (a Set of node ids, max 2). When two are picked, the combine bar
    // lights up its three operators. The selection (for the tile grid)
    // is always the most-recent tap.
    state.selection = n.id;
    if (state.picked.has(n.id)) state.picked.delete(n.id);
    else {
      if (state.picked.size >= 2) {
        // Drop the oldest pick to keep at most 2.
        const oldest = [...state.picked][0];
        state.picked.delete(oldest);
      }
      state.picked.add(n.id);
    }
    publish();
    this.dispatchEvent(new CustomEvent('node-tap', { detail: n }));
  }
  _drawEdges() {
    const svg = this.shadowRoot.querySelector('svg');
    const root = this.shadowRoot.querySelector('.layers').getBoundingClientRect();
    const g = this.shadowRoot.querySelector('.edges');
    g.innerHTML = '';
    const cardEls = this.shadowRoot.querySelectorAll('pivcab-node');
    const byId = new Map();
    for (const el of cardEls) byId.set(el.node?.id, el);
    for (const e of state.edges) {
      const from = byId.get(e.from), to = byId.get(e.to);
      if (!from || !to) continue;
      const fr = from.getBoundingClientRect(), tr = to.getBoundingClientRect();
      const x1 = (fr.right - root.left), y1 = (fr.top + fr.height/2 - root.top);
      const x2 = (tr.left - root.left),  y2 = (tr.top + tr.height/2 - root.top);
      const dx = Math.max(20, (x2 - x1) / 2);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);
      g.appendChild(path);
    }
  }
}
customElements.define('pivcab-canvas', PivcabCanvas);

// <pivcab-app> — orchestration.
class PivcabApp extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.shadowRoot.innerHTML = `
      <style>
        :host { display: block; padding: 14px;
                max-width: 1180px; margin: 0 auto; }
        header { display: flex; gap: 8px; align-items: baseline;
                 padding-bottom: 10px; border-bottom: 1px solid var(--rule-soft); }
        h1 { margin: 0; font-size: 17px; }
        .crumb { font-size: 12px; color: var(--ink-mute); }
        .count { margin-left: auto; font-size: 12px; color: var(--ink-soft); }
        .bar { display: flex; gap: 6px; flex-wrap: wrap;
               padding: 8px 10px; align-items: center;
               background: var(--surface); border: 1px solid var(--rule-soft);
               border-radius: 8px; margin-top: 8px; }
        .bar-lbl { font-size: 12px; color: var(--ink-mute); margin-right: 2px; }
        .bar-lbl b { color: var(--good); font-weight: 700; }
        .bar button {
          background: var(--surface); color: var(--ink);
          border: 1px solid var(--rule); border-radius: 6px;
          padding: 6px 10px; font: inherit; font-size: 13px;
          cursor: pointer;
        }
        .bar button.primary { background: var(--accent); color: var(--accent-on);
                              border-color: var(--accent); font-weight: 600; }
        .bar button:disabled { opacity: 0.4; cursor: default; }
        .bar .sep { width: 1px; height: 20px; background: var(--rule); }
        #combine-bar { background: color-mix(in oklab, var(--good) 8%, var(--surface)); }
        .grid-wrap { margin-top: 14px; padding: 10px;
                     background: var(--surface); border: 1px solid var(--rule-soft);
                     border-radius: 10px; box-shadow: var(--shadow); }
        .empty { padding: 32px; text-align: center; color: var(--ink-mute); }
        select {
          font: inherit; font-size: 13px;
          background: var(--surface); color: var(--ink);
          border: 1px solid var(--rule); border-radius: 6px;
          padding: 5px 8px;
          -webkit-appearance: none; appearance: none;
        }
        .pill {
          background: var(--surface-2); color: var(--ink-soft);
          border: 1px solid var(--rule-soft);
          border-radius: 12px; padding: 3px 9px; font-size: 11px;
          margin: 1px;
        }
        .pills { margin: 4px 0; }
        .hint { font-size: 12px; color: var(--ink-mute); padding: 6px 0; }
      </style>
      <header>
        <h1>pivcab</h1>
        <span class="crumb">· <a href="/kgx/">kgx</a> · UK MPs since 1900</span>
        <span class="count" id="count"></span>
      </header>
      <p class="hint" id="hint">
        Loading every Wikidata person who sat in the UK House of Commons
        on or after 1900 …
      </p>
      <div class="bar" id="filter-bar">
        <span class="bar-lbl">Filter the selected node by</span>
        <select id="party-select" title="party"><option value="">party…</option></select>
        <select id="decade-select" title="decade"><option value="">decade…</option></select>
        <button id="sitting-btn" title="lastYr >= 2024">sitting now</button>
        <button id="bridged-btn" title="has parliament.uk member id">has MP ID</button>
      </div>
      <div class="bar" id="combine-bar">
        <span class="bar-lbl">
          <span id="picks-msg">Tap a node, then another, to combine</span>
        </span>
        <button id="union-btn"     disabled>A ∪ B  union</button>
        <button id="intersect-btn" disabled>A ∩ B  intersect</button>
        <button id="diff-btn"      disabled>A ∖ B  difference</button>
        <button id="clear-btn"     disabled>clear picks</button>
        <span class="sep"></span>
        <button id="reset-btn">↺ Reset graph</button>
      </div>
      <pivcab-canvas></pivcab-canvas>
      <div class="grid-wrap">
        <pivcab-tilegrid></pivcab-tilegrid>
      </div>
    `;
    listeners.add(() => this.refresh());
    const root = this.shadowRoot;
    root.querySelector('pivcab-canvas').addEventListener('node-tap', (e) => {
      this._showBundle(e.detail);
    });
    root.querySelector('#party-select').addEventListener('change', (e) => {
      if (e.target.value) this._addFilter('party', e.target.value);
      e.target.value = '';
    });
    root.querySelector('#decade-select').addEventListener('change', (e) => {
      if (e.target.value) this._addFilter('decade', e.target.value);
      e.target.value = '';
    });
    root.querySelector('#sitting-btn').addEventListener('click', () => this._addFilter('sitting'));
    root.querySelector('#bridged-btn').addEventListener('click', () => this._addFilter('bridged'));
    root.querySelector('#union-btn').addEventListener('click',     () => this._combine('union'));
    root.querySelector('#intersect-btn').addEventListener('click', () => this._combine('intersect'));
    root.querySelector('#diff-btn').addEventListener('click',      () => this._combine('difference'));
    root.querySelector('#clear-btn').addEventListener('click', () => {
      state.picked.clear();
      publish();
    });
    root.querySelector('#reset-btn').addEventListener('click', () => {
      if (this._seedNode) {
        state.nodes = [this._seedNode, this._viewNode];
        state.edges = [{ from: this._seedNode.id, to: this._viewNode.id }];
        state.selection = this._seedNode.id;
        state.picked.clear();
        publish();
        this._showBundle(this._seedNode);
      }
    });
    this._boot();
  }
  async _boot() {
    try {
      const j = await sparql(QLEVER, POST1900_MPS_QUERY, 'seed:post-1900-mps');
      const items = parseMpRows(j.results.bindings);
      const seedBundle = new Bundle(items, 'human', `UK MPs since 1900 (${items.length.toLocaleString()})`);
      this._seedNode = addNode({ kind: 'Source', label: 'UK MPs ≥ 1900', bundle: seedBundle, depth: 0 });
      this._viewNode = addNode({ kind: 'View', label: 'tilegrid', bundle: seedBundle, depth: 1 });
      addEdge(this._seedNode.id, this._viewNode.id);
      state.selection = this._seedNode.id;
      this._populateFacets(seedBundle);
      this._showBundle(this._seedNode);
      const withBridge = items.filter((p) => p.mpid).length;
      this.shadowRoot.querySelector('#hint').innerHTML =
        `<b>${items.length.toLocaleString()}</b> Wikidata people sat in the UK Commons on or after 1900 — `
        + `<b>${withBridge.toLocaleString()}</b> of them carry a `
        + `<code>parliament.uk member id</code> (the forgetmenot Members API bridge). `
        + `Filter the selected node by party / decade / "sitting now" / "has MP id"; `
        + `then tap two nodes and combine with ∪ ∩ ∖.`;
      publish();
    } catch (err) {
      this.shadowRoot.querySelector('pivcab-tilegrid').replaceWith(
        Object.assign(document.createElement('div'), { className: 'empty', textContent: 'load failed: ' + err.message }));
    }
  }
  _populateFacets(bundle) {
    const parties = new Map();
    const decades = new Map();
    for (const p of bundle.items) {
      for (const party of p.parties) parties.set(party, (parties.get(party) || 0) + 1);
      if (p.decade) decades.set(p.decade, (decades.get(p.decade) || 0) + 1);
    }
    const partySel = this.shadowRoot.querySelector('#party-select');
    partySel.innerHTML = '<option value="">party…</option>';
    for (const [v, n] of [...parties.entries()].sort((a, b) => b[1] - a[1])) {
      const o = document.createElement('option');
      o.value = v; o.textContent = `${v}  ·  ${n}`;
      partySel.appendChild(o);
    }
    const decadeSel = this.shadowRoot.querySelector('#decade-select');
    decadeSel.innerHTML = '<option value="">decade…</option>';
    for (const [v, n] of [...decades.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
      const o = document.createElement('option');
      o.value = v; o.textContent = `${v}  ·  ${n}`;
      decadeSel.appendChild(o);
    }
  }
  _addFilter(kind, value) {
    const srcNode = state.nodes.find((n) => n.id === state.selection) || this._seedNode;
    if (!srcNode?.bundle) return;
    let filtered, label;
    switch (kind) {
      case 'party':   filtered = opFilterByParty(srcNode.bundle, value);  label = value; break;
      case 'decade':  filtered = opFilterByDecade(srcNode.bundle, value); label = value; break;
      case 'sitting': filtered = opFilterBySitting(srcNode.bundle);       label = 'sitting'; break;
      case 'bridged': filtered = opFilterBridged(srcNode.bundle);         label = 'has MP id'; break;
    }
    if (!filtered) return;
    const filterNode = addNode({ kind: 'Filter', label, op: 'filter:' + kind, bundle: filtered });
    const viewNode = addNode({ kind: 'View', label: 'tilegrid', bundle: filtered });
    addEdge(srcNode.id, filterNode.id);
    addEdge(filterNode.id, viewNode.id);
    state.selection = filterNode.id;
    this._showBundle(filterNode);
    publish();
  }
  _combine(op) {
    if (state.picked.size !== 2) return;
    const [aId, bId] = [...state.picked];
    const a = state.nodes.find((n) => n.id === aId);
    const b = state.nodes.find((n) => n.id === bId);
    if (!a?.bundle || !b?.bundle) return;
    const sym = { union: '∪', intersect: '∩', difference: '∖' }[op];
    const fn  = { union: Bundle.union, intersect: Bundle.intersect, difference: Bundle.difference }[op];
    const merged = fn(a.bundle, b.bundle);
    merged.label = `${a.label} ${sym} ${b.label}`;
    const node = addNode({ kind: 'Combine', label: merged.label, op, bundle: merged });
    const view = addNode({ kind: 'View', label: 'tilegrid', bundle: merged });
    addEdge(a.id, node.id);
    addEdge(b.id, node.id);
    addEdge(node.id, view.id);
    state.selection = node.id;
    state.picked.clear();
    this._showBundle(node);
    publish();
  }
  _showBundle(n) {
    if (!n || !n.bundle) return;
    const grid = this.shadowRoot.querySelector('pivcab-tilegrid');
    grid.bundle = n.bundle;
    this.shadowRoot.querySelector('#count').textContent =
      `${n.bundle.size.toLocaleString()} of ${this._seedNode?.bundle?.size?.toLocaleString() || '…'}`;
  }
  refresh() {
    if (state.selection) {
      const n = state.nodes.find((x) => x.id === state.selection);
      if (n) this._showBundle(n);
    }
    this._refreshCombineBar();
  }
  _refreshCombineBar() {
    const root = this.shadowRoot;
    const n = state.picked.size;
    const ready = n === 2;
    for (const id of ['#union-btn', '#intersect-btn', '#diff-btn']) {
      root.querySelector(id).disabled = !ready;
      root.querySelector(id).classList.toggle('primary', ready);
    }
    root.querySelector('#clear-btn').disabled = n === 0;
    const msg = root.querySelector('#picks-msg');
    if (n === 0)      msg.textContent = 'Tap a node to pick A, tap another for B, then combine ∪ ∩ ∖';
    else if (n === 1) msg.textContent = 'Picked A — tap a second node for B';
    else {
      const picks = [...state.picked].map((id) => state.nodes.find((nn) => nn.id === id)?.label).filter(Boolean);
      msg.innerHTML = `<b>A</b> = ${picks[0]}  ·  <b>B</b> = ${picks[1]}`;
    }
  }
}
customElements.define('pivcab-app', PivcabApp);
</script>
