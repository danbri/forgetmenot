<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UK Prime Ministers</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf8f3;
    --surface: #ffffff;
    --surface-2: #f4f1ea;
    --ink: #1a1a1a;
    --ink-soft: #5a5a5a;
    --ink-mute: #8a8a8a;
    --accent: #2a4f76;
    --accent-on: #ffffff;
    --rule: #d8d4ca;
    --rule-soft: #e9e5db;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lift: 0 8px 24px rgba(0,0,0,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --surface: #1c1e22;
      --surface-2: #24272c;
      --ink: #ececec;
      --ink-soft: #b0b0b0;
      --ink-mute: #7a7a7a;
      --accent: #6da3d6;
      --accent-on: #0d1115;
      --rule: #2c2f35;
      --rule-soft: #25282d;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.5);
      --shadow-lift: 0 8px 24px rgba(0,0,0,0.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---- top bar -------------------------------------------------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--rule);
    padding: 8px 14px;
  }
  .topbar h1 {
    margin: 0; font-size: 15px; font-weight: 600;
    flex: 0 0 auto;
  }
  .topbar .crumbs {
    font-size: 12px; color: var(--ink-mute);
  }
  .topbar .count {
    margin-left: auto; font-size: 12px; color: var(--ink-soft);
    white-space: nowrap;
  }

  /* ---- controls strip ------------------------------------------- */
  .controls {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule-soft);
  }
  @media (min-width: 640px) {
    .controls { grid-template-columns: 1fr 180px; }
  }
  .search-input, .pivot-select {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    font: inherit; font-size: 14px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    -webkit-appearance: none;
    appearance: none;
  }
  .pivot-select {
    background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%23888' d='M4 6l4 4 4-4z'/></svg>") no-repeat right 8px center;
    background-size: 14px;
    padding-right: 28px;
  }
  .search-input:focus, .pivot-select:focus {
    outline: 2px solid var(--accent); outline-offset: -1px;
  }

  /* ---- layout --------------------------------------------------- */
  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }
  @media (min-width: 880px) {
    .layout { grid-template-columns: 200px 1fr; }
  }

  /* ---- facets sidebar ------------------------------------------- */
  .facets {
    padding: 12px 14px;
    border-bottom: 1px solid var(--rule-soft);
  }
  @media (min-width: 880px) {
    .facets { border-bottom: 0; border-right: 1px solid var(--rule-soft); }
  }
  .facet-group {
    margin-bottom: 10px;
  }
  .facet-head {
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--ink-mute);
    margin-bottom: 4px; font-weight: 600;
  }
  .facet-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .facet-btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 3px 8px;
    font: inherit; font-size: 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .facet-btn:hover { background: var(--surface-2); }
  .facet-btn[aria-pressed="true"] {
    background: var(--accent); color: var(--accent-on); border-color: var(--accent);
  }
  .facet-count {
    color: var(--ink-mute); margin-left: 4px; font-size: 11px;
  }
  .facet-btn[aria-pressed="true"] .facet-count {
    color: color-mix(in srgb, var(--accent-on) 70%, transparent);
  }

  /* ---- grid + groups ------------------------------------------- */
  main { padding: 12px 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  .pivot-group { margin-bottom: 22px; }
  .pivot-group-header {
    display: flex; align-items: baseline; gap: 8px;
    margin: 0 0 8px;
  }
  .pivot-group-name {
    font-weight: 600; font-size: 14px;
  }
  .pivot-group-n {
    font-size: 11px; color: var(--ink-mute);
  }

  .tile {
    background: var(--surface);
    border: 1px solid var(--rule-soft);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.25s ease;
    /* For browser-native list transitions (Safari 18+ / Chrome 111+). */
    view-transition-name: auto;
  }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .tile:active { transform: translateY(0); }
  .tile img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
    background: var(--surface-2);
    display: block;
  }
  .tile .body { padding: 6px 8px 8px; }
  .tile .name {
    font-size: 13px; line-height: 1.3;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .tile .meta {
    font-size: 11px; color: var(--ink-mute); margin-top: 2px;
  }

  /* Fade-in for newly-added tiles (filter / pivot change). */
  .tile.entering { animation: fade-in 0.3s ease both; }
  @keyframes fade-in {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }

  .loading {
    padding: 30px 0; text-align: center; color: var(--ink-mute);
  }
  .error {
    background: color-mix(in srgb, #c0392b 12%, transparent);
    color: #c0392b;
    padding: 12px; border-radius: 6px;
    font: 13px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre-wrap;
  }
  @media (prefers-color-scheme: dark) {
    .error { color: #ff9a8b; background: color-mix(in srgb, #ff9a8b 18%, transparent); }
  }

  /* ---- jump bar (the "navigate to" pivot we used to bury) ------ */
  .jump {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 20px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--rule-soft);
  }
  .jump-label {
    width: 100%; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-mute); font-weight: 600;
    margin-bottom: 2px;
  }
  .jump-btn {
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 6px 10px;
    font: inherit; font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .jump-btn:hover { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }

  /* ---- popover ------------------------------------------------- */
  .popover-backdrop {
    position: fixed; inset: 0;
    background: color-mix(in srgb, var(--bg) 70%, transparent);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
    overflow-y: auto;
  }
  .popover-backdrop.open {
    display: flex;
    animation: pop-fade 0.18s ease;
  }
  @keyframes pop-fade { from { opacity: 0 } to { opacity: 1 } }
  .popover {
    background: var(--surface);
    color: var(--ink);
    border-radius: 10px;
    max-width: 520px;
    width: 100%;
    padding: 16px;
    box-shadow: var(--shadow-lift);
    border: 1px solid var(--rule);
  }
  .popover-image-wrap {
    display: grid;
    place-items: center;
    background: var(--surface-2);
    border-radius: 6px;
    margin-bottom: 12px;
    aspect-ratio: 4 / 3;
    overflow: hidden;
  }
  .popover-image-wrap img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
  }
  .popover h3 { margin: 0 0 2px; font-size: 17px; }
  .popover .lifespan { color: var(--ink-mute); font-size: 13px; margin: 0 0 10px; }
  .popover dl { margin: 0 0 10px; font-size: 14px; }
  .popover dt {
    font-size: 11px; text-transform: uppercase;
    color: var(--ink-mute); letter-spacing: 0.05em; margin-top: 8px;
  }
  .popover dd { margin: 1px 0 0; }
  .popover .abstract {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    padding: 8px 10px;
    background: var(--surface-2);
    border-radius: 6px;
    margin: 6px 0 0;
    border-left: 3px solid var(--accent);
    min-height: 1.5em;
  }
  .popover .abstract.loading {
    color: var(--ink-mute); font-style: italic; padding: 8px 10px;
  }
  .popover .src-tag {
    font-size: 10px; color: var(--ink-mute);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-top: 4px;
  }
  .popover-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .popover-actions a, .popover-actions button {
    background: var(--accent); color: var(--accent-on); border: 0;
    border-radius: 4px; padding: 6px 10px; font: inherit; font-size: 13px;
    text-decoration: none; cursor: pointer; height: 30px;
  }
  .popover-actions .close {
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--rule);
  }

  /* ---- dev panel ----------------------------------------------- */
  #dev-toggle {
    position: fixed; bottom: 14px; right: 14px;
    background: var(--surface);
    color: var(--ink-soft);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 6px 12px;
    font: 12px/1 ui-monospace, Menlo, monospace;
    box-shadow: var(--shadow);
    cursor: pointer;
    z-index: 90;
  }
  #dev-toggle:hover { color: var(--ink); }
  #dev-panel {
    position: fixed; right: 14px; bottom: 50px;
    width: min(720px, calc(100vw - 28px));
    max-height: 70vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    box-shadow: var(--shadow-lift);
    padding: 12px;
    display: none;
    z-index: 90;
    font: 12px/1.45 ui-monospace, Menlo, monospace;
    color: var(--ink);
  }
  #dev-panel.open { display: block; }
  #dev-panel h4 {
    margin: 0 0 8px; font-size: 13px;
    color: var(--ink); display: flex; align-items: center; gap: 8px;
  }
  #dev-panel .dev-clear {
    margin-left: auto; background: var(--surface-2); color: var(--ink-soft);
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 2px 8px; font: inherit; cursor: pointer;
  }
  #dev-panel .dev-row {
    border-top: 1px solid var(--rule-soft);
    padding: 6px 0;
  }
  #dev-panel .dev-row:first-of-type { border-top: 0; }
  #dev-panel .dev-summary {
    display: flex; gap: 8px; align-items: baseline;
    color: var(--ink-soft);
    cursor: pointer;
  }
  #dev-panel .dev-summary .ok    { color: #2a8a3a; }
  #dev-panel .dev-summary .bad   { color: #c0392b; }
  #dev-panel .dev-summary .label { color: var(--ink); flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dev-panel .dev-summary .ms    { color: var(--ink-mute); }
  #dev-panel .dev-body {
    display: none;
    padding: 6px 0 4px;
  }
  #dev-panel .dev-body pre {
    background: var(--surface-2);
    color: var(--ink);
    padding: 8px; border-radius: 4px;
    white-space: pre-wrap; word-break: break-word;
    margin: 4px 0;
    max-height: 200px; overflow: auto;
  }
  #dev-panel .dev-row.expanded .dev-body { display: block; }
  @media (prefers-color-scheme: dark) {
    #dev-panel .dev-summary .ok  { color: #6acb6a; }
    #dev-panel .dev-summary .bad { color: #ff9a8b; }
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>UK Prime Ministers</h1>
  <span class="crumbs">· <a href="/kgx/demos/">demos</a></span>
  <span class="count" id="count">…</span>
</header>

<div class="controls">
  <input id="search" class="search-input" type="search" placeholder="Filter by name…" autocomplete="off">
  <select id="pivot" class="pivot-select">
    <option value="">Group: none</option>
    <option value="party">Group by party</option>
    <option value="startDecade">Group by decade</option>
    <option value="birthCentury">Group by birth century</option>
  </select>
</div>

<div class="layout">
  <aside class="facets" id="facets">
    <div class="loading">loading…</div>
  </aside>

  <main>
    <div id="results"><div class="loading">loading…</div></div>
    <div class="jump" id="jump" hidden>
      <span class="jump-label">From this selection →</span>
      <button class="jump-btn" data-jump="birthplaces">birthplaces</button>
      <button class="jump-btn" data-jump="parties">parties</button>
      <button class="jump-btn" data-jump="spouses">spouses</button>
      <button class="jump-btn" data-jump="reset" id="jump-reset" hidden>← back to PMs</button>
    </div>
  </main>
</div>

<button id="dev-toggle" type="button" aria-controls="dev-panel" aria-expanded="false">dev ·  <span id="dev-count">0</span></button>
<div id="dev-panel" role="region" aria-label="Dev request log">
  <h4>Request log <button class="dev-clear" type="button">clear</button></h4>
  <div id="dev-log"></div>
</div>

<div class="popover-backdrop" id="popover">
  <div class="popover" role="dialog" aria-modal="true" aria-labelledby="pop-title">
    <div class="popover-image-wrap"><img id="pop-img" alt=""></div>
    <h3 id="pop-title"></h3>
    <p class="lifespan" id="pop-lifespan"></p>
    <dl id="pop-fields"></dl>
    <dt class="src-tag">Wikipedia summary</dt>
    <p class="abstract loading" id="pop-abstract">loading…</p>
    <div class="popover-actions">
      <a id="pop-wd" target="_blank" rel="noopener">Wikidata</a>
      <a id="pop-dbp" target="_blank" rel="noopener">DBpedia</a>
      <button class="close" id="pop-close">Close</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
// QLever's Wikidata mirror is markedly faster than the official Blazegraph
// endpoint for our kind of join. Falls back nowhere — if QLever is down,
// the page surfaces the error and the dev panel shows the failed request.
const QLEVER   = 'https://qlever.dev/api/wikidata';
const WIKIPEDIA_SUMMARY = (title) => `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;

// Vanilla SPARQL — no SERVICE wikibase:label, no bd: predicates, runs on
// any Wikidata-aware endpoint (QLever, OpenLink Virtuoso, official WDQS).
// ?wpArticle reverse-binds the English Wikipedia article URI for each PM
// via schema:about — we slice the title off for the Wikipedia REST API.
const SEED_QUERY = `
PREFIX wd:     <http://www.wikidata.org/entity/>
PREFIX wdt:    <http://www.wikidata.org/prop/direct/>
PREFIX p:      <http://www.wikidata.org/prop/>
PREFIX ps:     <http://www.wikidata.org/prop/statement/>
PREFIX pq:     <http://www.wikidata.org/prop/qualifier/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>
PREFIX schema: <http://schema.org/>

SELECT ?pm ?pmLabel ?image ?start ?party ?partyLabel ?birthPlace ?birthPlaceLabel ?birth ?wpArticle WHERE {
  ?pm p:P39 ?term .
  ?term ps:P39 wd:Q14211 ; pq:P580 ?start .
  OPTIONAL { ?pm wdt:P18  ?image }
  OPTIONAL { ?pm wdt:P102 ?party .
             OPTIONAL { ?party rdfs:label ?partyLabel . FILTER(lang(?partyLabel) = "en") } }
  OPTIONAL { ?pm wdt:P19  ?birthPlace .
             OPTIONAL { ?birthPlace rdfs:label ?birthPlaceLabel . FILTER(lang(?birthPlaceLabel) = "en") } }
  OPTIONAL { ?pm wdt:P569 ?birth }
  OPTIONAL { ?pm rdfs:label ?pmLabel . FILTER(lang(?pmLabel) = "en") }
  OPTIONAL { ?wpArticle schema:about ?pm ; schema:isPartOf <https://en.wikipedia.org/> }
}
ORDER BY DESC(?start)
`;

let ROWS = [];          // [{ pm, label, image, start, birth, wpArticle, parties[], birthplaces[] }]
let FILTERS = {};
let SEARCH  = '';
let PIVOT   = '';
let VIEW    = 'pms';
let SUB_ROWS = [];
let lastVisibleIds = new Set();

// All HTTP requests funnel through net() so the dev panel + console get
// a uniform entry per request.
const REQ_LOG = [];
function net(label, url, query) {
  const t0 = performance.now();
  const entry = {
    t: new Date().toISOString().replace('T', ' ').replace('Z', ''),
    label, url, query: query || null,
    ms: null, status: null, bytes: null, ok: false, error: null,
  };
  REQ_LOG.unshift(entry);
  if (REQ_LOG.length > 100) REQ_LOG.length = 100;
  const finish = (res, text, err) => {
    entry.ms = Math.round(performance.now() - t0);
    entry.status = res ? res.status : 0;
    entry.bytes = text ? text.length : 0;
    entry.ok = !!(res && res.ok);
    entry.error = err ? String(err.message || err) : null;
    console.log('[net]', label, url, { ms: entry.ms, status: entry.status, bytes: entry.bytes, query });
    renderDevLog();
  };
  return fetch(url, { headers: { 'Accept': label.startsWith('sparql') ? 'application/sparql-results+json' : 'application/json' } })
    .then(async (res) => {
      const text = await res.text();
      finish(res, text);
      if (!res.ok) throw new Error(label + ': HTTP ' + res.status);
      return JSON.parse(text);
    })
    .catch((err) => { finish(null, null, err); throw err; });
}

async function sparql(endpoint, query, label = 'sparql') {
  const u = new URL(endpoint);
  u.searchParams.set('query', query);
  return net(label, u.toString(), query);
}

// ---------------------------------------------------------------------------
// DOM
// ---------------------------------------------------------------------------
const $facets   = document.getElementById('facets');
const $results  = document.getElementById('results');
const $count    = document.getElementById('count');
const $jump     = document.getElementById('jump');
const $jumpReset = document.getElementById('jump-reset');

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
function httpsify(u) { return String(u || '').replace(/^http:\/\//, 'https://'); }
function imgAtWidth(href, w) {
  if (!href) return '';
  const u = httpsify(href);
  if (/commons\.wikimedia\.org\/wiki\/Special:FilePath\//i.test(u)) {
    return u + (u.includes('?') ? '&' : '?') + 'width=' + w;
  }
  return u;
}

function dedupe(bindings) {
  const byPm = new Map();
  for (const b of bindings) {
    const k = b.pm.value;
    if (!byPm.has(k)) {
      byPm.set(k, {
        pm: k,
        label: b.pmLabel ? b.pmLabel.value : k.replace(/^.*\//, ''),
        image: b.image ? b.image.value : null,
        start: b.start ? b.start.value : null,
        birth: b.birth ? b.birth.value : null,
        wpArticle: b.wpArticle ? b.wpArticle.value : null,
        parties: new Set(),
        birthplaces: new Set(),
      });
    }
    const e = byPm.get(k);
    if (b.partyLabel)        e.parties.add(b.partyLabel.value);
    if (b.birthPlaceLabel)   e.birthplaces.add(b.birthPlaceLabel.value);
  }
  return [...byPm.values()].map((e) => ({
    ...e,
    parties: [...e.parties].sort(),
    birthplaces: [...e.birthplaces].sort(),
  }));
}

function wikipediaTitle(articleUri) {
  if (!articleUri) return null;
  const m = articleUri.match(/\/wiki\/(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}

function birthCentury(row) {
  if (!row.birth) return null;
  const y = parseInt(row.birth.slice(0, 4), 10);
  return isFinite(y) ? `${Math.floor((y - 1) / 100) + 1}c` : null;
}
function startDecade(row) {
  if (!row.start) return null;
  const y = parseInt(row.start.slice(0, 4), 10);
  return isFinite(y) ? `${Math.floor(y / 10) * 10}s` : null;
}
function facetValues(row, facet) {
  if (facet === 'party')        return row.parties;
  if (facet === 'birthCentury') return birthCentury(row) ? [birthCentury(row)] : [];
  if (facet === 'startDecade')  return startDecade(row) ? [startDecade(row)] : [];
  return [];
}

function applyFilters(rows) {
  const needle = SEARCH.trim().toLowerCase();
  return rows.filter((r) => {
    if (needle && !(r.label || '').toLowerCase().includes(needle)) return false;
    for (const [facet, vals] of Object.entries(FILTERS)) {
      if (!vals.size) continue;
      const rowVals = facetValues(r, facet);
      if (!rowVals.some((v) => vals.has(v))) return false;
    }
    return true;
  });
}

function tally(rows, facet) {
  const counts = new Map();
  for (const r of rows) for (const v of facetValues(r, facet)) {
    counts.set(v, (counts.get(v) || 0) + 1);
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1]);
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function tileHtml(r, idx, currentIds) {
  const meta = [r.start ? r.start.slice(0,4) : '', r.parties && r.parties[0] || ''].filter(Boolean).join(' · ');
  const isNew = !lastVisibleIds.has(r.pm);
  return `<div class="tile ${isNew ? 'entering' : ''}" data-idx="${idx}">`
    + (r.image
        ? `<img loading="lazy" src="${esc(imgAtWidth(r.image, 240))}" alt="${esc(r.label)}">`
        : `<div style="aspect-ratio:1/1;background:var(--surface-2);"></div>`)
    + `<div class="body"><div class="name">${esc(r.label)}</div>`
    + (meta ? `<div class="meta">${esc(meta)}</div>` : '')
    + `</div></div>`;
}

function renderFacets() {
  if (VIEW !== 'pms') { $facets.innerHTML = ''; return; }
  const visible = applyFilters(ROWS);
  const facets = [['party', 'Party'], ['startDecade', 'Decade'], ['birthCentury', 'Born']];
  $facets.innerHTML = facets.map(([key, label]) => {
    const tallies = tally(visible, key);
    const filterSet = FILTERS[key] || new Set();
    if (!tallies.length) return '';
    return `<div class="facet-group">`
      + `<div class="facet-head">${esc(label)}</div>`
      + `<div class="facet-row">`
      + tallies.map(([val, n]) =>
          `<button class="facet-btn" aria-pressed="${filterSet.has(val) ? 'true' : 'false'}" data-facet="${esc(key)}" data-val="${esc(val)}">${esc(val)}<span class="facet-count">${n}</span></button>`
        ).join('')
      + `</div></div>`;
  }).join('');
  $facets.querySelectorAll('.facet-btn').forEach((b) => {
    b.addEventListener('click', () => {
      const f = b.getAttribute('data-facet'), v = b.getAttribute('data-val');
      FILTERS[f] = FILTERS[f] || new Set();
      FILTERS[f].has(v) ? FILTERS[f].delete(v) : FILTERS[f].add(v);
      renderAll();
    });
  });
}

function renderGrid() {
  let rows, label;
  if (VIEW === 'pms') {
    rows = applyFilters(ROWS);
    label = `${rows.length} of ${ROWS.length}`;
  } else {
    rows = SUB_ROWS;
    label = `${rows.length} ${VIEW}`;
  }
  $count.textContent = label;

  if (!rows.length) {
    $results.innerHTML = '<div class="loading">No matches.</div>';
    lastVisibleIds = new Set();
    return;
  }

  const useTransition = document.startViewTransition && (lastVisibleIds.size > 0);
  const renderBody = () => {
    if (VIEW === 'pms' && PIVOT) {
      const groups = new Map();
      rows.forEach((r, idx) => {
        const vals = facetValues(r, PIVOT);
        const keys = vals.length ? vals : ['(unknown)'];
        for (const v of keys) {
          if (!groups.has(v)) groups.set(v, []);
          groups.get(v).push({ row: r, idx });
        }
      });
      const ordered = [...groups.entries()].sort((a, b) => {
        if (a[0] === '(unknown)') return 1;
        if (b[0] === '(unknown)') return -1;
        return b[1].length - a[1].length;
      });
      $results.innerHTML = ordered.map(([name, items]) =>
        `<div class="pivot-group">`
        + `<div class="pivot-group-header"><span class="pivot-group-name">${esc(name)}</span><span class="pivot-group-n">${items.length}</span></div>`
        + `<div class="grid">${items.map(({ row, idx }) => tileHtml(row, idx)).join('')}</div>`
        + `</div>`
      ).join('');
    } else {
      $results.innerHTML = '<div class="grid">' + rows.map((r, idx) => tileHtml(r, idx)).join('') + '</div>';
    }
    $results.querySelectorAll('.tile').forEach((tile) => {
      tile.addEventListener('click', () => {
        const idx = parseInt(tile.getAttribute('data-idx'), 10);
        openPopover(rows[idx]);
      });
    });
    lastVisibleIds = new Set(rows.map((r) => r.pm));
  };
  if (useTransition) document.startViewTransition(renderBody);
  else renderBody();
}

function renderJump() {
  $jump.hidden = VIEW !== 'pms' && VIEW !== 'birthplaces' && VIEW !== 'parties' && VIEW !== 'spouses';
  $jumpReset.hidden = VIEW === 'pms';
}

function renderAll() { renderFacets(); renderGrid(); renderJump(); }

// ---------------------------------------------------------------------------
// Popover — second data source pulled live from the Wikipedia REST API
// (Wikidata gave us the article URI via schema:about in the seed query).
// ---------------------------------------------------------------------------
const ABSTRACT_CACHE = new Map();

async function loadAbstract(wpArticle) {
  if (!wpArticle) return null;
  if (ABSTRACT_CACHE.has(wpArticle)) return ABSTRACT_CACHE.get(wpArticle);
  const title = wikipediaTitle(wpArticle);
  if (!title) return null;
  try {
    const json = await net('wikipedia-summary', WIKIPEDIA_SUMMARY(title));
    const text = json && json.extract;
    ABSTRACT_CACHE.set(wpArticle, text || null);
    return text || null;
  } catch (e) {
    return null;
  }
}

function openPopover(row) {
  if (!row) return;
  const pop  = document.getElementById('popover');
  const img  = document.getElementById('pop-img');
  const tit  = document.getElementById('pop-title');
  const span = document.getElementById('pop-lifespan');
  const dl   = document.getElementById('pop-fields');
  const wd   = document.getElementById('pop-wd');
  const dbp  = document.getElementById('pop-dbp');
  const abs  = document.getElementById('pop-abstract');

  img.src = row.image ? imgAtWidth(row.image, 500) : '';
  img.alt = row.label || '';
  img.parentElement.style.display = row.image ? '' : 'none';
  tit.textContent = row.label;
  const birthY = row.birth ? row.birth.slice(0, 4) : '';
  const startY = row.start ? row.start.slice(0, 4) : '';
  span.textContent = [birthY ? `b. ${birthY}` : '', startY ? `office ${startY}` : ''].filter(Boolean).join(' · ');

  dl.innerHTML = '';
  const fields = [
    ['Party', (row.parties || []).join(', ')],
    ['Birthplace', (row.birthplaces || []).join(', ')],
  ];
  for (const [k, v] of fields) {
    if (!v) continue;
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    dl.appendChild(dt); dl.appendChild(dd);
  }

  wd.href = row.pm;
  if (row.wpArticle) { dbp.href = row.wpArticle; dbp.style.display = ''; dbp.textContent = 'Wikipedia'; }
  else dbp.style.display = 'none';

  abs.className = 'abstract loading';
  abs.textContent = row.wpArticle ? 'loading…' : '(no English Wikipedia article)';
  if (row.wpArticle) {
    loadAbstract(row.wpArticle).then((text) => {
      abs.className = 'abstract';
      abs.textContent = text || '(no summary)';
    });
  }

  pop.classList.add('open');
}

function closePopover() { document.getElementById('popover').classList.remove('open'); }
document.getElementById('pop-close').addEventListener('click', closePopover);
document.getElementById('popover').addEventListener('click', (e) => { if (e.target.id === 'popover') closePopover(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopover(); });

// ---------------------------------------------------------------------------
// "From this selection" jumps — run inline, don't bounce to playground
// ---------------------------------------------------------------------------
async function jumpTo(target) {
  if (target === 'reset') {
    VIEW = 'pms'; SUB_ROWS = [];
    renderAll();
    return;
  }
  const visible = applyFilters(ROWS);
  if (!visible.length) return;
  const qids = visible.map((r) => '<' + r.pm + '>').join(' ');
  let q;
  // Portable SPARQL — no SERVICE wikibase:label so QLever accepts it.
  const LABELS = `PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>`;
  if (target === 'birthplaces') {
    q = `${LABELS}
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
SELECT DISTINCT ?place ?placeLabel ?image WHERE {
  VALUES ?pm { ${qids} }
  ?pm wdt:P19 ?place .
  OPTIONAL { ?place wdt:P18 ?image }
  OPTIONAL { ?place rdfs:label ?placeLabel . FILTER(lang(?placeLabel) = "en") }
} LIMIT 60`;
  } else if (target === 'parties') {
    q = `${LABELS}
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
SELECT ?party ?partyLabel ?image (COUNT(?pm) AS ?n) WHERE {
  VALUES ?pm { ${qids} }
  ?pm wdt:P102 ?party .
  OPTIONAL { ?party wdt:P154 ?image }
  OPTIONAL { ?party rdfs:label ?partyLabel . FILTER(lang(?partyLabel) = "en") }
} GROUP BY ?party ?partyLabel ?image ORDER BY DESC(?n)`;
  } else if (target === 'spouses') {
    q = `${LABELS}
PREFIX wdt: <http://www.wikidata.org/prop/direct/>
SELECT DISTINCT ?person ?personLabel ?image WHERE {
  VALUES ?pm { ${qids} }
  ?pm wdt:P26 ?person .
  OPTIONAL { ?person wdt:P18 ?image }
  OPTIONAL { ?person rdfs:label ?personLabel . FILTER(lang(?personLabel) = "en") }
} LIMIT 60`;
  } else return;

  $results.innerHTML = '<div class="loading">running…</div>';
  try {
    const j = await sparql(QLEVER, q, 'sparql:jump-' + target);
    SUB_ROWS = j.results.bindings.map((b) => {
      const uri = (b.place || b.party || b.person).value;
      const label = (b.placeLabel || b.partyLabel || b.personLabel) ? (b.placeLabel || b.partyLabel || b.personLabel).value : uri.replace(/^.*\//, '');
      return {
        pm: uri, label,
        image: b.image ? b.image.value : null,
        parties: [],
        birthplaces: [],
        n: b.n ? b.n.value : null,
      };
    });
    VIEW = target;
    lastVisibleIds = new Set();
    renderAll();
  } catch (e) {
    $results.innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}
document.querySelectorAll('.jump-btn').forEach((b) => {
  b.addEventListener('click', () => jumpTo(b.getAttribute('data-jump')));
});

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
document.getElementById('search').addEventListener('input', (e) => {
  SEARCH = e.target.value;
  renderAll();
});
document.getElementById('pivot').addEventListener('change', (e) => {
  PIVOT = e.target.value;
  renderGrid();
});

// ---------------------------------------------------------------------------
// Dev panel — render the request log into the slide-up panel.
// ---------------------------------------------------------------------------
const $devToggle = document.getElementById('dev-toggle');
const $devPanel  = document.getElementById('dev-panel');
const $devLog    = document.getElementById('dev-log');
const $devCount  = document.getElementById('dev-count');

function renderDevLog() {
  $devCount.textContent = REQ_LOG.length;
  $devLog.innerHTML = REQ_LOG.map((e, i) => {
    const tag = e.ok ? `<span class="ok">${e.status}</span>`
              : e.error ? `<span class="bad">err</span>`
              : `<span class="bad">${e.status}</span>`;
    const summary = e.url.replace(/^https?:\/\//, '').slice(0, 80);
    return `<div class="dev-row" data-i="${i}">`
      + `<div class="dev-summary">`
      + `<span>${e.t.split(' ')[1] || ''}</span>`
      + tag
      + `<span class="label">${esc(e.label)} · ${esc(summary)}</span>`
      + `<span class="ms">${e.ms ?? '—'}ms · ${(e.bytes || 0).toLocaleString()}b</span>`
      + `</div>`
      + `<div class="dev-body">`
      + `<div><b>URL:</b> ${esc(e.url)}</div>`
      + (e.query ? `<pre>${esc(e.query)}</pre>` : '')
      + (e.error ? `<div class="bad">${esc(e.error)}</div>` : '')
      + `</div></div>`;
  }).join('');
  $devLog.querySelectorAll('.dev-summary').forEach((s) => {
    s.addEventListener('click', () => s.parentElement.classList.toggle('expanded'));
  });
}
$devToggle.addEventListener('click', () => {
  const open = $devPanel.classList.toggle('open');
  $devToggle.setAttribute('aria-expanded', open);
});
$devPanel.querySelector('.dev-clear').addEventListener('click', () => {
  REQ_LOG.length = 0;
  renderDevLog();
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
(async () => {
  try {
    const j = await sparql(QLEVER, SEED_QUERY, 'sparql:seed');
    ROWS = dedupe(j.results.bindings);
    renderAll();
  } catch (e) {
    $results.innerHTML = `<div class="error">Failed to load: ${esc(e.message)}</div>`;
    $facets.innerHTML = '';
    $count.textContent = '';
  }
})();
</script>
</body>
