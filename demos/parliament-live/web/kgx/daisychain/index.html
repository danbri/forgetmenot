                    display: -webkit-box; -webkit-line-clamp: 2;
                    -webkit-box-orient: vertical; overflow: hidden; }
        .tile .mt { font-size: 10px; color: var(--ink-mute); margin-top: 2px;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      </style>
      <header>
        <h1>daisychain</h1>
        <span class="crumb">· <a href="/kgx/">kgx</a></span>
        <div class="actions">
          <div class="seg" role="tablist" aria-label="view">
            <button id="v-spine" data-v="spine" class="on" title="vertical bead spine">spine</button>
            <button id="v-graph" data-v="graph" title="DAG of the chain">graph</button>
            <button id="v-table" data-v="table" title="bead table">table</button>
            <button id="v-tiles" data-v="tiles" title="full tile grid of the frontier bead">tiles</button>
            <button id="v-map"   data-v="map"   title="map of the frontier bead (when coords are known)">map</button>
          </div>
          <button id="save-btn" title="copy this chain as JSON">⎘ save chain</button>
          <button id="reset-btn" title="start over">↺ reset</button>
        </div>
      </header>
      <p class="lead" id="lead">
        A chain of beads. Each bead is a typed set; each chip on the frontier
        bead grows the chain. Four views of the same chain: spine, graph,
        table, tiles.
      </p>
      <div id="view-root"></div>
      <div class="foot">
        Contains Parliamentary information licensed under the
        <a href="https://www.parliament.uk/site-information/copyright-parliament/open-parliament-licence/"
           target="_blank" rel="noopener">Open Parliament Licence v3.0</a>.
        Wikidata content via QLever, CC0.
      </div>
    `;
    this.addEventListener('starter-pick', (e) => this._kickoff(e.detail));
    this.addEventListener('library-pick', (e) => this._replay(e.detail));
    this.addEventListener('op-tap',       (e) => this._onOp(e.detail));
    this.addEventListener('bead-undo',    (e) => this._undoTo(e.detail.index));
    this.addEventListener('card-chip',    (e) => this._onCardChip(e.detail));
    this.addEventListener('thing-open',   (e) => this._openThing(e.detail.item, e.detail.bundle?.type));
    this.shadowRoot.querySelector('#reset-btn').addEventListener('click', () => this._reset());
    this.shadowRoot.querySelector('#save-btn').addEventListener('click', () => this._saveChain());
    for (const btn of this.shadowRoot.querySelectorAll('.seg button')) {
      btn.addEventListener('click', () => { state.view = btn.dataset.v; publish(); });
    }
    listeners.add(() => this._render());
    this._render();
  }

  async _kickoff(starter) {
    state.starter = starter;
    const lead = this.shadowRoot.querySelector('#lead');
    lead.textContent = `loading ${starter.label} …`;
    try {
      const { items, source } = await loadStarter(starter);
      const bundle = new Bundle(items, starter.type, starter.label);
      pushBead('source', '●', bundle, [source], { kind: 'starter', id: starter.id });
      const sitting = items.filter((x) => x.sitting).length;
      const bridged = items.filter((x) => x.mpid).length;
      lead.innerHTML = `<b>${items.length.toLocaleString()}</b> ${starter.type}s loaded · `
        + `<b>${sitting.toLocaleString()}</b> sitting now · `
        + `<b>${bridged.toLocaleString()}</b> bridged to the Members API. `
        + `Tap a chip on the bottom bead to grow the chain.`;
    } catch (err) {
      this.shadowRoot.querySelector('#view-root').innerHTML =
        `<div class="err">load failed: ${err.message}</div>`;
    }
  }

  async _onOp({ op, bundle }) {
    if (op.kind === 'static') {
      const out = op.run(bundle);
      const src = makeSource({
        kind: `filter:${op.id}`, ms: 0,
        note: `client-side filter "${op.label}" applied to ${bundle.size} → ${out.size}`,
      });
      pushBead(op.label, op.icon, out, [src], { kind: 'op', op: op.id });
      return;
    }
    if (op.kind === 'async') {
      const lead = this.shadowRoot.querySelector('#lead');
      const prev = lead.innerHTML;
      lead.textContent = `${op.icon} ${op.label} — running over ${bundle.size.toLocaleString()} ${bundle.type}s…`;
      try {
        const out = await op.run(bundle);
        const newBundle = out instanceof Bundle ? out : out.bundle;
        const sources = out instanceof Bundle ? [] : [out.source];
        pushBead(op.label, op.icon, newBundle, sources, { kind: 'op', op: op.id });
        lead.innerHTML = prev;
      } catch (err) {
        lead.innerHTML = `<span style="color:#c33">${escapeHTML(op.label)} failed: ${escapeHTML(err.message)}</span>`;
      }
      return;
    }
    if (op.kind === 'rel-picker') {
      const sheet = document.createElement('daisy-rel-picker');
      sheet.addEventListener('rel-pick', async (e) => {
        const { template, variant } = e.detail;
        const lead = this.shadowRoot.querySelector('#lead');
        const prev = lead.innerHTML;
        lead.textContent = `⇄ ${template.label} · ${variant.label} (${variant.kind}) — running…`;
        try {
          const out = await applyRelation(template, variant, bundle);
          pushBead(`${template.label} · ${variant.label}`, '⇄',
                   out.bundle, [out.source],
                   { kind: 'op', op: 'rel-pivot',
                     template: template.id, variant: variant.id });
          lead.innerHTML = prev;
        } catch (err) {
          lead.innerHTML = `<span style="color:#c33">${escapeHTML(template.label)} / ${escapeHTML(variant.label)} failed: ${escapeHTML(err.message)}</span>`;
        }
      });
      sheet.open(bundle);
      return;
    }
    // picker
    const sheet = document.createElement('daisy-picker');
    sheet.addEventListener('pick', (e) => {
      const out = e.detail.op.run(bundle, e.detail.value);
      const extra = out._opNote ? ` · ${out._opNote}` : '';
      const src = makeSource({
        kind: `filter:${e.detail.op.id}:${e.detail.value}`, ms: 0,
        note: `client-side picker "${e.detail.op.label}" = "${e.detail.value}" applied to ${bundle.size} → ${out.size}${extra}`,
      });
      pushBead(`${e.detail.op.label.replace(/…$/, '')}: ${e.detail.value}`, e.detail.op.icon, out, [src],
               { kind: 'op', op: e.detail.op.id, value: e.detail.value });
    });
    sheet.open(op, bundle);
  }

  // Handle cardinality-response chips (broaden a too-narrow last step, or
  // narrow a too-large bead with top-N).
  // Open the single-item details overlay from a thumb / tile click.
  // Tolerates being called with either a bundle or just a bundleType.
  _openThing(item, bundleType) {
    if (!item) return;
    const sheet = document.createElement('daisy-thing-sheet');
    sheet.open(item, typeof bundleType === 'string' ? bundleType : bundleType?.type);
  }

  async _onCardChip(cc) {
    if (cc.kind === 'broaden-variant') {
      const parent = state.beads[cc.parentIdx];
      if (!parent?.bundle) return;
      const lead = this.shadowRoot.querySelector('#lead');
      const prev = lead.innerHTML;
      lead.textContent = `🔧 broaden ${cc.template.label} → ${cc.variant.label} (re-running over ${parent.bundle.size.toLocaleString()} ${parent.bundle.type}s)…`;
      try {
        const out = await applyRelation(cc.template, cc.variant, parent.bundle);
        pushBead(`${cc.template.label} · ${cc.variant.label}`, '⇄',
                 out.bundle, [out.source],
                 { kind: 'op', op: 'rel-pivot',
                   template: cc.template.id, variant: cc.variant.id });
        lead.innerHTML = prev;
      } catch (err) {
        lead.innerHTML = `<span style="color:#c33">broaden failed: ${escapeHTML(err.message)}</span>`;
      }
      return;
    }
    if (cc.kind === 'top-n') {
      const front = state.beads[state.beads.length - 1];
      if (!front?.bundle) return;
      const ranked = [...front.bundle.items]
        .filter((x) => rankValue(x, cc.field) != null)
        .sort((a, b) => {
          const va = rankValue(a, cc.field), vb = rankValue(b, cc.field);
          if (typeof va === 'string') return String(vb).localeCompare(String(va));
          return vb - va;
        })
        .slice(0, cc.n);
      const out = new Bundle(ranked, front.bundle.type,
                             `${front.bundle.label} · top ${cc.n} by ${cc.field}`);
      const src = makeSource({
        kind: `narrow:top-${cc.n}:${cc.field}`, ms: 0,
        note: `client-side narrow: top ${cc.n} of ${front.bundle.size} ranked by ${cc.field} desc`,
      });
      pushBead(`top ${cc.n} by ${cc.field}`, '🔧', out, [src],
               { kind: 'op', op: 'narrow-top-n', n: cc.n, field: cc.field });
      return;
    }
  }

  // Replay a saved chain step-by-step. Awaits async ops; surfaces failures.
  async _replay(entry) {
    state.beads = [];
    state.starter = null;
    publish();
    for (const step of entry.steps || []) {
      try {
        if (step.kind === 'starter') {
          const s = STARTERS.find((x) => x.id === step.id);
          if (!s) throw new Error('unknown starter ' + step.id);
          await this._kickoff(s);
        } else if (step.kind === 'op') {
          const front = state.beads[state.beads.length - 1];
          if (!front?.bundle) throw new Error('no frontier bead for op ' + step.op);
          // Relation-pivot is replayed directly from {template, variant}
          // rather than via the OPS-keyed-by-type lookup — the chip is
          // always called 'pivot' (kind 'rel-picker') but the spec records
          // the synthetic op id 'rel-pivot'. Without this shortcut the
          // OPS.find for 'rel-pivot' fails as "op not in OPS[<type>]".
          if (step.op === 'rel-pivot') {
            const tpl = REL_TEMPLATES.find((t) => t.id === step.template);
            const v   = tpl?.variants.find((x) => x.id === step.variant);
            if (!tpl || !v) throw new Error(`unknown rel template ${step.template}/${step.variant}`);
            const out = await applyRelation(tpl, v, front.bundle);
            pushBead(`${tpl.label} · ${v.label}`, '⇄', out.bundle, [out.source],
                     { kind: 'op', op: 'rel-pivot', template: tpl.id, variant: v.id });
            continue;
          }
          const ops = OPS[front.bundle.type] || [];
          const op = ops.find((o) => o.id === step.op);
          if (!op) throw new Error(`op "${step.op}" not in OPS[${front.bundle.type}]`);
          if (op.kind === 'static') {
            await this._onOp({ op, bundle: front.bundle });
          } else if (op.kind === 'async') {
            await this._onOp({ op, bundle: front.bundle });
          } else if (op.kind === 'picker') {
            // Use the saved value directly, skipping the picker sheet.
            const out = op.run(front.bundle, step.value);
            const extra = out._opNote ? ` · ${out._opNote}` : '';
            const src = makeSource({
              kind: `filter:${op.id}:${step.value}`, ms: 0,
              note: `replay picker "${op.label}" = "${step.value}"${extra}`,
            });
            pushBead(`${op.label.replace(/…$/, '')}: ${step.value}`, op.icon, out, [src],
                     { kind: 'op', op: op.id, value: step.value });
          } else if (op.kind === 'rel-picker') {
            const tpl = REL_TEMPLATES.find((t) => t.id === step.template);
            const v   = tpl?.variants.find((x) => x.id === step.variant);
            if (!tpl || !v) throw new Error(`unknown rel template ${step.template}/${step.variant}`);
            const out = await applyRelation(tpl, v, front.bundle);
            pushBead(`${tpl.label} · ${v.label}`, '⇄', out.bundle, [out.source],
                     { kind: 'op', op: 'rel-pivot', template: tpl.id, variant: v.id });
          }
        }
      } catch (err) {
        const lead = this.shadowRoot.querySelector('#lead');
        lead.innerHTML = `<span style="color:#c33">replay failed at ${escapeHTML(step.kind)} ${escapeHTML(step.op || step.id || '')}: ${escapeHTML(err.message)}</span>`;
        return;
      }
    }
    if (entry.suggestView) { state.view = entry.suggestView; publish(); }
  }

  _saveChain() {
    const spec = currentChainSpec();
    if (!spec.length) return;
    const payload = { title: 'untitled chain', steps: spec };
    const text = JSON.stringify(payload, null, 2);
    try {
      navigator.clipboard?.writeText(text);
    } catch {}
    const lead = this.shadowRoot.querySelector('#lead');
    lead.innerHTML = `✓ chain copied to clipboard — <b>${spec.length}</b> steps. `
      + `<details style="display:inline"><summary>show JSON</summary><pre style="white-space:pre-wrap;font:11px ui-monospace,Menlo,monospace;">${escapeHTML(text)}</pre></details>`;
  }

  _undoTo(idx) { truncateTo(idx); }

  _reset() {
    state.starter = null;
    state.beads = [];
    publish();
    this.shadowRoot.querySelector('#lead').textContent =
      'A chain of beads. Tap a starter to begin.';
  }

  _render() {
    // Sync the view-segment buttons to current state.
    for (const btn of this.shadowRoot.querySelectorAll('.seg button')) {
      btn.classList.toggle('on', btn.dataset.v === state.view);
    }
    const root = this.shadowRoot.querySelector('#view-root');
    root.innerHTML = '';
    if (!state.beads.length) {
      const starter = document.createElement('daisy-starter');
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.appendChild(starter);
      root.appendChild(empty);
      return;
    }
    // Map view button greys out unless the frontier has any item with coords.
    const front = state.beads[state.beads.length - 1];
    // Map button stays lit if ANY bead in the chain has coords — the
    // renderer falls back to the most-recent mappable bead, so a chain
    // that pivoted from buildings to architects can still show the
    // buildings on the map.
    const hasCoords = state.beads.some((bd) =>
      bd.bundle?.items?.some((x) => x.coords || x.extra?.birthplace?.coords));
    const mapBtn = this.shadowRoot.querySelector('#v-map');
    mapBtn.disabled = !hasCoords;
    mapBtn.style.opacity = hasCoords ? '1' : '0.45';
    mapBtn.title = hasCoords
      ? 'map the frontier bead'
      : 'enrich (✨) the bead or pivot to places to populate this view';
    switch (state.view) {
      case 'graph':  this._renderGraph(root); break;
      case 'table':  this._renderTable(root); break;
      case 'tiles':  this._renderTiles(root); break;
      case 'map':    this._renderMap(root);   break;
      case 'spine':
      default:       this._renderSpine(root); break;
    }
  }

  _renderSpine(root) {
    const spine = document.createElement('div');
    spine.className = 'spine';
    const last = state.beads.length - 1;
    for (let i = 0; i <= last; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'bead-wrap';
      if (i === last) wrap.setAttribute('frontier', '');
      const bead = document.createElement('daisy-bead');
      bead.bead = state.beads[i];
      bead.index = i;
      bead.frontier = (i === last);
      wrap.appendChild(bead);
      spine.appendChild(wrap);
    }
    root.appendChild(spine);
    requestAnimationFrame(() => {
      const last = spine.querySelector('.bead-wrap[frontier]');
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }

  _renderGraph(root) {
    // Horizontal DAG of the linear chain — same data as the spine,
    // laid out left-to-right with curved SVG edges between cards.
    const wrap = document.createElement('div');
    wrap.className = 'graph-wrap';
    const g = document.createElement('div');
    g.className = 'graph';
    const last = state.beads.length - 1;
    for (let i = 0; i <= last; i++) {
      const b = state.beads[i];
      const card = document.createElement('div');
      card.className = 'gnode' + (i === last ? ' frontier' : '');
      const thumbs = (b.bundle?.items || []).filter((x) => x.image).slice(0, 6);
      const stripHTML = thumbs.map((p) =>
        `<img alt="" data-src="${commonsThumb(p.image, 56)}">`).join('');
      card.innerHTML = `
        <span class="kind">${i === 0 ? 'source' : (last && i === last ? 'frontier' : 'step')}</span>
        <div class="title"></div>
        <div class="cnt"></div>
        <div class="strip">${stripHTML}</div>
        <div style="font-size:11px;color:var(--ink-mute);">${b.opIcon || ''} ${b.opLabel || ''}</div>
      `;
      card.querySelector('.title').textContent = b.bundle?.label || '';
      card.querySelector('.cnt').textContent = (b.bundle?.size ?? 0).toLocaleString();
      card.addEventListener('click', () => {
        if (i === last) return;
        // Same back-gesture as spine: tap an older node to truncate.
        this._undoTo(i);
      });
      for (const img of card.querySelectorAll('img[data-src]')) tileIo.observe(img);
      g.appendChild(card);
    }
    // SVG overlay for edges
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('gedges');
    svg.innerHTML = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--spine)"/>
        </marker>
      </defs>
      <g class="paths"></g>
    `;
    wrap.appendChild(g);
    wrap.appendChild(svg);
    root.appendChild(wrap);
    requestAnimationFrame(() => this._drawGraphEdges(wrap, g, svg));
  }

  _drawGraphEdges(wrap, g, svg) {
    const cards = g.querySelectorAll('.gnode');
    const wrapBox = wrap.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${wrap.scrollWidth} ${wrap.clientHeight}`);
    svg.setAttribute('width', wrap.scrollWidth);
    svg.setAttribute('height', wrap.clientHeight);
    svg.style.width = wrap.scrollWidth + 'px';
    svg.style.height = wrap.clientHeight + 'px';
    const paths = svg.querySelector('.paths');
    paths.innerHTML = '';
    for (let i = 0; i < cards.length - 1; i++) {
      const a = cards[i].getBoundingClientRect();
      const b = cards[i + 1].getBoundingClientRect();
      const x1 = a.right - wrapBox.left + wrap.scrollLeft;
      const y1 = a.top   - wrapBox.top + a.height / 2;
      const x2 = b.left  - wrapBox.left + wrap.scrollLeft;
      const y2 = b.top   - wrapBox.top + b.height / 2;
      const dx = Math.max(20, (x2 - x1) / 2);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2 - 4} ${y2}`);
      paths.appendChild(path);
    }
    // Scroll to frontier
    const front = g.querySelector('.gnode.frontier');
    if (front) front.scrollIntoView({ behavior: 'smooth', inline: 'end', block: 'nearest' });
  }

  _renderTable(root) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const last = state.beads.length - 1;
    const rows = state.beads.map((b, i) => {
      const sitting = b.bundle?.items?.filter((x) => x.sitting).length || 0;
      const bridged = b.bundle?.items?.filter((x) => x.mpid).length || 0;
      return `
        <tr data-i="${i}" class="${i === last ? 'frontier' : ''}">
          <td>${i + 1}</td>
          <td>${b.opIcon || ''} ${b.opLabel || ''}</td>
          <td>${escapeHTML(b.bundle?.label || '')}</td>
          <td class="cnt">${(b.bundle?.size ?? 0).toLocaleString()}</td>
          <td class="cnt">${sitting.toLocaleString()}</td>
          <td class="cnt">${bridged.toLocaleString()}</td>
        </tr>
      `;
    }).join('');
    wrap.innerHTML = `
      <table class="beads">
        <thead><tr>
          <th>#</th><th>op</th><th>set</th><th>n</th><th>sitting</th><th>w/ MP id</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    for (const tr of wrap.querySelectorAll('tbody tr')) {
      tr.addEventListener('click', () => {
        const idx = +tr.dataset.i;
        if (idx !== last) this._undoTo(idx);
      });
    }
    root.appendChild(wrap);
  }

  _renderMap(root) {
    // Pick the most-recent bead that actually carries coordinates. This
    // matters once a chain pivots through an "intermediate" type that
    // has no coords (e.g. building → architect): the user still wants
    // to see the BUILDINGS on the map, not nothing. Falls back through
    // the chain until it finds a mappable bead.
    let last = null, idxUsed = -1;
    for (let i = state.beads.length - 1; i >= 0; i--) {
      const items = state.beads[i].bundle?.items || [];
      if (items.some((x) => x.coords || x.extra?.birthplace?.coords)) {
        last = state.beads[i]; idxUsed = i; break;
      }
    }
    if (!last?.bundle) {
      const wrap = document.createElement('div');
      wrap.className = 'map-wrap';
      wrap.innerHTML = `<div style="padding:16px;color:var(--ink-mute);font-size:13px;">
        No bead in this chain carries coordinates yet — try ✨ enrich
        (on a human bead) or → birthplaces.</div>`;
      root.appendChild(wrap);
      return;
    }
    const points = [];
    for (const x of last.bundle.items) {
      const c = x.coords || x.extra?.birthplace?.coords;
      if (!c) continue;
      const lbl = x.label || x.extra?.birthplace?.label || '';
      const wt  = x.originCount || 1;
      points.push({ ...c, label: lbl, weight: wt, uri: x.uri });
    }
    const wrap = document.createElement('div');
    wrap.className = 'map-wrap';
    // If the frontier wasn't the source of coords, tell the user which
    // bead we're showing — useful when the chain just pivoted away
    // from a mappable type.
    const fallbackNote = (idxUsed !== state.beads.length - 1)
      ? `<div style="padding:6px 8px;color:var(--ink-mute);font-size:12px;">
          ↪ frontier bead has no coords; showing bead ${idxUsed + 1}
          (${escapeHTML(last.bundle.label)}).
        </div>` : '';
    if (!points.length) {
      wrap.innerHTML = `${fallbackNote}<div style="padding:16px;color:var(--ink-mute);font-size:13px;">
        No coords on the frontier bead yet — try ✨ enrich (on a human bead)
        or → birthplaces.</div>`;
      root.appendChild(wrap);
      return;
    }
    // Inject the fallback note before the map header (added below).
    wrap.dataset.fallbackNote = fallbackNote;
    // Auto-fit bbox with padding.
    let minLat = +Infinity, maxLat = -Infinity, minLon = +Infinity, maxLon = -Infinity;
    for (const p of points) {
      if (p.lat < minLat) minLat = p.lat; if (p.lat > maxLat) maxLat = p.lat;
      if (p.lon < minLon) minLon = p.lon; if (p.lon > maxLon) maxLon = p.lon;
    }
    const padLat = Math.max(0.5, (maxLat - minLat) * 0.08);
    const padLon = Math.max(0.5, (maxLon - minLon) * 0.08);
    minLat -= padLat; maxLat += padLat;
    minLon -= padLon; maxLon += padLon;
    const W = 1200, H = 600;
    const proj = (lat, lon) => ({
      x: ((lon - minLon) / (maxLon - minLon)) * W,
      y: ((maxLat - lat) / (maxLat - minLat)) * H,
    });
    const maxWt = points.reduce((m, p) => Math.max(m, p.weight), 1);
    const radius = (w) => 3 + Math.sqrt(w / maxWt) * 14;
    // Cluster identical (lat,lon) so coincident pins stack visibly.
    const byKey = new Map();
    for (const p of points) {
      const k = `${p.lat.toFixed(3)}_${p.lon.toFixed(3)}`;
      if (!byKey.has(k)) byKey.set(k, { ...p, weight: 0, members: [] });
      const g = byKey.get(k); g.weight += p.weight; g.members.push(p);
    }
    const dots = [...byKey.values()].sort((a, b) => b.weight - a.weight).map((p) => {
      const { x, y } = proj(p.lat, p.lon);
      const r = radius(p.weight);
      const title = `${p.members.length === 1 ? p.label : `${p.label} (+${p.members.length - 1} co-located)`} — ${p.weight}`;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"><title>${escapeHTML(title)}</title></circle>`;
    }).join('');
    wrap.innerHTML = `
      ${wrap.dataset.fallbackNote || ''}
      <div class="map-head">
        <span class="n">${points.length.toLocaleString()}</span>
        <span>points · bbox ${minLat.toFixed(1)}…${maxLat.toFixed(1)} N, ${minLon.toFixed(1)}…${maxLon.toFixed(1)} E</span>
      </div>
      <svg class="map-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${dots}
      </svg>
    `;
    root.appendChild(wrap);
  }

  _renderTiles(root) {
    // The frontier bundle, full grid. Older beads accessible via the
    // table / spine; this view is about the live result.
    //
    // 3000 tiles built synchronously was a ~2–4s paint stall on mid-tier
    // mobile. Two changes keep the painter responsive without changing the
    // data model:
    //   1. Batch rendering: append tiles in chunks of TILE_BATCH per animation
    //      frame so the browser can paint between batches; the first batch
    //      (one viewport) lands immediately, the rest stream in.
    //   2. Event delegation: one click listener on the grid, not one per
    //      tile (matters when items is 3000).
    const last = state.beads[state.beads.length - 1];
    if (!last?.bundle) return;
    const head = document.createElement('div');
    head.className = 'tiles-head';
    head.innerHTML = `
      <span class="n">${last.bundle.size.toLocaleString()}</span>
      <span>${escapeHTML(last.bundle.label)}</span>
    `;
    root.appendChild(head);
    const grid = document.createElement('div');
    grid.className = 'tiles';
    const slice = last.bundle.items.slice(0, 3000);
    const bundleType = last.bundle.type;

    const tileHTML = (p, i) => {
      let mt = '';
      if (bundleType === 'human') {
        const years = p.sitting && p.firstYr ? `${p.firstYr}–`
                    : p.firstYr && p.lastYr   ? (p.firstYr === p.lastYr ? `${p.firstYr}` : `${p.firstYr}–${p.lastYr}`)
                    : p.lastYr                 ? `${p.lastYr}` : (p.firstYr ? `${p.firstYr}–` : '');
        mt = [years, p.parties?.[0] || ''].filter(Boolean).join(' · ');
      } else if (bundleType === 'building') {
        mt = [p.year ? String(p.year) : '', p.country || '', p.originCount ? `×${p.originCount}` : '']
          .filter(Boolean).join(' · ');
      } else if (bundleType === 'si') {
        mt = [p.year ? String(p.year) : '', p.number ? `№ ${p.number}` : '',
              p.madeDate ? 'made ' + p.madeDate.slice(0, 10) : '']
          .filter(Boolean).join(' · ');
      } else {
        const ct = p.originCount ? `${p.originCount}` : (p.count ? `${p.count}` : '');
        mt = [ct, p.country || ''].filter(Boolean).join(' · ');
      }
      return `<button class="tile" data-i="${i}" aria-label="${escapeHTML(p.label)}">`
        + `<div class="th">${p.image ? `<img alt="" data-src="${commonsThumb(p.image, 220)}">` : ''}</div>`
        + `<div class="body"><div class="nm">${escapeHTML(p.label)}</div>`
        + (mt ? `<div class="mt">${escapeHTML(mt)}</div>` : '')
        + `</button>`;
    };

    // Event delegation — one listener for all tiles in this grid.
    grid.addEventListener('click', (e) => {
      const tile = e.target.closest('button.tile');
      if (!tile || !grid.contains(tile)) return;
      const i = +tile.dataset.i;
      const item = slice[i];
      if (item) this._openThing(item, last.bundle);
    });

    const TILE_BATCH = 120;     // tiles per frame
    const hydrateBatch = (frag) => {
      for (const img of frag.querySelectorAll('img[data-src]')) tileIo.observe(img);
    };
    // First batch: render synchronously so above-the-fold paints with content.
    const firstEnd = Math.min(TILE_BATCH, slice.length);
    {
      const buf = new Array(firstEnd);
      for (let i = 0; i < firstEnd; i++) buf[i] = tileHTML(slice[i], i);
      const tpl = document.createElement('template');
      tpl.innerHTML = buf.join('');
      grid.appendChild(tpl.content);
      hydrateBatch(grid);
    }
    root.appendChild(grid);

    // Streaming batches: yield to the painter between each so scroll stays
    // responsive. Bail if this app gets disconnected mid-stream (re-render).
    let cursor = firstEnd;
    const stream = () => {
      if (!this.isConnected || !grid.isConnected) return;
      const end = Math.min(cursor + TILE_BATCH, slice.length);
      if (end === cursor) return;
      const buf = new Array(end - cursor);
      for (let i = cursor; i < end; i++) buf[i - cursor] = tileHTML(slice[i], i);
      const tpl = document.createElement('template');
      tpl.innerHTML = buf.join('');
      const firstNew = tpl.content.firstElementChild;
      grid.appendChild(tpl.content);
      // Hydrate only the newly-appended subrange so we don't re-observe earlier
      // batches every frame.
      let n = firstNew;
      while (n) {
        for (const img of n.querySelectorAll('img[data-src]')) tileIo.observe(img);
        n = n.nextElementSibling;
      }
      cursor = end;
      if (cursor < slice.length) requestAnimationFrame(stream);
    };
    if (cursor < slice.length) requestAnimationFrame(stream);
  }
}
// escapeHTML → /kgx/lib/node-flow.mjs (imported at top).
customElements.define('daisy-app', DaisyApp);
</script>
