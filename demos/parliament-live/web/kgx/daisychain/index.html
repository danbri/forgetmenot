    const el = this.shadowRoot.querySelector('#status');
    if (!el) return;
    if (!msg) { el.hidden = true; el.innerHTML = ''; el.classList.remove('err'); return; }
    el.hidden = false;
    el.innerHTML = msg;
    el.classList.toggle('err', !!err);
  }

  async _kickoff(starter) {
    state.starter = starter;
    this._status(`loading ${escapeHTML(starter.label)} …`);
    try {
      const { items, source } = await loadStarter(starter);
      const bundle = new Bundle(items, starter.type, starter.label);
      pushBead('source', '●', bundle, [source], { kind: 'starter', id: starter.id });
      // Loaded state: clear the status — the bead now carries the count
      // and the chain pane shows the chips. The "sitting / bridged" detail
      // is in the bead's meta line below the title.
      this._status(null);
    } catch (err) {
      this._status(`load failed: ${escapeHTML(err.message)}`, true);
    }
  }

  async _onOp({ op, bundle }) {
    if (op.kind === 'static') {
      const out = op.run(bundle);
      const src = makeSource({
        kind: `filter:${op.id}`, ms: 0,
        note: `client-side filter "${op.label}" applied to ${bundle.size} → ${out.size}`,
      });
      pushBead(op.label, op.icon, out, [src], { kind: 'op', op: op.id });
      return;
    }
    if (op.kind === 'async') {
      this._status(`${op.icon} ${escapeHTML(op.label)} — running over ${bundle.size.toLocaleString()} ${bundle.type}s…`);
      try {
        const out = await op.run(bundle);
        const newBundle = out instanceof Bundle ? out : out.bundle;
        const sources = out instanceof Bundle ? [] : [out.source];
        pushBead(op.label, op.icon, newBundle, sources, { kind: 'op', op: op.id });
        this._status(null);
      } catch (err) {
        this._status(`${escapeHTML(op.label)} failed: ${escapeHTML(err.message)}`, true);
      }
      return;
    }
    if (op.kind === 'rel-picker') {
      const sheet = document.createElement('daisy-rel-picker');
      sheet.addEventListener('rel-pick', async (e) => {
        const { template, variant } = e.detail;
        this._status(`⇄ ${escapeHTML(template.label)} · ${escapeHTML(variant.label)} (${variant.kind}) — running…`);
        try {
          const out = await applyRelation(template, variant, bundle);
          pushBead(`${template.label} · ${variant.label}`, '⇄',
                   out.bundle, [out.source],
                   { kind: 'op', op: 'rel-pivot',
                     template: template.id, variant: variant.id });
          this._status(null);
        } catch (err) {
          this._status(`${escapeHTML(template.label)} / ${escapeHTML(variant.label)} failed: ${escapeHTML(err.message)}`, true);
        }
      });
      sheet.open(bundle);
      return;
    }
    // picker
    const sheet = document.createElement('daisy-picker');
    sheet.addEventListener('pick', (e) => {
      const out = e.detail.op.run(bundle, e.detail.value);
      const extra = out._opNote ? ` · ${out._opNote}` : '';
      const src = makeSource({
        kind: `filter:${e.detail.op.id}:${e.detail.value}`, ms: 0,
        note: `client-side picker "${e.detail.op.label}" = "${e.detail.value}" applied to ${bundle.size} → ${out.size}${extra}`,
      });
      pushBead(`${e.detail.op.label.replace(/…$/, '')}: ${e.detail.value}`, e.detail.op.icon, out, [src],
               { kind: 'op', op: e.detail.op.id, value: e.detail.value });
    });
    sheet.open(op, bundle);
  }

  // Handle cardinality-response chips (broaden a too-narrow last step, or
  // narrow a too-large bead with top-N).
  // Open the single-item details overlay from a thumb / tile click.
  // Tolerates being called with either a bundle or just a bundleType.
  _openThing(item, bundleType) {
    if (!item) return;
    const sheet = document.createElement('daisy-thing-sheet');
    sheet.open(item, typeof bundleType === 'string' ? bundleType : bundleType?.type);
  }

  async _onCardChip(cc) {
    if (cc.kind === 'broaden-variant') {
      const parent = state.beads[cc.parentIdx];
      if (!parent?.bundle) return;
      this._status(`🔧 broaden ${escapeHTML(cc.template.label)} → ${escapeHTML(cc.variant.label)} (re-running over ${parent.bundle.size.toLocaleString()} ${parent.bundle.type}s)…`);
      try {
        const out = await applyRelation(cc.template, cc.variant, parent.bundle);
        pushBead(`${cc.template.label} · ${cc.variant.label}`, '⇄',
                 out.bundle, [out.source],
                 { kind: 'op', op: 'rel-pivot',
                   template: cc.template.id, variant: cc.variant.id });
        this._status(null);
      } catch (err) {
        this._status(`broaden failed: ${escapeHTML(err.message)}`, true);
      }
      return;
    }
    if (cc.kind === 'top-n') {
      const front = state.beads[state.beads.length - 1];
      if (!front?.bundle) return;
      const ranked = [...front.bundle.items]
        .filter((x) => rankValue(x, cc.field) != null)
        .sort((a, b) => {
          const va = rankValue(a, cc.field), vb = rankValue(b, cc.field);
          if (typeof va === 'string') return String(vb).localeCompare(String(va));
          return vb - va;
        })
        .slice(0, cc.n);
      const out = new Bundle(ranked, front.bundle.type,
                             `${front.bundle.label} · top ${cc.n} by ${cc.field}`);
      const src = makeSource({
        kind: `narrow:top-${cc.n}:${cc.field}`, ms: 0,
        note: `client-side narrow: top ${cc.n} of ${front.bundle.size} ranked by ${cc.field} desc`,
      });
      pushBead(`top ${cc.n} by ${cc.field}`, '🔧', out, [src],
               { kind: 'op', op: 'narrow-top-n', n: cc.n, field: cc.field });
      return;
    }
  }

  // Replay a saved chain step-by-step. Awaits async ops; surfaces failures.
  async _replay(entry, opts = {}) {
    state.beads = [];
    state.starter = null;
    state.activeTreeEntry = null;
    state.activeBranchId  = null;
    publish();
    // Accept either {steps} (flat) or {branches} (tree). The flatten walks
    // ancestor prefixes + the active branch — so a saved fork-shape chain
    // loads as a linear spine on the page until the daisychain UI grows
    // multi-branch state. The lib layer is what each pass goes through.
    let stepsToRun = [];
    try {
      // opts.activeBranch overrides the entry's default — used by the nav
      // pane's branch-switcher. We feed it back through normaliseChainSpec
      // so validation runs each time.
      const overlaid = (opts.activeBranch && Array.isArray(entry.branches))
        ? { ...entry, activeBranch: opts.activeBranch }
        : entry;
      const normalised = normaliseChainSpec(overlaid);
      stepsToRun = activeChainSteps(normalised) || [];
      // Remember the tree + active branch so the nav pane can offer
      // siblings. Only meaningful for tree-shape entries with > 1 branch.
      if (Array.isArray(entry.branches) && entry.branches.length > 1) {
        state.activeTreeEntry = entry;
        state.activeBranchId  = normalised.activeBranch;
      }
    } catch (e) {
      // Old-shape entries that fail normalisation: fall back to entry.steps.
      stepsToRun = Array.isArray(entry.steps) ? entry.steps : [];
    }
    for (const step of stepsToRun) {
      try {
        if (step.kind === 'starter') {
          const s = STARTERS.find((x) => x.id === step.id);
          if (!s) throw new Error('unknown starter ' + step.id);
          await this._kickoff(s);
        } else if (step.kind === 'op') {
          const front = state.beads[state.beads.length - 1];
          if (!front?.bundle) throw new Error('no frontier bead for op ' + step.op);
          // Relation-pivot is replayed directly from {template, variant}
          // rather than via the OPS-keyed-by-type lookup — the chip is
          // always called 'pivot' (kind 'rel-picker') but the spec records
          // the synthetic op id 'rel-pivot'. Without this shortcut the
          // OPS.find for 'rel-pivot' fails as "op not in OPS[<type>]".
          if (step.op === 'rel-pivot') {
            const tpl = REL_TEMPLATES.find((t) => t.id === step.template);
            const v   = tpl?.variants.find((x) => x.id === step.variant);
            if (!tpl || !v) throw new Error(`unknown rel template ${step.template}/${step.variant}`);
            const out = await applyRelation(tpl, v, front.bundle);
            pushBead(`${tpl.label} · ${v.label}`, '⇄', out.bundle, [out.source],
                     { kind: 'op', op: 'rel-pivot', template: tpl.id, variant: v.id });
            continue;
          }
          // Replay lookup: hand-coded OPS first, then the data-driven chip
          // pool (data-<field> / data-has-<field>). The chain spec records
          // the synthetic id; data-driven chips don't need OPS membership
          // to round-trip, but they DO need to be discoverable here.
          const handCodedOps = OPS[front.bundle.type] || [];
          let op = handCodedOps.find((o) => o.id === step.op);
          if (!op && /^data-/.test(step.op)) {
            const dataOps = dataDrivenChips(front.bundle, handCodedOps);
            op = dataOps.find((o) => o.id === step.op);
          }
          if (!op) throw new Error(`op "${step.op}" not in OPS[${front.bundle.type}]`);
          if (op.kind === 'static') {
            await this._onOp({ op, bundle: front.bundle });
          } else if (op.kind === 'async') {
            await this._onOp({ op, bundle: front.bundle });
          } else if (op.kind === 'picker') {
            // Use the saved value directly, skipping the picker sheet.
            const out = op.run(front.bundle, step.value);
            const extra = out._opNote ? ` · ${out._opNote}` : '';
            const src = makeSource({
              kind: `filter:${op.id}:${step.value}`, ms: 0,
              note: `replay picker "${op.label}" = "${step.value}"${extra}`,
            });
            pushBead(`${op.label.replace(/…$/, '')}: ${step.value}`, op.icon, out, [src],
                     { kind: 'op', op: op.id, value: step.value });
          } else if (op.kind === 'rel-picker') {
            const tpl = REL_TEMPLATES.find((t) => t.id === step.template);
            const v   = tpl?.variants.find((x) => x.id === step.variant);
            if (!tpl || !v) throw new Error(`unknown rel template ${step.template}/${step.variant}`);
            const out = await applyRelation(tpl, v, front.bundle);
            pushBead(`${tpl.label} · ${v.label}`, '⇄', out.bundle, [out.source],
                     { kind: 'op', op: 'rel-pivot', template: tpl.id, variant: v.id });
          }
        }
      } catch (err) {
        // The lead paragraph used to sit at the top of the page; replay
        // errors landed there. With the lead gone, surface the same
        // message inline at the top of the chain pane (root prepends so
        // it survives the next _render). The chain pane is the right
        // place — the error is about THIS chain.
        const chainRoot = this.shadowRoot.querySelector('#chain-root');
        if (chainRoot) {
          const banner = document.createElement('div');
          banner.style.cssText = 'color:#c33;font-size:12px;padding:4px 6px;border-radius:4px;background:color-mix(in oklab,#c33 6%,transparent);';
          banner.textContent = `replay failed at ${step.kind} ${step.op || step.id || ''}: ${err.message}`;
          chainRoot.prepend(banner);
        }
        return;
      }
    }
    if (entry.suggestView) {
      const v = entry.suggestView;
      // LIBRARY entries' suggestView routes into the appropriate pane;
      // 'map' / 'tiles' go to content, 'spine' / 'graph' / 'table' to chain.
      if (v === 'map' || v === 'tiles') state.contentView = v;
      else                              state.chainView   = v;
      publish();
    }
  }

  _saveChain() {
    const spec = currentChainSpec();
    if (!spec.length) return;
    const payload = { title: 'untitled chain', steps: spec };
    const text = JSON.stringify(payload, null, 2);
    const url  = location.origin + location.pathname + '#g=' + encodeSpec({ steps: spec });
    try { navigator.clipboard?.writeText(url); } catch {}
    this._status(`✓ permalink copied — <b>${spec.length}</b> steps`);
  }

  // Bundle-scope intents — open a small popover anchored near the ⋯ button
  // listing every intent applicable to the current chain. Clicking one runs
  // its planned action (open URL / copy text); the popover closes after.
  _openBundleIntents(ev) {
    // Close any existing intent popover (toggle).
    const existing = this.shadowRoot.querySelector('.intent-popover');
    if (existing) { existing.remove(); return; }
    const spec = currentChainSpec();
    if (!spec.length) {
      this._status('no chain yet — start one from the chains pane');
      return;
    }
    const ctx = {
      chainSpec: { title: state.activeChainId || 'untitled chain', steps: spec },
      permalink: location.origin + location.pathname + '#g=' + encodeSpec({ steps: spec }),
      kgxId:     state.activeChainId,
    };
    const frontier = state.beads[state.beads.length - 1]?.bundle;
    const intents = bundleIntentsFor(frontier, ctx);
    if (!intents.length) { this._status('no intents available for this chain'); return; }
    const pop = document.createElement('div');
    pop.className = 'intent-popover';
    pop.innerHTML = `<div class="intent-head">chain intents</div>`;
    for (const intent of intents) {
      const b = document.createElement('button');
      b.className = 'intent-item';
      b.innerHTML = `<span class="ic">${intent.icon}</span><span>${escapeHTML(intent.label)}</span>`;
      b.addEventListener('click', async () => {
        const action = intent.plan(frontier, ctx);
        if (action.kind === 'url') window.open(action.href, '_blank', 'noopener');
        else if (action.kind === 'copy') {
          try { await navigator.clipboard.writeText(action.text); } catch {}
          this._status(`✓ ${escapeHTML(intent.label)}`);
        }
        pop.remove();
      });
      pop.appendChild(b);
    }
    // Anchor near the ⋯ button. The header is in the shadow root; we
    // append the popover inside the shadow so its z-index is local.
    this.shadowRoot.querySelector('header').appendChild(pop);
    // Outside-click close (capture phase so it fires before child clicks).
    const onDoc = (e) => {
      if (!pop.contains(e.target) && e.target !== this.shadowRoot.querySelector('#intents-btn')) {
        pop.remove();
        document.removeEventListener('click', onDoc, { capture: true });
      }
    };
    setTimeout(() => document.addEventListener('click', onDoc, { capture: true }), 0);
  }

  _undoTo(idx) { truncateTo(idx); }
  _focusTo(idx) {
    // Setting the focus to the last bead == "follow the frontier" (null);
    // this keeps URL hash + chain growth identical to the pre-focus world.
    const last = state.beads.length - 1;
    state.focusIdx = (idx >= last) ? null : idx;
    publish();
  }
  _focusToView(idx, view) {
    const last = state.beads.length - 1;
    state.focusIdx = (idx >= last) ? null : idx;
    // Route the requested view to the right pane — these come from
    // bead-tiles / bead-map events so the call always names a content view.
    if (view === 'tiles' || view === 'map') state.contentView = view;
    else state.chainView = view;
    publish();
  }

  _reset() {
    state.starter = null;
    state.beads = [];
    state.focusIdx = null;
    state.activeChainId = null;
    state.activeTreeEntry = null;
    state.activeBranchId  = null;
    this._status(null);
    publish();
  }

  _render() {
    // Sync the view-segment buttons to current state. The chain group is
    // independent of the content group, so they get separate `.on` marks.
    for (const btn of this.shadowRoot.querySelectorAll('.seg button')) {
      const expect = btn.dataset.pane === 'content' ? state.contentView : state.chainView;
      btn.classList.toggle('on', btn.dataset.v === expect);
    }
    // Sync the mobile pane-tab strip (visible at ≤860px).
    for (const tab of this.shadowRoot.querySelectorAll('.pane-tabs button')) {
      tab.classList.toggle('on', tab.dataset.mp === state.mobilePane);
    }
    // Mobile single-pane swap: only the selected pane carries `.show`. CSS
    // hides the others. Above 860px the media query overrides this and all
    // three are visible.
    for (const pane of this.shadowRoot.querySelectorAll('.pane')) {
      const which = pane.id.replace('pane-', '');
      pane.classList.toggle('show', which === state.mobilePane);
    }

    const navRoot     = this.shadowRoot.querySelector('#nav-root');
    const chainRoot   = this.shadowRoot.querySelector('#chain-root');
    const contentRoot = this.shadowRoot.querySelector('#content-root');
    const panes       = this.shadowRoot.querySelector('#panes');
    navRoot.innerHTML = '';
    chainRoot.innerHTML = '';
    contentRoot.innerHTML = '';

    // The nav pane (chains list + "new chain" starter access) renders
    // regardless of whether there's an active chain.
    this._renderNav(navRoot);

    // Empty chain → middle pane shows the prominent starter gallery; right
    // pane goes away entirely (it has nothing to show). At desktop widths
    // the panes grid drops to two columns via the `.no-content` modifier.
    if (!state.beads.length) {
      panes.classList.add('no-content');
      const starter = document.createElement('daisy-starter');
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.appendChild(starter);
      chainRoot.appendChild(empty);
      return;
    }
    panes.classList.remove('no-content');
    // Map button greys out unless SOME bead has coords — the renderer
    // falls back to the most-recent mappable bead, so a chain that
    // pivoted from buildings → architects still shows buildings on map.
    const hasCoords = state.beads.some((bd) =>
      bd.bundle?.items?.some((x) => x.coords || x.extra?.birthplace?.coords));
    const mapBtn = this.shadowRoot.querySelector('#v-map');
    mapBtn.disabled = !hasCoords;
    mapBtn.style.opacity = hasCoords ? '1' : '0.45';
    mapBtn.title = hasCoords
      ? 'map the focused bead'
      : 'enrich (✨) or pivot to places to populate this view';
    // Chain pane: spine / graph / table.
    switch (state.chainView) {
      case 'graph': this._renderGraph(chainRoot); break;
      case 'table': this._renderTable(chainRoot); break;
      default:      this._renderSpine(chainRoot); break;
    }
    // Content pane: tiles / map / pivot (pivot = PivotViewer-style image
    // histogram — bin items by a facet from frontierOf, render each bin
    // as a vertical stack of thumbnails scaled by count). Map auto-falls-
    // back to tiles when no bead in the chain has coords.
    if      (state.contentView === 'map' && hasCoords) this._renderMap(contentRoot);
    else if (state.contentView === 'pivot')            this._renderPivot(contentRoot);
    else                                               this._renderTiles(contentRoot);
  }

  // Nav pane — Finder's sidebar. One-tap to start a new chain or replay a
  // saved one. Branches of the active chain (forks) will land here too once
  // their UI lands; for now the active LIBRARY entry is highlighted.
  _renderNav(root) {
    const newBtn = document.createElement('button');
    newBtn.className = 'nav-item new';
    newBtn.textContent = '+ new chain';
    newBtn.addEventListener('click', () => {
      this.dispatchEvent(new CustomEvent('chain-new', { bubbles: true, composed: true }));
    });
    root.appendChild(newBtn);

    // BRANCHES section — only present when the active chain is a tree-shape
    // library entry. Each branch is one tap to switch the active lane; the
    // shared prefix isn't re-fetched at the lib level (replay runs from
    // scratch today, but the lib's bead-hash cache reuses the prefix beads).
    if (state.activeTreeEntry?.branches?.length > 1) {
      const branchSec = document.createElement('div');
      branchSec.className = 'nav-section';
      branchSec.textContent = `branches of ${state.activeTreeEntry.title}`;
      root.appendChild(branchSec);
      for (const br of state.activeTreeEntry.branches) {
        const b = document.createElement('button');
        b.className = 'nav-item branch'
          + (state.activeBranchId === br.id ? ' active' : '');
        b.innerHTML = `<div class="nm"></div><div class="sub"></div>`;
        // The forkedFrom: { branch, beadIdx } tells the user where this
        // branch diverges from its parent — `→ from main @ bead 3` style.
        // Root branches (no forkedFrom) show "root".
        const where = br.forkedFrom
          ? `← from ${br.forkedFrom.branch} @ bead ${br.forkedFrom.beadIdx + 1}`
          : 'root';
        b.querySelector('.nm').textContent = `${br.label || br.id}`;
        b.querySelector('.sub').textContent = where;
        b.addEventListener('click', () => {
          if (state.activeBranchId === br.id) return;
          this._replay(state.activeTreeEntry, { activeBranch: br.id });
        });
        root.appendChild(b);
      }
    }

    // Library — saved chains.
    const sec = document.createElement('div');
    sec.className = 'nav-section';
    sec.textContent = `library (${LIBRARY.length})`;
    root.appendChild(sec);

    for (const entry of LIBRARY) {
      let stepCount = 0;
      try { stepCount = activeChainSteps(normaliseChainSpec(entry)).length; }
      catch { stepCount = (entry.steps || []).length; }
      const b = document.createElement('button');
      b.className = 'nav-item' + (state.activeChainId === entry.id ? ' active' : '');
      // Tree-shape entries get a tiny "branches: N" hint so the user knows
      // there's more to explore once they pick it.
      const branchHint = Array.isArray(entry.branches)
        ? ` · ${entry.branches.length} branches`
        : '';
      b.innerHTML = `<div class="nm"></div><div class="sub"></div>`;
      b.querySelector('.nm').textContent = `${stepCount}· ${entry.title}${branchHint}`;
      b.querySelector('.sub').textContent = entry.sub || '';
      b.addEventListener('click', () => {
        this.dispatchEvent(new CustomEvent('library-pick', {
          detail: entry, bubbles: true, composed: true,
        }));
      });
      root.appendChild(b);
    }
  }

  _renderSpine(root) {
    const spine = document.createElement('div');
    spine.className = 'spine';
    const last = state.beads.length - 1;
    const focus = focusedIdx();
    for (let i = 0; i <= last; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'bead-wrap';
      if (i === last)  wrap.setAttribute('frontier', '');
      if (i === focus) wrap.setAttribute('focused',  '');
      const bead = document.createElement('daisy-bead');
      bead.bead = state.beads[i];
      bead.index = i;
      bead.frontier = (i === last);
      if (i === focus && i !== last) bead.setAttribute('focus', '');
      wrap.appendChild(bead);
      spine.appendChild(wrap);
    }
    root.appendChild(spine);
    requestAnimationFrame(() => {
      // Scroll to the focused bead if it's not the frontier — that's the
      // one the user just clicked. Otherwise reveal the frontier as before.
      const target = spine.querySelector('.bead-wrap[focused]')
                  || spine.querySelector('.bead-wrap[frontier]');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }

  _renderGraph(root) {
    // Horizontal DAG of the linear chain — same data as the spine,
    // laid out left-to-right with curved SVG edges between cards.
    const wrap = document.createElement('div');
    wrap.className = 'graph-wrap';
    const g = document.createElement('div');
    g.className = 'graph';
    const last = state.beads.length - 1;
    for (let i = 0; i <= last; i++) {
      const b = state.beads[i];
      const card = document.createElement('div');
      card.className = 'gnode' + (i === last ? ' frontier' : '');
      const thumbs = (b.bundle?.items || []).filter((x) => x.image).slice(0, 6);
      const stripHTML = thumbs.map((p) =>
        `<img alt="" data-src="${commonsThumb(p.image, 56)}">`).join('');
      card.innerHTML = `
        <span class="kind">${i === 0 ? 'source' : (last && i === last ? 'frontier' : 'step')}</span>
        <div class="title"></div>
        <div class="cnt"></div>
        <div class="strip">${stripHTML}</div>
        <div style="font-size:11px;color:var(--ink-mute);">${b.opIcon || ''} ${b.opLabel || ''}</div>
      `;
      card.querySelector('.title').textContent = b.bundle?.label || '';
      card.querySelector('.cnt').textContent = (b.bundle?.size ?? 0).toLocaleString();
      card.addEventListener('click', () => {
        if (i === last) return;
        // Same non-destructive focus gesture as spine — chain stays intact,
        // tiles/map will show this node. Destructive undo lives behind the
        // small ↺ button on the spine view's bead cards.
        this._focusTo(i);
      });
      if (i === focusedIdx()) card.classList.add('focused');
      for (const img of card.querySelectorAll('img[data-src]')) tileIo.observe(img);
      g.appendChild(card);
    }
    // SVG overlay for edges
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('gedges');
    svg.innerHTML = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--spine)"/>
        </marker>
      </defs>
      <g class="paths"></g>
    `;
    wrap.appendChild(g);
    wrap.appendChild(svg);
    root.appendChild(wrap);
    requestAnimationFrame(() => this._drawGraphEdges(wrap, g, svg));
  }

  _drawGraphEdges(wrap, g, svg) {
    const cards = g.querySelectorAll('.gnode');
    const wrapBox = wrap.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${wrap.scrollWidth} ${wrap.clientHeight}`);
    svg.setAttribute('width', wrap.scrollWidth);
    svg.setAttribute('height', wrap.clientHeight);
    svg.style.width = wrap.scrollWidth + 'px';
    svg.style.height = wrap.clientHeight + 'px';
    const paths = svg.querySelector('.paths');
    paths.innerHTML = '';
    for (let i = 0; i < cards.length - 1; i++) {
      const a = cards[i].getBoundingClientRect();
      const b = cards[i + 1].getBoundingClientRect();
      const x1 = a.right - wrapBox.left + wrap.scrollLeft;
      const y1 = a.top   - wrapBox.top + a.height / 2;
      const x2 = b.left  - wrapBox.left + wrap.scrollLeft;
      const y2 = b.top   - wrapBox.top + b.height / 2;
      const dx = Math.max(20, (x2 - x1) / 2);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2 - 4} ${y2}`);
      paths.appendChild(path);
    }
    // Scroll to frontier
    const front = g.querySelector('.gnode.frontier');
    if (front) front.scrollIntoView({ behavior: 'smooth', inline: 'end', block: 'nearest' });
  }

  _renderTable(root) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const last = state.beads.length - 1;
    const rows = state.beads.map((b, i) => {
      const sitting = b.bundle?.items?.filter((x) => x.sitting).length || 0;
      const bridged = b.bundle?.items?.filter((x) => x.mpid).length || 0;
      return `
        <tr data-i="${i}" class="${i === last ? 'frontier' : ''}">
          <td>${i + 1}</td>
          <td>${b.opIcon || ''} ${b.opLabel || ''}</td>
          <td>${escapeHTML(b.bundle?.label || '')}</td>
          <td class="cnt">${(b.bundle?.size ?? 0).toLocaleString()}</td>
          <td class="cnt">${sitting.toLocaleString()}</td>
          <td class="cnt">${bridged.toLocaleString()}</td>
        </tr>
      `;
    }).join('');
    wrap.innerHTML = `
      <table class="beads">
        <thead><tr>
          <th>#</th><th>op</th><th>set</th><th>n</th><th>sitting</th><th>w/ MP id</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    for (const tr of wrap.querySelectorAll('tbody tr')) {
      tr.addEventListener('click', () => {
        const idx = +tr.dataset.i;
        if (idx !== last) this._focusTo(idx);
      });
      if (+tr.dataset.i === focusedIdx()) tr.classList.add('focused');
    }
    root.appendChild(wrap);
  }

  _renderMap(root) {
    // Map is wired to the focused bead by default, with a coords-aware
    // fallback by NEAREST mappable bead — walk outward (backward then
    // forward) from focus so the user always sees terrain when the chain
    // has any. Symmetric: focus a bead AFTER the mappable one and the
    // map still finds it forward; focus a bead BEFORE and it finds it
    // backward. Honesty (rule 11): we name which bead we ended up on.
    const startAt = focusedIdx();
    let last = null, idxUsed = -1;
    const has = (i) => state.beads[i]?.bundle?.items?.some(
      (x) => x.coords || x.extra?.birthplace?.coords);
    for (let d = 0; d < state.beads.length; d++) {
      const back = startAt - d, fwd = startAt + d;
      if (back >= 0 && has(back))                  { idxUsed = back; break; }
      if (d > 0 && fwd < state.beads.length && has(fwd)) { idxUsed = fwd; break; }
    }
    if (idxUsed >= 0) last = state.beads[idxUsed];
    if (!last?.bundle) {
      const wrap = document.createElement('div');
      wrap.className = 'map-wrap';
      wrap.innerHTML = `<div style="padding:16px;color:var(--ink-mute);font-size:13px;">
        No bead in this chain carries coordinates yet — try ✨ enrich
        (on a human bead) or → birthplaces.</div>`;
      root.appendChild(wrap);
      return;
    }
    const points = [];
    for (const x of last.bundle.items) {
      const c = x.coords || x.extra?.birthplace?.coords;
      if (!c) continue;
      const lbl = x.label || x.extra?.birthplace?.label || '';
      const wt  = x.originCount || 1;
      // Carry image + the source item itself — the new image+label markers
      // render the image as a circular thumb, and clicking dispatches
      // thing-open with this item.
      points.push({ ...c, label: lbl, weight: wt, uri: x.uri,
                    image: x.image || null, item: x });
    }
    const wrap = document.createElement('div');
    wrap.className = 'map-wrap';
    // Two reasons we might be showing a non-focused bead: (a) the focus
    // is the frontier and a chain pivoted past coordinates (buildings →
    // architects), (b) the user focused a bead that has no coords. Either
    // way name the source bead, and offer a one-tap clear when focus drove
    // the choice — symmetrical to the tiles header.
    const showingDifferent = (idxUsed !== startAt);
    const focusOverride    = (startAt !== state.beads.length - 1);
    const fallbackNote = showingDifferent
      ? `<div style="padding:6px 8px;color:var(--ink-mute);font-size:12px;">
          ↪ focused bead has no coords; showing bead ${idxUsed + 1}
          (${escapeHTML(last.bundle.label)}).
        </div>`
      : (focusOverride
          ? `<div style="padding:6px 8px;color:var(--ink-mute);font-size:12px;">
              ↪ wired from bead ${startAt + 1}.
              <button class="wired-from clear-focus" type="button"
                style="margin-left:6px;background:none;border:1px solid var(--rule-soft);border-radius:6px;padding:2px 8px;color:var(--ink-soft);cursor:pointer;font:inherit;font-size:11px;">
                follow frontier
              </button>
            </div>`
          : '');
    if (!points.length) {
      wrap.innerHTML = `${fallbackNote}<div style="padding:16px;color:var(--ink-mute);font-size:13px;">
        No coords on the frontier bead yet — try ✨ enrich (on a human bead)
        or → birthplaces.</div>`;
      root.appendChild(wrap);
      return;
    }
    // Web Mercator projection — the convention every slippy tile server
    // uses. Tile (z,x,y) covers lonLeft=x/2^z·360-180 to lonRight=(x+1)/…,
    // and a corresponding latitude band derived from the inverse Mercator.
    // Same math as Leaflet / MapLibre, ~30 lines instead of a 40 KB dep.
    const TILE = 256;
    const ZMIN = 1, ZMAX = 16;     // interactive range; OSMF policy says be
                                   // polite, so never fetch past z=16
    const lonToX = (lon, z) => ((lon + 180) / 360) * (1 << z);
    const latToY = (lat, z) => {
      const r = lat * Math.PI / 180;
      return ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * (1 << z);
    };

    // Auto-fit bbox with padding (zoom picked below, once the frame is in
    // the DOM and measurable).
    let minLat = +Infinity, maxLat = -Infinity, minLon = +Infinity, maxLon = -Infinity;
    for (const p of points) {
      if (p.lat < minLat) minLat = p.lat; if (p.lat > maxLat) maxLat = p.lat;
      if (p.lon < minLon) minLon = p.lon; if (p.lon > maxLon) maxLon = p.lon;
    }
    const padFrac = 0.12;
    const padLat = Math.max(0.5, (maxLat - minLat) * padFrac);
    const padLon = Math.max(0.5, (maxLon - minLon) * padFrac);
    minLat = Math.max(-85.0, minLat - padLat); maxLat = Math.min(85.0, maxLat + padLat);
    minLon = Math.max(-180,  minLon - padLon); maxLon = Math.min(180,  maxLon + padLon);

    const maxWt = points.reduce((m, p) => Math.max(m, p.weight), 1);
    const radius = (w) => 3 + Math.sqrt(w / maxWt) * 14;
    // Cluster identical (lat,lon) so coincident pins stack visibly.
    const byKey = new Map();
    for (const p of points) {
      const k = `${p.lat.toFixed(3)}_${p.lon.toFixed(3)}`;
      if (!byKey.has(k)) byKey.set(k, { ...p, weight: 0, members: [] });
      const g = byKey.get(k); g.weight += p.weight; g.members.push(p);
    }
    const clusters = [...byKey.values()].sort((a, b) => b.weight - a.weight);

    // Build the frame first, then measure it: tile offsets are CSS px
    // relative to the frame, so the SVG viewBox must share the frame's
    // real pixel size or dots drift off their tiles at narrow widths.
    wrap.innerHTML = `
      ${fallbackNote}
      <div class="map-head">
        <span class="n">${points.length.toLocaleString()}</span>
        <span>points · bbox ${minLat.toFixed(1)}…${maxLat.toFixed(1)} N, ${minLon.toFixed(1)}…${maxLon.toFixed(1)} E · zoom <span class="z"></span></span>
      </div>
      <div class="map-frame">
        <div class="map-tiles"></div>
        <svg class="map-svg"></svg>
        <div class="map-markers"></div>
        <div class="map-zoom">
          <button class="zin"  aria-label="zoom in"  title="zoom in">+</button>
          <button class="zout" aria-label="zoom out" title="zoom out">−</button>
        </div>
        <div class="map-attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
      </div>
    `;
    root.appendChild(wrap);
    const clearFocusBtn = wrap.querySelector('.clear-focus');
    if (clearFocusBtn) {
      clearFocusBtn.addEventListener('click', () => {
        state.focusIdx = null;
        publish();
      });
    }
    const frame   = wrap.querySelector('.map-frame');
    const tilesEl = wrap.querySelector('.map-tiles');
    const svgEl   = wrap.querySelector('.map-svg');
    const markersEl = wrap.querySelector('.map-markers');
    const zoomLbl = wrap.querySelector('.map-head .z');
    const zinBtn  = wrap.querySelector('.zin');
    const zoutBtn = wrap.querySelector('.zout');
    const W = frame.clientWidth || 1200;
    const H = frame.clientHeight || 460;
    svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);

    // Initial auto-fit: the deepest zoom that still fits every point in
    // the viewport. Floor at 1 (full world), cap at 14 (street-ish; the
    // user can still zoom further by hand, up to ZMAX).
    let fitZoom = 1;
    for (let z = 14; z >= 1; z--) {
      const wPx = (lonToX(maxLon, z) - lonToX(minLon, z)) * TILE;
      const hPx = (latToY(minLat, z) - latToY(maxLat, z)) * TILE;
      if (wPx <= W && hPx <= H) { fitZoom = z; break; }
    }
    // Mutable viewport: centre in tile-space at the current zoom. Pan and
    // zoom rewrite this and call renderViewport().
    const view = {
      zoom: fitZoom,
      cx: (lonToX(minLon, fitZoom) + lonToX(maxLon, fitZoom)) / 2,
      cy: (latToY(minLat, fitZoom) + latToY(maxLat, fitZoom)) / 2,
    };
    const clampView = () => {
      const Zn = 1 << view.zoom;
      const halfH = H / (2 * TILE);
      // Vertically: don't pan past the poles (centre world when it's
      // shorter than the viewport). Horizontally the world wraps.
      view.cy = (Zn <= halfH * 2) ? Zn / 2
              : Math.min(Zn - halfH, Math.max(halfH, view.cy));
      view.cx = ((view.cx % Zn) + Zn) % Zn;
    };

    // ---- viewport renderer ------------------------------------------------
    // Re-runs on every pan / zoom step. Tiles are keyed by (z, tx, ty) with
    // tx UNWRAPPED (a z=1 world repeating across a wide frame gets one <img>
    // per copy) and reused across calls: a pan only restyles the <img>s that
    // stay visible — no flicker — appending / removing at the edges; a zoom
    // change retires every key at once. Only tiles intersecting the viewport
    // are ever created (OSMF policy: no prefetch beyond what's shown).
    const tileEls = new Map();   // 'z/tx/ty' → <img>
    const renderViewport = () => {
      const z = view.zoom, Zn = 1 << z;
      const originPx = { x: view.cx * TILE - W / 2, y: view.cy * TILE - H / 2 };
      const tMinX = Math.floor(originPx.x / TILE);
      const tMinY = Math.floor(originPx.y / TILE);
      const tMaxX = Math.floor((originPx.x + W - 1) / TILE);
      const tMaxY = Math.floor((originPx.y + H - 1) / TILE);
      const needed = new Set();
      for (let ty = Math.max(0, tMinY); ty <= Math.min(Zn - 1, tMaxY); ty++) {
        for (let tx = tMinX; tx <= tMaxX; tx++) {
          const key = `${z}/${tx}/${ty}`;
          needed.add(key);
          let img = tileEls.get(key);
          if (!img) {
            img = document.createElement('img');
            const wrappedX = ((tx % Zn) + Zn) % Zn;
            img.src = `/api/osm-tile/${z}/${wrappedX}/${ty}.png`;
            img.alt = ''; img.decoding = 'async'; img.draggable = false;
            tileEls.set(key, img);
            tilesEl.appendChild(img);
          }
          img.style.left = (tx * TILE - originPx.x) + 'px';
          img.style.top  = (ty * TILE - originPx.y) + 'px';
        }
      }
      for (const [key, img] of tileEls) {
        if (!needed.has(key)) { img.remove(); tileEls.delete(key); }
      }
      // Dots: project every cluster, picking the horizontal world copy
      // nearest the viewport (panning across the antimeridian keeps pins).
      // Skip dots outside the viewport, with margin so a half-visible
      // circle still draws.
      // Markers are image+label divs in a layer ABOVE the tile mosaic and
      // OVER the (still empty) SVG. Clicking one dispatches thing-open with
      // the item — the daisy-thing-sheet popover takes it from there, no
      // navigation loss. Falls back to a small accent dot when the item has
      // no image.
      svgEl.innerHTML = '';
      const worldPx = Zn * TILE;
      markersEl.innerHTML = '';
      const frag = document.createDocumentFragment();
      for (const p of clusters) {
        let x = lonToX(p.lon, z) * TILE - originPx.x;
        x = ((x % worldPx) + worldPx) % worldPx;
        if (x > W + 20 && x - worldPx >= -20) x -= worldPx;
        const y = latToY(p.lat, z) * TILE - originPx.y;
        if (x < -32 || x > W + 32 || y < -32 || y > H + 32) continue;
        const m = document.createElement('button');
        m.className = 'map-marker' + (p.image ? '' : ' dotless');
        if (p.members.length > 1) m.classList.add('cluster');
        m.style.left = x.toFixed(1) + 'px';
        m.style.top  = y.toFixed(1) + 'px';
        m.dataset.uri = p.uri || '';
        const subtitle = p.members.length > 1 ? `+${p.members.length - 1}` : '';
        m.innerHTML = `
          <div class="img"${p.image ? ` style="background-image:url('${commonsThumb(p.image, 60)}')"` : ''}></div>
          <div class="lbl">
            <span class="nm">${escapeHTML(p.label)}</span>
            ${subtitle ? `<span class="ct">${subtitle}</span>` : ''}
          </div>`;
        m.title = `${p.label}${p.members.length > 1 ? ` (+${p.members.length - 1} co-located)` : ''} — ${p.weight}`;
        m.addEventListener('click', (ev) => {
          ev.stopPropagation();
          // For a cluster, open the first member's underlying item. The
          // thing-sheet popover takes it from there — non-modal so the
          // map stays visible. Future: a cluster sub-list to pick from.
          this.dispatchEvent(new CustomEvent('thing-open', {
            detail: { item: p.members[0].item, bundle: last.bundle },
            bubbles: true, composed: true,
          }));
        });
        frag.appendChild(m);
      }
      markersEl.appendChild(frag);
      zoomLbl.textContent = z;
      zinBtn.disabled  = z >= ZMAX;
      zoutBtn.disabled = z <= ZMIN;
    };

    // ---- interaction --------------------------------------------------------
    // Pointer events give mouse + touch one code path: one pointer drags,
    // two pinch. During a pinch the integer-zoom mosaic is left alone and a
    // CSS transform previews the gesture; the real re-render happens once,
    // on release, at the nearest integer zoom.
    const zoomAt = (px, py, dz) => {
      const z2 = Math.max(ZMIN, Math.min(ZMAX, view.zoom + dz));
      if (z2 === view.zoom) return;
      const k = 2 ** (z2 - view.zoom);
      // Keep the world point under (px, py) fixed through the zoom.
      view.cx = (view.cx + (px - W / 2) / TILE) * k - (px - W / 2) / TILE;
      view.cy = (view.cy + (py - H / 2) / TILE) * k - (py - H / 2) / TILE;
      view.zoom = z2;
      clampView();
      renderViewport();
    };

    const pointers = new Map();   // pointerId → {x, y} in client coords
    let pinch = null;             // { d0, mid, scale } while two pointers down
    frame.addEventListener('pointerdown', (e) => {
      // Controls and the attribution link must stay plainly clickable —
      // capturing their pointer would retarget the click.
      if (e.target.closest('.map-zoom, .map-attrib')) return;
      // Capture keeps the drag alive when the pointer leaves the frame.
      // It can throw (e.g. the pointer vanished between event and handler);
      // the gesture itself must survive that.
      try { frame.setPointerCapture(e.pointerId); } catch {}
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const r = frame.getBoundingClientRect();
        pinch = {
          d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
          mid: { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top },
          scale: 1,
        };
      }
      frame.classList.add('panning');
    });
    frame.addEventListener('pointermove', (e) => {
      const prev = pointers.get(e.pointerId);
      if (!prev) return;
      const cur = { x: e.clientX, y: e.clientY };
      pointers.set(e.pointerId, cur);
      if (pinch && pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch.scale = Math.max(0.25, Math.min(8, Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0));
        const s = pinch.scale, m = pinch.mid;
        const t = `translate(${m.x - s * m.x}px, ${m.y - s * m.y}px) scale(${s})`;
        tilesEl.style.transform = t;
        svgEl.style.transform = t;
        return;
      }
      if (pointers.size === 1) {
        view.cx -= (cur.x - prev.x) / TILE;
        view.cy -= (cur.y - prev.y) / TILE;
        clampView();
        renderViewport();
      }
    });
    const endPointer = (e) => {
      if (!pointers.delete(e.pointerId)) return;
      if (pinch && pointers.size < 2) {
        tilesEl.style.transform = '';
        svgEl.style.transform = '';
        const dz = Math.round(Math.log2(pinch.scale));
        if (dz) zoomAt(pinch.mid.x, pinch.mid.y, dz);
        pinch = null;
      }
      if (!pointers.size) frame.classList.remove('panning');
    };
    frame.addEventListener('pointerup', endPointer);
    frame.addEventListener('pointercancel', endPointer);

    // Wheel: accumulate deltas so trackpads (streams of small pixel-mode
    // events) and mouse wheels (one ±100…120 notch) both step one integer
    // zoom per ~100px of delta, anchored under the cursor. Firefox reports
    // wheel notches in lines (deltaMode 1) — normalise to px first.
    let wheelAcc = 0;
    frame.addEventListener('wheel', (e) => {
      e.preventDefault();
      wheelAcc += e.deltaY * (e.deltaMode === 1 ? 35 : e.deltaMode === 2 ? 300 : 1);
      while (Math.abs(wheelAcc) >= 100) {
        const dz = wheelAcc < 0 ? 1 : -1;
        wheelAcc += dz * 100;
        const r = frame.getBoundingClientRect();
        zoomAt(e.clientX - r.left, e.clientY - r.top, dz);
      }
    }, { passive: false });

    zinBtn.addEventListener('click',  () => zoomAt(W / 2, H / 2, +1));
    zoutBtn.addEventListener('click', () => zoomAt(W / 2, H / 2, -1));

    renderViewport();
  }

  // PivotViewer-style image histogram. Pick a facet (decade, country,
  // party, …) via the dropdown — items group into columns; each column is
  // a vertical thumb stack, so the COLUMN HEIGHT matches the bin's count.
  // Clicking a thumb opens the thing-sheet (the new Quick-Look popover).
  // Caps thumbnails per column to keep mid-tier mobile responsive.
  _renderPivot(root) {
    const focusI = focusedIdx();
    const bead = state.beads[focusI];
    if (!bead?.bundle?.items?.length) return;

    const front = frontierOf(bead.bundle);
    const facets = front.facets || [];
    // Auto-pick the strongest facet (most distinct values, capped) the
    // first time we render; user override via state.pivotField sticks.
    let field = state.pivotField;
    if (!field || !facets.some((f) => f.field === field)) {
      field = facets[0]?.field || null;
    }
    const isFrontier = (focusI === state.beads.length - 1);

    const head = document.createElement('div');
    head.className = 'pivot-head';
    if (!field) {
      head.innerHTML = `<span>${bead.bundle.size.toLocaleString()} ${escapeHTML(bead.bundle.label)} — no faceted axes on this bundle yet (try ✨ enrich first).</span>`;
      root.appendChild(head);
      return;
    }
    head.innerHTML = `
      <span class="n">${bead.bundle.size.toLocaleString()}</span>
      <span>${escapeHTML(bead.bundle.label)} ·</span>
      <span class="facet-pick">
        <label for="pivot-axis">bin by</label>
        <select id="pivot-axis">${facets.map((f) =>
          `<option value="${escapeHTML(f.field)}"${f.field === field ? ' selected' : ''}>${escapeHTML(f.field)} (${f.distinct})</option>`
        ).join('')}</select>
      </span>
      ${isFrontier ? '' : `<button class="wired-from" title="pivot wired from bead ${focusI + 1}; tap to follow frontier">wired from bead ${focusI + 1} · clear</button>`}
    `;
    root.appendChild(head);
    head.querySelector('#pivot-axis').addEventListener('change', (e) => {
      state.pivotField = e.target.value;
      publish();
    });
    const clearFocus = head.querySelector('.wired-from');
    if (clearFocus) clearFocus.addEventListener('click', () => {
      state.focusIdx = null; publish();
    });

    // Bin the items. Multi-valued fields (parties[], citizenships[]) put
    // an item in every matching bin; everyone-else single-valued.
    const facetRec = facets.find((f) => f.field === field);
    const multi    = facetRec?.multi;
    const bins = new Map();
    const put = (k, item) => {
      const key = String(k);
      if (!bins.has(key)) bins.set(key, []);
      bins.get(key).push(item);
    };
    for (const x of bead.bundle.items) {
      const v = x[field];
      if (v == null || v === '' || v === false) continue;
      if (Array.isArray(v)) for (const vi of v) put(vi, x);
      else put(v, x);
    }
    const sorted = [...bins.entries()]
      .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));

    // Render columns. Cap thumbs per column to keep DOM size sane on
    // long tails — the column HEIGHT communicates the count, the visible
    // thumbs are a sample; total is displayed on hover and inline.
    const COL_MAX_THUMBS = 60;
    const grid = document.createElement('div');
    grid.className = 'pivot-grid';
    for (const [bin, items] of sorted) {
      const col = document.createElement('div');
      col.className = 'pivot-col';
      col.title = `${bin} — ${items.length}`;
      const stack = document.createElement('div');
      stack.className = 'stack';
      const shown = items.slice(0, COL_MAX_THUMBS);
      for (const x of shown) {
        const t = document.createElement('button');
        t.className = 'thumb' + (x.image ? '' : ' dotless');
        if (x.image) t.innerHTML = `<img alt="" data-src="${commonsThumb(x.image, 48)}">`;
        t.title = x.label || x.uri || '';
        t.addEventListener('click', (ev) => {
          ev.stopPropagation();
          this.dispatchEvent(new CustomEvent('thing-open', {
            detail: { item: x, bundle: bead.bundle },
            bubbles: true, composed: true,
          }));
        });
        stack.appendChild(t);
      }
      col.appendChild(stack);
      const lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.innerHTML = `${escapeHTML(bin)} <span class="ct">${items.length}${items.length > COL_MAX_THUMBS ? '*' : ''}</span>`;
      col.appendChild(lbl);
      grid.appendChild(col);
    }
    root.appendChild(grid);
    // Lazy-load thumbnails — re-use the IntersectionObserver from tiles
    // grid via the same tileIo handle.
    for (const img of grid.querySelectorAll('img[data-src]')) tileIo.observe(img);
  }

  _renderTiles(root) {
    // Tiles is a NODE viewer wired to the focused bead — defaults to the
    // frontier, but tap any older bead in spine/graph/table to focus it
    // and tiles re-renders for that bundle. Same data invariants as
    // before (chain stays intact, hash unchanged).
    //
    // 3000 tiles built synchronously was a ~2–4s paint stall on mid-tier
    // mobile. Two changes keep the painter responsive without changing the
    // data model:
    //   1. Batch rendering: append tiles in chunks of TILE_BATCH per animation
    //      frame so the browser can paint between batches; the first batch
    //      (one viewport) lands immediately, the rest stream in.
    //   2. Event delegation: one click listener on the grid, not one per
    //      tile (matters when items is 3000).
    const focusI = focusedIdx();
    const last = state.beads[focusI];
    if (!last?.bundle) return;
    const isFrontier = (focusI === state.beads.length - 1);
    const head = document.createElement('div');
    head.className = 'tiles-head';
    // Pill names the wired bead so it's obvious WHICH node the tiles
    // are showing; click it to follow the frontier again. Hidden when
    // tiles is already showing the frontier (the common case).
    head.innerHTML = `
      <span class="n">${last.bundle.size.toLocaleString()}</span>
      <span>${escapeHTML(last.bundle.label)}</span>
      ${isFrontier ? '' : `<button class="wired-from" title="tiles wired from bead ${focusI + 1}; tap to follow the frontier again">wired from bead ${focusI + 1} · clear</button>`}
    `;
    root.appendChild(head);
    if (!isFrontier) {
      head.querySelector('.wired-from').addEventListener('click', () => {
        state.focusIdx = null;
        publish();
      });
    }
    const grid = document.createElement('div');
    grid.className = 'tiles';
    const slice = last.bundle.items.slice(0, 3000);
    const bundleType = last.bundle.type;

    const tileHTML = (p, i) => {
      let mt = '';
      if (bundleType === 'human') {
        const years = p.sitting && p.firstYr ? `${p.firstYr}–`
                    : p.firstYr && p.lastYr   ? (p.firstYr === p.lastYr ? `${p.firstYr}` : `${p.firstYr}–${p.lastYr}`)
                    : p.lastYr                 ? `${p.lastYr}` : (p.firstYr ? `${p.firstYr}–` : '');
        mt = [years, p.parties?.[0] || ''].filter(Boolean).join(' · ');
      } else if (bundleType === 'building') {
        mt = [p.year ? String(p.year) : '', p.country || '', p.originCount ? `×${p.originCount}` : '']
          .filter(Boolean).join(' · ');
      } else if (bundleType === 'si') {
        mt = [p.year ? String(p.year) : '', p.number ? `№ ${p.number}` : '',
              p.madeDate ? 'made ' + p.madeDate.slice(0, 10) : '']
          .filter(Boolean).join(' · ');
      } else {
        const ct = p.originCount ? `${p.originCount}` : (p.count ? `${p.count}` : '');
        mt = [ct, p.country || ''].filter(Boolean).join(' · ');
      }
      return `<button class="tile" data-i="${i}" aria-label="${escapeHTML(p.label)}">`
        + `<div class="th">${p.image ? `<img alt="" data-src="${commonsThumb(p.image, 220)}">` : ''}</div>`
        + `<div class="body"><div class="nm">${escapeHTML(p.label)}</div>`
        + (mt ? `<div class="mt">${escapeHTML(mt)}</div>` : '')
        + `</button>`;
    };

    // Event delegation — one listener for all tiles in this grid.
    grid.addEventListener('click', (e) => {
      const tile = e.target.closest('button.tile');
      if (!tile || !grid.contains(tile)) return;
      const i = +tile.dataset.i;
      const item = slice[i];
      if (item) this._openThing(item, last.bundle);
    });

    const TILE_BATCH = 120;     // tiles per frame
    const hydrateBatch = (frag) => {
      for (const img of frag.querySelectorAll('img[data-src]')) tileIo.observe(img);
    };
    // First batch: render synchronously so above-the-fold paints with content.
    const firstEnd = Math.min(TILE_BATCH, slice.length);
    {
      const buf = new Array(firstEnd);
      for (let i = 0; i < firstEnd; i++) buf[i] = tileHTML(slice[i], i);
      const tpl = document.createElement('template');
      tpl.innerHTML = buf.join('');
      grid.appendChild(tpl.content);
      hydrateBatch(grid);
    }
    root.appendChild(grid);

    // Streaming batches: yield to the painter between each so scroll stays
    // responsive. Bail if this app gets disconnected mid-stream (re-render).
    let cursor = firstEnd;
    const stream = () => {
      if (!this.isConnected || !grid.isConnected) return;
      const end = Math.min(cursor + TILE_BATCH, slice.length);
      if (end === cursor) return;
      const buf = new Array(end - cursor);
      for (let i = cursor; i < end; i++) buf[i - cursor] = tileHTML(slice[i], i);
      const tpl = document.createElement('template');
      tpl.innerHTML = buf.join('');
      const firstNew = tpl.content.firstElementChild;
      grid.appendChild(tpl.content);
      // Hydrate only the newly-appended subrange so we don't re-observe earlier
      // batches every frame.
      let n = firstNew;
      while (n) {
        for (const img of n.querySelectorAll('img[data-src]')) tileIo.observe(img);
        n = n.nextElementSibling;
      }
      cursor = end;
      if (cursor < slice.length) requestAnimationFrame(stream);
    };
    if (cursor < slice.length) requestAnimationFrame(stream);
  }
}
// escapeHTML → /kgx/lib/node-flow.mjs (imported at top).
customElements.define('daisy-app', DaisyApp);
</script>

</body>
