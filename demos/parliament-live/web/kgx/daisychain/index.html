<daisy-app></daisy-app>

<script type="module">
// ============================================================================
// /kgx/daisychain/ — bead-spine interaction over the same Bundle / Bloom
// engine as /kgx/pivcab/. One linear chain of [data] · op · [data] · op · …
// beads scrolling top-to-bottom. The contextual op chip row on the frontier
// bead is the only place the user makes decisions; older beads are history.
// Tapping an earlier bead truncates the chain back to that point (an "undo
// from here"). Forks (V2) would let two chains share the prefix.
// ============================================================================

const QLEVER = 'https://qlever.dev/api/wikidata';
const SEED_LIMIT = 7000;

const POST1900_MPS_QUERY = `
PREFIX wd:     <http://www.wikidata.org/entity/>
PREFIX wdt:    <http://www.wikidata.org/prop/direct/>
PREFIX p:      <http://www.wikidata.org/prop/>
PREFIX ps:     <http://www.wikidata.org/prop/statement/>
PREFIX pq:     <http://www.wikidata.org/prop/qualifier/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?p (SAMPLE(?lbl) AS ?l)
       (SAMPLE(?image) AS ?imgUri)
       (SAMPLE(?mp)    AS ?mpid)
       (MIN(?startYr)  AS ?firstYr)
       (MAX(?startYr)  AS ?latestStart)
       (MAX(?effEnd)   AS ?lastYr)
       (MAX(?openNow)  AS ?sittingFlag)
       (GROUP_CONCAT(DISTINCT ?partyLbl; separator="|") AS ?parties)
       (SAMPLE(?gndLbl) AS ?gender)
       (GROUP_CONCAT(DISTINCT ?ctzLbl; separator="|") AS ?citizenships)
WHERE {
  ?p wdt:P39 ?pos .
  ?pos wdt:P279* wd:Q16707842 .
  ?p p:P39 ?stmt . ?stmt ps:P39 ?pos .
  OPTIONAL { ?stmt pq:P580 ?start . BIND(YEAR(?start) AS ?startYr) }
  OPTIONAL { ?stmt pq:P582 ?end   . BIND(YEAR(?end)   AS ?endYr)   }
  BIND(IF(BOUND(?endYr), ?endYr, 9999) AS ?effEnd)
  BIND(IF(BOUND(?startYr) && !BOUND(?endYr) && ?startYr >= 2024, 1, 0) AS ?openNow)
  FILTER( (BOUND(?startYr) && ?startYr >= 1900) ||
          (BOUND(?endYr)   && ?endYr   >= 1900) )
  OPTIONAL { ?p wdt:P18    ?image }
  OPTIONAL { ?p wdt:P10428 ?mp }
  OPTIONAL { ?p wdt:P102   ?party0 .
             ?party0 rdfs:label ?partyLbl . FILTER(lang(?partyLbl) = "en") }
  OPTIONAL { ?p wdt:P21    ?gnd .
             ?gnd rdfs:label ?gndLbl . FILTER(lang(?gndLbl) = "en") }
  OPTIONAL { ?p wdt:P27    ?ctz .
             ?ctz rdfs:label ?ctzLbl . FILTER(lang(?ctzLbl) = "en") }
  OPTIONAL { ?p rdfs:label ?lbl . FILTER(lang(?lbl) = "en") }
}
GROUP BY ?p
LIMIT ${SEED_LIMIT}`;

// ============================================================================
// Substrate (Bloom, Bundle, helpers) lifted to /kgx/lib/node-flow.mjs.
// pivcab imports the same module — single source of truth.
// ============================================================================
import {
  Bloom, Bundle,
  httpsify, commonsThumb, parsePoint, escapeHTML, valuesQids,
} from '/kgx/lib/node-flow.mjs';

// The shared Bundle also exposes static union / intersect / difference
// (previously only used by pivcab) — daisychain now has them too at no
// extra cost, ready when a future op wants them.

// ============================================================================
// Net helper.
// ============================================================================
// ============================================================================
// Engines — pluggable SPARQL execution. All queries (seed, enrich, pivot)
// route through `engine.query()` so the engine can later be swapped between
// HTTP (today: QLever, FPKG, Wikidata) and in-page Oxigraph wasm without
// touching the op code. Beads record which engine produced each named graph.
// ============================================================================
class SparqlEngine {
  constructor({ id, endpoint, label, kind = 'remote' }) {
    this.id = id; this.endpoint = endpoint; this.label = label; this.kind = kind;
  }
  async query(query, queryLabel = 'sparql') {
    if (this.kind !== 'remote') {
      throw new Error(`engine ${this.id}: kind=${this.kind} not implemented`);
    }
    const u = new URL(this.endpoint);
    u.searchParams.set('query', query);
    const t0 = performance.now();
    const r = await fetch(u.toString(), { headers: { 'Accept': 'application/sparql-results+json' } });
    if (!r.ok) throw new Error(`${queryLabel}: HTTP ${r.status}`);
    const json = await r.json();
    const ms = Math.round(performance.now() - t0);
    console.log('[sparql]', this.id, queryLabel, { ms, rows: json.results.bindings.length });
    return { json, query, endpoint: this.endpoint, engineId: this.id, ms, label: queryLabel };
  }
}

const ENGINES = {
  'qlever-wikidata': new SparqlEngine({
    id: 'qlever-wikidata', endpoint: QLEVER, label: 'QLever ⇒ Wikidata' }),
  'fpkg': new SparqlEngine({
    id: 'fpkg', endpoint: '/kgx/query', label: 'FPKG (Oxigraph, server-side)' }),
  // The official UK Parliament SPARQL (the DDP store). Routed through our
  // proxy at /api/sparql per CLAUDE.md rule 3 — gives caching, TTL, and
  // the OPL attribution header even though the upstream already sends CORS.
  'parl-sparql': new SparqlEngine({
    id: 'parl-sparql', endpoint: '/api/sparql', label: 'UK Parliament SPARQL (DDP)' }),
  // Slot for V2: an in-page Oxigraph wasm engine that operates over each
  // bead's union dataset. Today's ops don't use it, but the API is here.
  // 'oxigraph-wasm': new SparqlEngine({ id: 'oxigraph-wasm', kind: 'wasm', label: 'Oxigraph (in-page wasm)' }),
};
function engine(id) {
  const e = ENGINES[id];
  if (!e) throw new Error('unknown engine: ' + id);
  return e;
}

async function sparql(endpoint, query, label = 'sparql') {
  // Back-compat shim: most call sites still pass an endpoint URL.
  // Look up the matching engine, or fall back to ad-hoc remote.
  for (const e of Object.values(ENGINES)) {
    if (e.endpoint === endpoint) return e.query(query, label);
  }
  const adhoc = new SparqlEngine({ id: 'adhoc', endpoint, label: endpoint });
  return adhoc.query(query, label);
}

// ============================================================================
// Parameterised-query helper — api.parliament.uk/query/ via the local proxy.
//
// PQ is the canonical catalogue of pre-canned SPARQL templates over the DDP
// store (same graph the `parl-sparql` engine queries directly). Returns
// JSON-LD with `@context` + `@graph`; we treat the `@graph` array as the
// row bindings. Not a SparqlEngine — the call doesn't take a SPARQL string,
// just a template name + params.
// ============================================================================
async function pqFetch(template, params = {}, label = 'pq') {
  const u = new URL('/api/query/' + template, window.location.origin);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const t0 = performance.now();
  const r = await fetch(u.toString(), { headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error(`${label}: HTTP ${r.status}`);
  const json = await r.json();
  const ms = Math.round(performance.now() - t0);
  const rows = Array.isArray(json['@graph']) ? json['@graph'] : [];
  console.log('[pq]', label, { ms, rows: rows.length });
  return { json, rows, query: u.toString(), endpoint: '/api/query/', engineId: 'parl-query', ms, label };
}

// Provenance: a Source is one fetched/computed contribution to a bead. Each
// gets a synthesised named-graph IRI so the bead is — formally — a SPARQL
// dataset whose contents come from the union of its source graphs. The
// items[] facade the UI consumes is one projection of that dataset.
let _ngSeq = 0;
function newNG(kind) {
  _ngSeq++;
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  return `urn:fmn:bead/${ts}/${_ngSeq}/${kind}`;
}
function makeSource({ kind, endpoint = null, engineId = null, query = null, ms = 0, bindings = [], note = null, relTemplate = null, variant = null, namedGraphs = [] }) {
  return {
    ng: newNG(kind),
    kind,                  // 'seed' | 'enrich' | 'rel:children:sons' | …
    endpoint,              // null for client-side ops
    engineId,              // which engine ran this (null for client-side)
    query,                 // SPARQL text, or null
    ms,
    rowCount: bindings.length,
    bindings,              // kept verbatim so we can render TriG without refetching
    ts: Date.now(),
    note,
    // Relation-template provenance (set when this Source came from a
    // RelationTemplate variant — see REL_TEMPLATES below). Makes the chain
    // legible in the design's vocabulary: "via template 'children', variant
    // 'sons', engine 'qlever-wikidata', named graph: ∅".
    relTemplate,           // e.g. 'children' | 'appg_officer'
    variant,               // e.g. 'default' | 'sons' | 'broaden:family'
    namedGraphs,           // explicit GRAPH IRIs queried (FPKG NGs etc.)
  };
}

// httpsify, commonsThumb → /kgx/lib/node-flow.mjs (imported at top).

// ============================================================================
// Parse + filter ops (same shape as pivcab — same engine).
// ============================================================================
function parseMpRows(bindings) {
  return bindings.map((b) => {
    const uri = b.p.value;
    const firstYr = b.firstYr?.value ? +b.firstYr.value : null;
    const latestStart = b.latestStart?.value ? +b.latestStart.value : null;
    const rawEnd = b.lastYr?.value ? +b.lastYr.value : null;
    const sitting = b.sittingFlag?.value === '1';
    const lastYr = (rawEnd === 9999 || rawEnd === null) ? null : rawEnd;
    const decadeYr = sitting ? latestStart : lastYr;
    const parties = (b.parties?.value || '').split('|').filter(Boolean);
    return {
      uri, label: b.l?.value || uri.replace(/^.*\//, ''),
      image: b.imgUri?.value || null,
      mpid: b.mpid?.value || null,
      firstYr, lastYr, latestStart, sitting, parties,
      gender: b.gender?.value || null,
      citizenships: (b.citizenships?.value || '').split('|').filter(Boolean),
      decade: decadeYr ? `${Math.floor(decadeYr / 10) * 10}s` : null,
    };
  });
}

const opFilters = {
  party:   (b, v) => new Bundle(b.items.filter((x) => x.parties.includes(v)), b.type, v),
  decade:  (b, v) => new Bundle(b.items.filter((x) => x.decade === v),         b.type, v + ' '),
  sitting: (b)    => new Bundle(b.items.filter((x) => x.sitting),              b.type, 'sitting now'),
  bridged: (b)    => new Bundle(b.items.filter((x) => !!x.mpid),               b.type, 'has Members API id'),
};

function nameGender(label) {
  if (!label) return null;
  const first = String(label).trim().split(/[\s.,]+/)[0]?.toLowerCase();
  if (!first) return null;
  if (GENDER_NAMES_FEMALE.has(first)) return 'female';
  if (GENDER_NAMES_MALE.has(first))   return 'male';
  return null;
}

// ============================================================================
// Enrich + pivot — every item is its own mini-graph (`item.extra`). Enrich
// grows the per-item graph in place; pivot walks one of the edges and
// produces a new bundle of a new entity type.
// ============================================================================
const ENRICH_MAX = 500;  // soft cap: bundles bigger than this won't enrich

// parsePoint → /kgx/lib/node-flow.mjs (imported at top).

function valuesClause(uris) {
  // Turn ["http://www.wikidata.org/entity/Q1", ...] into "wd:Q1 wd:Q2 …"
  return uris
    .map((u) => u.match(/Q\d+$/)?.[0])
    .filter(Boolean)
    .map((q) => `wd:${q}`)
    .join(' ');
}

async function enrichHumans(bundle) {
  const uris = bundle.items.map((x) => x.uri);
  if (!uris.length) return bundle;
  if (uris.length > ENRICH_MAX) {
    throw new Error(`bundle of ${uris.length} is too big to enrich (cap ${ENRICH_MAX}); narrow first.`);
  }
  const q = `
    PREFIX wd:   <http://www.wikidata.org/entity/>
    PREFIX wdt:  <http://www.wikidata.org/prop/direct/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?p
      (SAMPLE(?bp)      AS ?birthplace)
      (SAMPLE(?bpLbl)   AS ?birthplaceLabel)
      (SAMPLE(?bpCoord) AS ?birthplaceCoord)
      (SAMPLE(?ctryLbl) AS ?country)
      (SAMPLE(?dobRaw)  AS ?dobOut)
      (SAMPLE(?dodRaw)  AS ?dodOut)
      (GROUP_CONCAT(DISTINCT ?amLbl;     separator="|") AS ?almaMaters)
      (GROUP_CONCAT(DISTINCT ?spouseLbl; separator="|") AS ?spouses)
      (GROUP_CONCAT(DISTINCT ?occLbl;    separator="|") AS ?occupations)
    WHERE {
      VALUES ?p { ${valuesClause(uris)} }
      OPTIONAL { ?p wdt:P19 ?bp .
                 OPTIONAL { ?bp rdfs:label ?bpLbl . FILTER(lang(?bpLbl)="en") }
                 OPTIONAL { ?bp wdt:P625 ?bpCoord }
                 OPTIONAL { ?bp wdt:P17 ?ctry .
                            OPTIONAL { ?ctry rdfs:label ?ctryLbl . FILTER(lang(?ctryLbl)="en") } }
      }
      OPTIONAL { ?p wdt:P569 ?dobRaw }
      OPTIONAL { ?p wdt:P570 ?dodRaw }
      OPTIONAL { ?p wdt:P69  ?am .     OPTIONAL { ?am rdfs:label ?amLbl . FILTER(lang(?amLbl)="en") } }
      OPTIONAL { ?p wdt:P26  ?sp .     OPTIONAL { ?sp rdfs:label ?spouseLbl . FILTER(lang(?spouseLbl)="en") } }
      OPTIONAL { ?p wdt:P106 ?occ .    OPTIONAL { ?occ rdfs:label ?occLbl . FILTER(lang(?occLbl)="en") } }
    }
    GROUP BY ?p`;
  const res = await sparql(QLEVER, q, `enrich(${uris.length})`);
  const byUri = new Map();
  for (const b of res.json.results.bindings) byUri.set(b.p.value, b);
  // Mutate items in place — same identity, richer .extra.
  const out = bundle.items.map((x) => {
    const b = byUri.get(x.uri);
    if (!b) return x;
    const extra = {
      dob:        b.dobOut?.value || null,
      dod:        b.dodOut?.value || null,
      birthplace: b.birthplace ? {
        uri:    b.birthplace.value,
        label:  b.birthplaceLabel?.value || null,
        country:b.country?.value || null,
        coords: parsePoint(b.birthplaceCoord?.value),
      } : null,
      almaMaters:  (b.almaMaters?.value  || '').split('|').filter(Boolean),
      spouses:     (b.spouses?.value     || '').split('|').filter(Boolean),
      occupations: (b.occupations?.value || '').split('|').filter(Boolean),
    };
    return { ...x, extra: { ...(x.extra || {}), ...extra } };
  });
  const enriched = new Bundle(out, bundle.type, `${bundle.label} + facts`);
  enriched.enriched = true;
  return {
    bundle: enriched,
    source: makeSource({
      kind: 'enrich', endpoint: res.endpoint, engineId: res.engineId, query: res.query, ms: res.ms,
      bindings: res.json.results.bindings,
      note: 'P19 birthplace+P625+P17, P569/P570 dates, P69 alma maters, P26 spouses, P106 occupations',
    }),
  };
}

// Pivot from a human bundle to the set of their birthplaces. Each output
// item is a `place` with its own coords / country / count-of-MPs-from-here.
async function pivotBirthplaces(bundle) {
  const uris = bundle.items.map((x) => x.uri);
  if (!uris.length) return new Bundle([], 'place', 'birthplaces');
  if (uris.length > ENRICH_MAX) {
    throw new Error(`bundle of ${uris.length} is too big to pivot (cap ${ENRICH_MAX}); narrow first.`);
  }
  const q = `
    PREFIX wd:   <http://www.wikidata.org/entity/>
    PREFIX wdt:  <http://www.wikidata.org/prop/direct/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?bp
      (SAMPLE(?bpLbl)   AS ?label)
      (SAMPLE(?bpCoord) AS ?coord)
      (SAMPLE(?img)     AS ?image)
      (SAMPLE(?ctryLbl) AS ?country)
      (COUNT(DISTINCT ?p) AS ?n)
    WHERE {
      VALUES ?p { ${valuesClause(uris)} }
      ?p wdt:P19 ?bp .
      OPTIONAL { ?bp rdfs:label ?bpLbl . FILTER(lang(?bpLbl)="en") }
      OPTIONAL { ?bp wdt:P625 ?bpCoord }
      OPTIONAL { ?bp wdt:P18  ?img }
      OPTIONAL { ?bp wdt:P17  ?ctry .
                 OPTIONAL { ?ctry rdfs:label ?ctryLbl . FILTER(lang(?ctryLbl)="en") } }
    }
    GROUP BY ?bp
    ORDER BY DESC(?n)`;
  const res = await sparql(QLEVER, q, `pivot:birthplaces(${uris.length})`);
  const items = res.json.results.bindings.map((b) => ({
    uri: b.bp.value,
    label: b.label?.value || b.bp.value.replace(/^.*\//, ''),
    image: b.image?.value || null,
    country: b.country?.value || null,
    coords: parsePoint(b.coord?.value),
    originCount: +(b.n?.value || 0),
  }));
  return {
    bundle: new Bundle(items, 'place', `birthplaces of ${bundle.label}`),
    source: makeSource({
      kind: 'pivot:P19', endpoint: res.endpoint, engineId: res.engineId, query: res.query, ms: res.ms,
      bindings: res.json.results.bindings,
      note: `walked P19 (place of birth) over ${uris.length} subjects`,
    }),
  };
}

// Pivot from a human bundle to their alma maters. Each item is an `org`.
async function pivotAlmaMaters(bundle) {
  const uris = bundle.items.map((x) => x.uri);
  if (!uris.length) return new Bundle([], 'org', 'alma maters');
  if (uris.length > ENRICH_MAX) {
    throw new Error(`bundle of ${uris.length} is too big to pivot (cap ${ENRICH_MAX}); narrow first.`);
  }
  const q = `
    PREFIX wd:   <http://www.wikidata.org/entity/>
    PREFIX wdt:  <http://www.wikidata.org/prop/direct/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?am
      (SAMPLE(?amLbl)   AS ?label)
      (SAMPLE(?img)     AS ?image)
      (SAMPLE(?coord)   AS ?coord)
      (SAMPLE(?ctryLbl) AS ?country)
      (COUNT(DISTINCT ?p) AS ?n)
    WHERE {
      VALUES ?p { ${valuesClause(uris)} }
      ?p wdt:P69 ?am .
      OPTIONAL { ?am rdfs:label ?amLbl . FILTER(lang(?amLbl)="en") }
      OPTIONAL { ?am wdt:P18  ?img }
      OPTIONAL { ?am wdt:P625 ?coord }
      OPTIONAL { ?am wdt:P17  ?ctry .
                 OPTIONAL { ?ctry rdfs:label ?ctryLbl . FILTER(lang(?ctryLbl)="en") } }
    }
    GROUP BY ?am
    ORDER BY DESC(?n)`;
  const res = await sparql(QLEVER, q, `pivot:almaMaters(${uris.length})`);
  const items = res.json.results.bindings.map((b) => ({
    uri: b.am.value,
    label: b.label?.value || b.am.value.replace(/^.*\//, ''),
    image: b.image?.value || null,
    country: b.country?.value || null,
    coords: parsePoint(b.coord?.value),
    originCount: +(b.n?.value || 0),
  }));
  return {
    bundle: new Bundle(items, 'org', `alma maters of ${bundle.label}`),
    source: makeSource({
      kind: 'pivot:P69', endpoint: res.endpoint, engineId: res.engineId, query: res.query, ms: res.ms,
      bindings: res.json.results.bindings,
      note: `walked P69 (educated at) over ${uris.length} subjects`,
    }),
  };
}

// ============================================================================
// Relation Templates — the design's `relationTemplate` concept made concrete.
//
// A pivot is not a raw predicate. It is a semantic relation with a default
// implementation, optional `tighten` variants (narrower / stricter), and
// optional `broaden` variants (wider / weaker). The variant a user picks is
// recorded as provenance on the resulting bead, so the chain is legible as
// "via template `children`, variant `sons`" rather than as opaque SPARQL.
//
// Each template specifies:
//   - id, label, gloss           — UI identity
//   - inputType / outputType     — type signature; chip enabled only on a
//                                  bundle of inputType
//   - engineId                   — which engine in ENGINES runs the SPARQL
//   - requires (optional)        — predicate over a bundle; controls
//                                  whether the variant is reachable
//                                  ("appg_officer needs mpid; some seeds
//                                  don't carry it")
//   - variants: [
//       { id, kind: 'default'|'tighten'|'broaden',
//         label, gloss,
//         namedGraphs: [],       — explicit GRAPH IRIs (FPKG NGs etc.)
//         build(items) → SPARQL,
//         parse(bindings) → items, — optional output transformer
//       }, …
//     ]
//
// Output items follow the same shape conventions as the existing pivots:
//   { uri, label, image?, country?, coords?, originCount?,
//     extra?: { … per-template details … } }
// ============================================================================

// valuesQids → /kgx/lib/node-flow.mjs (imported at top).
function valuesMnisPersons(items) {
  // The FPKG appg-register graph keys people by MNIS Members API id; the
  // subject URI is <…/services/mnis/members/<id>>. We carry that as mpid.
  const ids = items.map((x) => x.mpid).filter(Boolean);
  return [...new Set(ids)]
    .map((id) => `<https://data.parliament.uk/membersdataplatform/services/mnis/members/${id}>`)
    .join(' ');
}

async function applyRelation(template, variant, bundle) {
  if (!template) throw new Error('no template');
  if (!variant)  throw new Error('no variant');
  if (template.requires && !template.requires(bundle)) {
    throw new Error(`bundle does not satisfy requires() for "${template.id}"`);
  }
  const sparqlText = variant.build(bundle.items);
  const res = await engine(template.engineId).query(
    sparqlText, `rel:${template.id}:${variant.id}(${bundle.size})`
  );
  const rows = res.json.results.bindings;
  // Per-variant parse fn; otherwise pass bindings through a sensible default.
  const items = (variant.parse || ((rs) => rs.map((b) => {
    // Take the first URI column as subject, the first non-URI as label.
    const cols = Object.keys(b);
    const sCol = cols.find((c) => b[c]?.type === 'uri');
    return {
      uri: b[sCol]?.value || '',
      label: b.label?.value || (sCol && b[sCol].value.replace(/^.*\//, '')) || '',
      originCount: +(b.n?.value || 0),
      image: null, country: null, coords: null,
    };
  })))(rows);
  return {
    bundle: new Bundle(items, template.outputType,
                       `${template.label} (${variant.label}) of ${bundle.label}`),
    source: makeSource({
      kind: `rel:${template.id}:${variant.id}`,
      endpoint: res.endpoint, engineId: res.engineId,
      query: sparqlText, ms: res.ms, bindings: rows,
      relTemplate: template.id, variant: variant.id,
      namedGraphs: variant.namedGraphs || [],
      note: `${template.gloss} · variant=${variant.kind}:${variant.id}`,
    }),
  };
}

// ----------------------------------------------------------------------------
// Enrich from the UK Parliament SPARQL endpoint (not Wikidata). Each input
// item carries a Wikidata QID URI; Parliament's `rdfs:seeAlso` bridge lets
// us look up the corresponding parliament.uk Person and pull the current
// constituency + party + name parts. The result lands in `item.extra.parl`
// and the source is recorded with engineId='parl-sparql'. This is the
// "not solely Wikidata" proof — same op interface, different engine,
// different ontology (id.parliament.uk/schema/* instead of wdt:*).
// ----------------------------------------------------------------------------
async function enrichFromParliament(bundle) {
  const uris = bundle.items.map((x) => x.uri).filter((u) => /Q\d+$/.test(u));
  if (!uris.length) {
    throw new Error('no Wikidata QIDs in this bundle — Parliament join needs the rdfs:seeAlso bridge');
  }
  if (uris.length > ENRICH_MAX) {
    throw new Error(`bundle of ${uris.length} too big to enrich (cap ${ENRICH_MAX})`);
  }
  const values = uris.map((u) => `<${u}>`).join(' ');
  const q = `
    PREFIX schema: <https://id.parliament.uk/schema/>
    PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?qid
           (SAMPLE(?const)        AS ?constituency)
           (SAMPLE(?party)        AS ?parliamentParty)
           (SAMPLE(?fam)          AS ?familyName)
           (SAMPLE(?giv)          AS ?givenName)
           (SAMPLE(?personUri)    AS ?parliamentPerson)
    WHERE {
      VALUES ?qid { ${values} }
      ?personUri rdfs:seeAlso ?qid ;
                 a schema:Member ;
                 schema:memberHasParliamentaryIncumbency ?in .
      OPTIONAL {
        ?in schema:seatIncumbencyHasHouseSeat/schema:houseSeatHasConstituencyGroup/schema:constituencyGroupName ?const
      }
      OPTIONAL {
        ?personUri schema:partyMemberHasPartyMembership ?pm .
        FILTER NOT EXISTS { ?pm schema:partyMembershipEndDate ?pe }
        ?pm schema:partyMembershipHasParty/schema:partyName ?party
      }
      OPTIONAL { ?personUri schema:personFamilyName ?fam }
      OPTIONAL { ?personUri schema:personGivenName  ?giv }
    }
    GROUP BY ?qid`;
  const res = await engine('parl-sparql').query(q, `parl-enrich(${uris.length})`);
  const byQid = new Map();
  for (const b of res.json.results.bindings) byQid.set(b.qid.value, b);
  const out = bundle.items.map((x) => {
    const b = byQid.get(x.uri);
    if (!b) return x;
    const parl = {
      personUri:        b.parliamentPerson?.value || null,
      constituency:     b.constituency?.value || null,
      currentParty:     b.parliamentParty?.value || null,
      familyName:       b.familyName?.value || null,
      givenName:        b.givenName?.value || null,
    };
    return { ...x, extra: { ...(x.extra || {}), parl } };
  });
  const enriched = new Bundle(out, bundle.type, `${bundle.label} + DDP`);
  enriched.enriched = true;
  return {
    bundle: enriched,
    source: makeSource({
      kind: 'parl-enrich', endpoint: res.endpoint, engineId: res.engineId,
      query: res.query, ms: res.ms, bindings: res.json.results.bindings,
      note: 'join via rdfs:seeAlso to UK Parliament DDP (current constituency + current party + name parts)',
    }),
  };
}

// ----------------------------------------------------------------------------
// Enrich via the cross-source identity graph (fpkg engine, 7 named graphs).
// Resolves each MP's Members API id to its DDP person URI, Wikidata QID,
// GOV.UK people-page slug, and presence of a scraped per-MP website — all
// in one query against the bundled Oxigraph. This is the principled bridge
// the design note asks for: stop hand-rolling rdfs:seeAlso joins in every
// template and route through `parl:memberId` as the canonical key.
// ----------------------------------------------------------------------------
async function enrichFromIdentity(bundle) {
  const ids = [...new Set(bundle.items.map((x) => x.mpid).filter(Boolean))];
  if (!ids.length) {
    throw new Error('no Members API ids on the bundle — the identity bridge keys on parl:memberId');
  }
  if (ids.length > ENRICH_MAX) {
    throw new Error(`bundle of ${ids.length} too big to enrich (cap ${ENRICH_MAX})`);
  }
  const values = ids
    .map((id) => `<https://members-api.parliament.uk/api/Members/${id}>`)
    .join(' ');
  const q = `
    PREFIX owl:    <http://www.w3.org/2002/07/owl#>
    PREFIX schema: <http://schema.org/>
    PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>
    PREFIX fm:     <https://forgetmenot.local/vocab/>
    SELECT ?p
           (SAMPLE(?ddp)       AS ?ddpUri)
           (SAMPLE(?wd)        AS ?wikidataQid)
           (SAMPLE(?govuk)     AS ?govukSlug)
           (SAMPLE(?site)      AS ?scrapedSite)
           (SAMPLE(?platform)  AS ?sitePlatform)
           (SAMPLE(?given)     AS ?givenName)
           (SAMPLE(?family)    AS ?familyName)
    WHERE {
      VALUES ?p { ${values} }
      OPTIONAL { GRAPH <https://forgetmenot.local/graph/identity/ddp-sparql>  { ?p owl:sameAs ?ddp } }
      OPTIONAL { GRAPH <https://forgetmenot.local/graph/identity/wikidata>    { ?p owl:sameAs ?wd } }
      OPTIONAL { GRAPH <https://forgetmenot.local/graph/identity/govuk>       { ?p owl:sameAs ?govuk } }
      OPTIONAL { GRAPH <https://forgetmenot.local/graph/identity/scraped>     { ?p <https://forgetmenot.local/vocab#scrapedSiteDir> ?site } }
      OPTIONAL { GRAPH <https://forgetmenot.local/graph/identity/scraped>     { ?p <https://forgetmenot.local/vocab#sitePlatform>   ?platform } }
      OPTIONAL { GRAPH <https://forgetmenot.local/graph/identity/ddp-sparql>  { ?p schema:givenName  ?given } }
      OPTIONAL { GRAPH <https://forgetmenot.local/graph/identity/ddp-sparql>  { ?p schema:familyName ?family } }
    }
    GROUP BY ?p`;
  const res = await engine('fpkg').query(q, `identity-bridge(${ids.length})`);
  const byMpid = new Map();
  for (const b of res.json.results.bindings) {
    const m = b.p.value.match(/Members\/(\d+)$/);
    if (m) byMpid.set(m[1], b);
  }
  const out = bundle.items.map((x) => {
    const b = x.mpid ? byMpid.get(String(x.mpid)) : null;
    if (!b) return x;
    const identity = {
      ddpUri:        b.ddpUri?.value || null,
      wikidataQid:   b.wikidataQid?.value || null,
      govukSlug:     b.govukSlug?.value || null,
      scrapedSite:   b.scrapedSite?.value || null,
      sitePlatform:  b.sitePlatform?.value || null,
      givenName:     b.givenName?.value || null,
      familyName:    b.familyName?.value || null,
    };
    return { ...x, extra: { ...(x.extra || {}), identity } };
  });
  const enriched = new Bundle(out, bundle.type, `${bundle.label} + identity bridges`);
  enriched.enriched = true;
  return {
    bundle: enriched,
    source: makeSource({
      kind: 'identity-bridge', endpoint: res.endpoint, engineId: res.engineId,
      query: res.query, ms: res.ms, bindings: res.json.results.bindings,
      namedGraphs: [
        'https://forgetmenot.local/graph/identity/ddp-sparql',
        'https://forgetmenot.local/graph/identity/wikidata',
        'https://forgetmenot.local/graph/identity/govuk',
        'https://forgetmenot.local/graph/identity/scraped',
      ],
      note: `joined ${ids.length} Members API ids across 4 identity graphs in fpkg (parl:memberId as canonical key)`,
    }),
  };
}

// ----------------------------------------------------------------------------
// Seed from Parliament SPARQL — current sitting MPs with the embedded
// Wikidata bridge. Returns rows shaped to the same `human` Bundle the
// Wikidata seed produces, so OPS.human chips work without changes.
// ----------------------------------------------------------------------------
const PARL_CURRENT_MPS_QUERY = `
PREFIX schema: <https://id.parliament.uk/schema/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?person
       (SAMPLE(?qid)   AS ?wd)
       (SAMPLE(?fam)   AS ?fam)
       (SAMPLE(?giv)   AS ?giv)
       (SAMPLE(?const) AS ?constituency)
       (SAMPLE(?party) AS ?party)
       (SAMPLE(?mid)   AS ?mpid)
WHERE {
  ?person a schema:Member ;
          schema:memberHasParliamentaryIncumbency ?in .
  ?in a schema:SeatIncumbency .
  FILTER NOT EXISTS { ?in schema:incumbencyEndDate ?end }
  ?in schema:seatIncumbencyHasHouseSeat/schema:houseSeatHasConstituencyGroup/schema:constituencyGroupName ?const .
  OPTIONAL { ?person schema:personFamilyName ?fam }
  OPTIONAL { ?person schema:personGivenName  ?giv }
  OPTIONAL { ?person rdfs:seeAlso ?qid }
  OPTIONAL { ?person schema:memberId ?mid }
  OPTIONAL { ?person schema:partyMemberHasPartyMembership ?pm .
             FILTER NOT EXISTS { ?pm schema:partyMembershipEndDate ?pe }
             ?pm schema:partyMembershipHasParty/schema:partyName ?party }
}
GROUP BY ?person`;

function parseParlCurrentRows(bindings) {
  return bindings.map((b) => {
    const giv  = b.giv?.value || '';
    const fam  = b.fam?.value || '';
    const wd   = b.wd?.value || null;
    const uri  = wd || b.person.value;
    return {
      uri,
      label: (giv + ' ' + fam).trim() || uri.replace(/^.*\//, ''),
      image: null,
      mpid: b.mpid?.value || null,
      parliamentPerson: b.person.value,
      firstYr: null, lastYr: null, latestStart: null,
      sitting: true,
      parties: [b.party?.value].filter(Boolean),
      gender: null, citizenships: [],
      decade: '2020s',
      // Pre-populate the parl-side extra so the bead reads "enriched" even
      // before the user runs the Parliament enrich op.
      extra: {
        parl: {
          personUri: b.person.value,
          constituency: b.const?.value || null,
          currentParty: b.party?.value || null,
          familyName: fam || null,
          givenName:  giv || null,
        },
      },
    };
  });
}

      values: (b) => sortByKey(countBy(b.items, 'decade')),
      run:    (b, v) => opFilters.decade(b, v) },
    { id: 'gender',  label: 'gender…',     icon: '⚧', kind: 'picker',
      // Picker rows: for each gender, an "exact P21" count and (when any items
      // have a null gender) a separate "+ heuristic from first name" count.
      // Heuristic is an explicit choice — never silently merged with exact.
      values: (b) => {
        const rows = [];
        const noGender = b.items.filter((x) => !x.gender);
        for (const g of ['female', 'male']) {
          const exact = b.items.filter((x) => x.gender === g).length;
          if (exact) rows.push([`${g} (exact P21)`, exact]);
          if (noGender.length) {
            const heu = noGender.filter((x) => nameGender(x.label) === g).length;
            if (heu) rows.push([`${g} (+ first-name heuristic)`, exact + heu]);
          }
        }
        return rows;
      },
      run: (b, v) => {
        // Back-compat: legacy library entries used plain 'female' / 'male'.
        const legacy = (v === 'female' || v === 'male');
        const m = legacy ? [null, v] : v.match(/^(female|male)\b/);
        const g = m?.[1];
        if (!g) return new Bundle([], b.type, `${b.label} · ${v}`);
        const useHeuristic = /heuristic/.test(v);
        const filtered = b.items.filter((x) =>
          x.gender === g ||
          (useHeuristic && !x.gender && nameGender(x.label) === g));
        const out = new Bundle(filtered, b.type, `${b.label} · ${v}`);
        // Stash a breakdown for the Source note (read by _onOp's picker branch).
        out._opNote = (() => {
          const ex  = b.items.filter((x) => x.gender === g).length;
          const heu = filtered.length - ex;
          return useHeuristic
            ? `gender=${g}; exact P21: ${ex} · first-name heuristic: ${heu} (ambiguous names — Alex, Sam, Chris, Pat, Jamie, Lee, Robin, Kim, Jo — explicitly excluded by the dictionary)`
            : `gender=${g}; exact P21 only: ${ex}`;
        })();
        return out;

// Generic group-by: emit a synthetic "group" bundle where each item is a
// pseudo-entity with a label + count. Type kept the same so the op
// palette is still applicable to the underlying type (a "by country"
// of places is still 'place'-flavoured for the next pivot).
function groupBy(bundle, keyFn, asLabel) {
  const groups = new Map();
  for (const x of bundle.items) {
    const k = keyFn(x);
    if (!k) continue;
    if (!groups.has(k)) groups.set(k, { uri: 'group:' + k, label: k, count: 0, image: null });
    groups.get(k).count++;
  }
  const items = [...groups.values()].sort((a, b) => b.count - a.count);
  return new Bundle(items, bundle.type, `${bundle.label} by ${asLabel}`);
}

function countBy(items, field) {
  const m = new Map();
  for (const x of items) { const v = x[field]; if (v) m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function sortByKey(pairs) { return [...pairs].sort((a, b) => a[0].localeCompare(b[0])); }
function topCounts(strs) {
  const m = new Map();
  for (const s of strs) m.set(s, (m.get(s) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 30);
}

// ============================================================================
// State — one ordered list of beads. Each bead carries the bundle it produced.
// ============================================================================
const state = {
  starter: null,         // STARTERS entry once chosen
  beads: [],             // [{ id, opLabel, opIcon, bundle }]  ordered
  view: 'spine',         // 'spine' | 'graph' | 'table' | 'tiles'
};
const listeners = new Set();
function publish() { for (const fn of listeners) fn(); }

let _ids = 0;
function pushBead(opLabel, opIcon, bundle, sources = [], spec = null) {
  state.beads.push({
    id: 'b' + (++_ids),
    opLabel, opIcon, bundle,
    // A bead's content is, formally, a SPARQL dataset whose named graphs
    // are these sources (plus the ancestor beads' sources, accessible by
    // walking back through state.beads). Default graph is empty.
    sources: Array.isArray(sources) ? sources : [sources],
    // Structured spec that produced this bead — serialised for the library
    // and replayed when a saved chain is opened.
    spec,
  });
  publish();
}
function currentChainSpec() {
  return state.beads.map((b) => b.spec).filter(Boolean);
}
function truncateTo(idx) {
  state.beads.length = idx + 1;
  publish();
}

// ============================================================================
// TriG serialiser — render a bead as a SPARQL dataset (one named graph per
// source). Pseudo-ontology under <urn:fmn:p/> for the SELECT-column-as-
// predicate convention; literal subjects fall back to a blank-node-style URI.
// ============================================================================
function trigTerm(b) {
  if (!b) return '""';
  const v = b.value ?? '';
  if (b.type === 'uri') return `<${v}>`;
  // Datatyped literals
  if (b.datatype) {
    if (b.datatype.endsWith('#integer') || b.datatype.endsWith('#int') ||
        b.datatype.endsWith('#decimal') || b.datatype.endsWith('#double')) {
      return `"${v}"^^<${b.datatype}>`;
    }
    if (b.datatype.endsWith('#dateTime') || b.datatype.endsWith('#date')) {
      return `"${v}"^^<${b.datatype}>`;
    }
    return `"${v.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"^^<${b.datatype}>`;
  }
  if (b['xml:lang']) return `"${v.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"@${b['xml:lang']}`;
  return `"${v.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n')}"`;
}

function beadToTrig(bead) {
  const lines = [
    '# Bead exported as TriG. Each <urn:fmn:bead/…> named graph is a',
    '# verbatim record of one fetch (or one client-side op) that fed this',
    '# bead. Predicates use <urn:fmn:p/> because the SELECT projection',
    '# does not name them; for a normative shape, replace the predicate',
    '# IRI in each line below with whatever ontology you want.',
    '@prefix wd:    <http://www.wikidata.org/entity/> .',
    '@prefix wdt:   <http://www.wikidata.org/prop/direct/> .',
    '@prefix fmn:   <urn:fmn:p/> .',
    '@prefix xsd:   <http://www.w3.org/2001/XMLSchema#> .',
    '@prefix prov:  <http://www.w3.org/ns/prov#> .',
    '',
  ];
  for (const src of bead.sources || []) {
    lines.push(`# ${src.kind} — endpoint=${src.endpoint || '(client)'} ms=${src.ms} rows=${src.rowCount} ts=${new Date(src.ts).toISOString()}`);
    if (src.note)  lines.push(`# note: ${src.note}`);
    if (src.query) lines.push('# query:' + src.query.split('\n').map((l) => '\n#   ' + l).join(''));
    lines.push(`<${src.ng}> {`);
    for (const row of (src.bindings || [])) {
      // Choose the row's subject: prefer ?p, then ?bp/?am etc.; otherwise
      // the first URI-typed binding.
      let subjVar = null;
      for (const k of ['p', 'bp', 'am', 'person', 'subject']) {
        if (row[k] && row[k].type === 'uri') { subjVar = k; break; }
      }
      if (!subjVar) {
        for (const [k, v] of Object.entries(row)) {
          if (v.type === 'uri') { subjVar = k; break; }
        }
      }
      if (!subjVar) continue;
      const s = trigTerm(row[subjVar]);
      for (const [k, v] of Object.entries(row)) {
        if (k === subjVar) continue;
        lines.push(`  ${s} fmn:${k} ${trigTerm(v)} .`);
      }
    }
    lines.push('}', '');
  }
  return lines.join('\n');
}

// ============================================================================
// Shared lazy-image observer (same trick as pivcab).
// ============================================================================
const tileIo = new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (en.isIntersecting) {
      const img = en.target, src = img.dataset.src;
      if (src && !img._loaded) {
        img._loaded = true; img.src = src;
        img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
        tileIo.unobserve(img);
      }
    }
  }
}, { rootMargin: '200px 0px' });

// ============================================================================
// <daisy-bead> — one bead in the chain. Renders count, op verb, thumb strip,
// and (if this is the frontier) the contextual op chip row.
// ============================================================================
class DaisyBead extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }
  set bead(b)     { this._bead = b; this.render(); }
  set frontier(f) { this._frontier = f; this.render(); }
  set index(i)    { this._index = i; this.render(); }
  render() {
    const b = this._bead;
    if (!b) return;
    const front = !!this._frontier;
    const idx = this._index ?? 0;
    const thumbs = (b.bundle?.items || []).filter((x) => x.image).slice(0, 8);
    this.shadowRoot.innerHTML = `
      <style>
        :host { display: block; position: relative; }
        .card {
          background: var(--surface); border: 1px solid var(--rule-soft);
          border-radius: 14px; padding: 12px 14px;
          box-shadow: var(--shadow);
          position: relative;
        }
        :host([frontier]) .card {
          border-color: var(--accent);
          box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent),
                      var(--shadow-lift);
        }
        .head { display: flex; gap: 8px; align-items: baseline; }
        .idx { font-size: 11px; color: var(--ink-mute); width: 18px; flex: 0 0 18px;
               font-variant-numeric: tabular-nums; }
        .op { font-size: 12px; color: var(--ink-mute); }
        .verb { color: var(--accent); font-weight: 600; }
        .title { font-weight: 700; font-size: 15px; color: var(--ink);
                 overflow: hidden; text-overflow: ellipsis; }
        .count { margin-left: auto; font-variant-numeric: tabular-nums;
                 font-size: 13px; color: var(--ink-soft); font-weight: 600; }
        .info { background: none; border: 0; color: var(--ink-mute);
                font-size: 14px; cursor: pointer; padding: 2px 6px;
                border-radius: 4px; margin-left: 6px; }
        .info:hover { color: var(--accent); background: var(--surface-2); }
        .strip { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
        .strip img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px;
                     background: var(--surface-2); opacity: 0;
                     transition: opacity 0.4s; }
        .strip img.loaded { opacity: 1; }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
        .chip {
          background: var(--surface-2); color: var(--ink);
          border: 1px solid var(--rule-soft);
          border-radius: 999px; padding: 6px 12px;
          font: 13px/1 -apple-system, system-ui, sans-serif;
          cursor: pointer; user-select: none;
          transition: background 0.12s, border-color 0.12s;
        }
        .chip:hover, .chip:focus {
          background: color-mix(in oklab, var(--accent) 12%, var(--surface-2));
          border-color: var(--accent); outline: none;
        }
        .chip .ic { font-size: 12px; margin-right: 4px; }
        .meta { font-size: 12px; color: var(--ink-mute); margin-top: 6px;
                display: flex; gap: 8px; flex-wrap: wrap; }
        .hist-hint {
          font-size: 11px; color: var(--ink-mute); margin-top: 8px;
          cursor: pointer;
        }
        .hist-hint:hover { color: var(--ink-soft); }
        .grow {
          margin-top: 10px; padding: 8px 0 0;
          border-top: 1px dashed var(--rule-soft);
          font-size: 12px; color: var(--ink-mute);
        }
      </style>
      <div class="card">
        <div class="head">
          <span class="idx"></span>
          <span class="op"><span class="ic"></span> <span class="verb"></span></span>
          <span class="title"></span>
          <span class="count"></span>
          <button class="info" title="lineage / named graphs / TriG" aria-label="info">ⓘ</button>
        </div>
        <div class="strip"></div>
        <div class="meta"></div>
        ${front ? `<div class="grow">tap a chip to grow the chain</div><div class="chips"></div>`
                : `<div class="hist-hint">↺ tap to undo back to here</div>`}
      </div>
    `;
    if (front) this.setAttribute('frontier', ''); else this.removeAttribute('frontier');
    this.shadowRoot.querySelector('.idx').textContent = `${idx + 1}.`;
    this.shadowRoot.querySelector('.ic').textContent = b.opIcon || '';
    this.shadowRoot.querySelector('.verb').textContent = b.opLabel || '';
    this.shadowRoot.querySelector('.title').textContent = b.bundle?.label || '';
    this.shadowRoot.querySelector('.count').textContent = (b.bundle?.size ?? 0).toLocaleString();

    // Thumb strip
    const strip = this.shadowRoot.querySelector('.strip');
    for (const p of thumbs) {
      const img = document.createElement('img');
      img.alt = ''; img.dataset.src = commonsThumb(p.image, 96);
      strip.appendChild(img);
      tileIo.observe(img);
    }

    // Meta line — what we surface depends on the bead type and whether
    // the per-item multigraph has been enriched.
    const meta = this.shadowRoot.querySelector('.meta');
    meta.innerHTML = '';
    if (b.bundle?.items?.length) {
      const items = b.bundle.items;
      const bits = [];
      if (b.bundle.type === 'human') {
        const sitting = items.filter((x) => x.sitting).length;
        const topParty = topCounts(items.flatMap((x) => x.parties)).slice(0, 1)[0];
        const topDec   = countBy(items, 'decade').slice(0, 1)[0];
        const topGnd   = topCounts(items.map((x) => x.gender).filter(Boolean)).slice(0, 1)[0];
        if (sitting > 0) bits.push(`sitting: ${sitting}`);
        if (topParty)    bits.push(`top party: ${topParty[0]} (${topParty[1]})`);
        if (topDec)      bits.push(`peak: ${topDec[0]} (${topDec[1]})`);
        if (topGnd)      bits.push(`${topGnd[0]}: ${topGnd[1]}`);
        // Wikidata enrichment summary — only present after ✨.
        const wdEnriched = items.filter((x) => x.extra && (x.extra.birthplace || x.extra.almaMaters?.length));
        if (wdEnriched.length) {
          const withBp = wdEnriched.filter((x) => x.extra.birthplace).length;
          const withCoord = wdEnriched.filter((x) => x.extra.birthplace?.coords).length;
          const topBp = topCounts(wdEnriched.map((x) => x.extra.birthplace?.label).filter(Boolean)).slice(0, 1)[0];
          const topAm = topCounts(wdEnriched.flatMap((x) => x.extra.almaMaters || [])).slice(0, 1)[0];
          const topOcc= topCounts(wdEnriched.flatMap((x) => x.extra.occupations || [])).slice(0, 1)[0];
          bits.push(`✨ ${wdEnriched.length} from WD`);
          if (withBp)  bits.push(`born known: ${withBp} (mapped: ${withCoord})`);
          if (topBp)   bits.push(`top birthplace: ${topBp[0]} (${topBp[1]})`);
          if (topAm)   bits.push(`top alma: ${topAm[0]} (${topAm[1]})`);
          if (topOcc)  bits.push(`top occ: ${topOcc[0]} (${topOcc[1]})`);
        }
        // Parliament-DDP enrichment summary — only present after 🏛.
        const parlEnriched = items.filter((x) => x.extra?.parl);
        if (parlEnriched.length) {
          const withConst = parlEnriched.filter((x) => x.extra.parl.constituency).length;
          const topConst = topCounts(parlEnriched.map((x) => x.extra.parl.constituency).filter(Boolean)).slice(0, 1)[0];
          const topParlParty = topCounts(parlEnriched.map((x) => x.extra.parl.currentParty).filter(Boolean)).slice(0, 1)[0];
          bits.push(`🏛 ${parlEnriched.length} from DDP`);
          if (withConst)    bits.push(`constituency known: ${withConst}`);
          if (topConst)     bits.push(`top constituency: ${topConst[0]}`);
          if (topParlParty) bits.push(`Parl party top: ${topParlParty[0]} (${topParlParty[1]})`);
        }
        // identity-graph bridge enrichment (fpkg engine, 4 NGs).
        const bridged = items.filter((x) => x.extra?.identity);
        if (bridged.length) {
          const ddp   = bridged.filter((x) => x.extra.identity.ddpUri).length;
          const wd    = bridged.filter((x) => x.extra.identity.wikidataQid).length;
          const govuk = bridged.filter((x) => x.extra.identity.govukSlug).length;
          const site  = bridged.filter((x) => x.extra.identity.scrapedSite).length;
          bits.push(`🔗 ${bridged.length} bridged`);
          if (ddp)   bits.push(`DDP: ${ddp}`);
          if (wd)    bits.push(`Wikidata: ${wd}`);
          if (govuk) bits.push(`GOV.UK: ${govuk}`);
          if (site)  bits.push(`site scraped: ${site}`);
        }
      } else if (b.bundle.type === 'place' || b.bundle.type === 'org') {
        const withCoord = items.filter((x) => x.coords).length;
        const topCountry = topCounts(items.map((x) => x.country).filter(Boolean)).slice(0, 1)[0];
        const topOrigin = [...items].sort((a, b) => (b.originCount || 0) - (a.originCount || 0))[0];
        bits.push(`mapped: ${withCoord}`);
        if (topCountry) bits.push(`top country: ${topCountry[0]} (${topCountry[1]})`);
        if (topOrigin?.originCount) bits.push(`heaviest: ${topOrigin.label} (${topOrigin.originCount})`);
      } else if (b.bundle.type === 'building') {
        const withCoord = items.filter((x) => x.coords).length;
        const withImg   = items.filter((x) => x.image).length;
        const topCountry = topCounts(items.map((x) => x.country).filter(Boolean)).slice(0, 1)[0];
        bits.push(`mapped: ${withCoord}`);
        if (withImg)    bits.push(`photo: ${withImg}`);
        if (topCountry) bits.push(`top country: ${topCountry[0]} (${topCountry[1]})`);
      } else if (b.bundle.type === 'si') {
        const withYear = items.filter((x) => x.year).length;
        const topYear  = countBy(items, 'year').slice(0, 1)[0];
        const withCif  = items.filter((x) => x.comingIntoForce).length;
        if (withYear) bits.push(`year known: ${withYear}`);
        if (topYear)  bits.push(`peak year: ${topYear[0]} (${topYear[1]})`);
        if (withCif)  bits.push(`with CIF date: ${withCif}`);
      }
      // -- Cardinality hint — non-blocking, advisory only.
      // The thresholds catch the two common pain points: a pivot that
      // returned almost nothing (often a "broaden" candidate), or one
      // that returned thousands (often a "narrow before enrich" candidate).
      const n = b.bundle.size;
      if (n > 0 && n < 5) bits.push('⚠ sparse — try a broaden variant or a different pivot');
      else if (n > 1000)  bits.push('⚠ large — narrow before ✨ enrich or pivot (cap is 500)');
      meta.textContent = bits.join('  ·  ');
    }

    // ⓘ — open lineage / TriG sheet
    const infoBtn = this.shadowRoot.querySelector('.info');
    if (infoBtn) {
      infoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const sheet = document.createElement('daisy-info-sheet');
        sheet.open(b);
      });
    }

    if (front) {
      const chipRow = this.shadowRoot.querySelector('.chips');
      const ops = OPS[b.bundle?.type] || [];
      for (const op of ops) {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.innerHTML = `<span class="ic"></span><span class="lbl"></span>`;
        chip.querySelector('.ic').textContent = op.icon + ' ';
        chip.querySelector('.lbl').textContent = op.label;
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          this.dispatchEvent(new CustomEvent('op-tap', {
            detail: { op, bundle: b.bundle }, bubbles: true, composed: true,
          }));
        });
        chipRow.appendChild(chip);
      }
    } else {
      // Tapping an older bead truncates the chain back to it — except when
      // the click landed on the .info button (handled above).
      this.shadowRoot.querySelector('.card').addEventListener('click', (e) => {
        if (e.target.closest('.info')) return;
        this.dispatchEvent(new CustomEvent('bead-undo', {
          detail: { index: idx }, bubbles: true, composed: true,
        }));
      });
    }
  }
}
customElements.define('daisy-bead', DaisyBead);

// ============================================================================
// <daisy-rel-picker> — bottom sheet for the `→ pivot…` chip. Lists every
// RelationTemplate applicable to the frontier bundle's type, with each
// template's variants visibly grouped as default / tighten / broaden so the
// "no silent broadening" principle is enforced at the picker UI level. Each
// row prints the engine (Wikidata / Parl DDP / FPKG) and any named graph
// the variant restricts to.
// ============================================================================
class DaisyRelPicker extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: 'open' }); }
  open(bundle) {
    this._bundle = bundle;
    const applicable = REL_TEMPLATES.filter((t) => t.inputType === bundle.type);
    const enabledFor = (t) => !t.requires || t.requires(bundle);
    const KIND_LBL = { default: 'default', tighten: 'tighten', broaden: 'broaden' };
    const tplSections = applicable.map((t) => {
      const ok = enabledFor(t);
      const eng = ENGINES[t.engineId];
      const rows = t.variants.map((v) => {
        const ngHint = (v.namedGraphs && v.namedGraphs.length)
          ? `<div class="ngs">graph: <code>${v.namedGraphs.map(escapeHTML).join(', ')}</code></div>` : '';
        return `
          <button class="vrow ${v.kind}" data-tpl="${t.id}" data-var="${v.id}" ${ok ? '' : 'disabled'}>
            <span class="vkind">${KIND_LBL[v.kind] || v.kind}</span>
            <span class="vlbl">${escapeHTML(v.label)}</span>
            <span class="vgloss">${escapeHTML(v.gloss || '')}</span>
            ${ngHint}
          </button>`;
      }).join('');
      return `
        <section class="tpl ${ok ? '' : 'disabled'}">
          <header>
            <span class="tlbl">${escapeHTML(t.label)}</span>
            <span class="ttype">${escapeHTML(t.inputType)} → ${escapeHTML(t.outputType)}</span>
            <span class="teng">${escapeHTML(eng?.label || t.engineId)}</span>
          </header>
          <div class="tgloss">${escapeHTML(t.gloss || '')}</div>
          ${ok ? '' : `<div class="trequires">⚠ disabled: bundle does not satisfy this template's prerequisite</div>`}
          <div class="vrows">${rows}</div>
        </section>`;
    }).join('');
    this.shadowRoot.innerHTML = `
      <style>
        :host { position: fixed; inset: 0; z-index: 100;
                background: color-mix(in oklab, var(--ink) 50%, transparent);
                display: flex; align-items: flex-end; justify-content: center;
                animation: fade 0.18s ease-out; }
        @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
        @keyframes slide { from { transform: translateY(20px) } to { transform: translateY(0) } }
        .sheet {
          width: 100%; max-width: 760px;
          background: var(--surface); color: var(--ink);
          border-radius: 14px 14px 0 0;
          padding: 14px 16px;
          max-height: 88vh; overflow-y: auto;
          box-shadow: 0 -8px 20px rgba(0,0,0,0.18);
          animation: slide 0.22s ease-out;
        }
        .h { display: flex; align-items: baseline; gap: 8px;
             padding-bottom: 10px; border-bottom: 1px solid var(--rule-soft); }
        .title { font-weight: 700; font-size: 15px; }
        .sub { color: var(--ink-mute); font-size: 12px; }
        .close { margin-left: auto; background: none; border: 0; color: var(--ink-mute);
                 font-size: 20px; cursor: pointer; padding: 4px 8px; }
        .tpl { margin: 10px 0; padding: 10px;
               background: var(--surface-2); border: 1px solid var(--rule-soft);
               border-radius: 10px; }
        .tpl.disabled { opacity: 0.5; }
        .tpl header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
        .tlbl { font-weight: 700; font-size: 14px; color: var(--ink); }
        .ttype, .teng {
          font: 10px ui-monospace, Menlo, monospace;
          padding: 2px 6px; border-radius: 3px;
        }
        .ttype { background: color-mix(in oklab, var(--accent) 20%, var(--surface));
                 color: var(--ink); }
        .teng  { background: color-mix(in oklab, var(--good) 20%, var(--surface));
                 color: var(--ink); }
        .tgloss { font-size: 12px; color: var(--ink-soft); margin: 4px 0 8px; }
        .trequires { font-size: 11px; color: #c33; padding: 4px 0 6px; }
        .vrows { display: flex; flex-direction: column; gap: 4px; }
        .vrow {
          display: grid; grid-template-columns: 70px 1fr auto;
          gap: 8px; align-items: baseline; text-align: left;

        .vrow:hover, .vrow:focus {
          border-color: var(--accent);

        .vrow:disabled { opacity: 0.45; cursor: default; }
        .vkind {

      </div>
    `;
    this.shadowRoot.querySelector('.close').addEventListener('click', () => this.remove());
    this.addEventListener('click', (e) => { if (e.target === this) this.remove(); });
    for (const btn of this.shadowRoot.querySelectorAll('.vrow')) {
      btn.addEventListener('click', () => {
        const tpl = REL_TEMPLATES.find((t) => t.id === btn.dataset.tpl);
        const v   = tpl?.variants.find((x) => x.id === btn.dataset.var);
        if (!tpl || !v) return;
        this.dispatchEvent(new CustomEvent('rel-pick', {
          detail: { template: tpl, variant: v }, bubbles: true, composed: true,
        }));
        this.remove();
      });

    document.body.appendChild(this);
  }
}
customElements.define('daisy-rel-picker', DaisyRelPicker);

// ============================================================================
// <daisy-info-sheet> — per-bead lineage panel. Shows what produced this bead
// (the sources / named graphs that compose its dataset), with the SPARQL
// used and a "download as TriG" button.
// ============================================================================
class DaisyInfoSheet extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: 'open' }); }
  open(bead) {
    this._bead = bead;
    const sources = bead.sources || [];
    const srcRows = sources.map((s, i) => `
      <div class="src">
        <div class="src-h">
          <code class="ng">${escapeHTML(s.ng)}</code>
          <span class="kind">${escapeHTML(s.kind)}</span>
          <span class="ct">${s.rowCount.toLocaleString()} rows · ${s.ms} ms</span>

  async _kickoff(starter) {
    state.starter = starter;
    const lead = this.shadowRoot.querySelector('#lead');
    lead.textContent = `loading ${starter.label} …`;
    try {
      const { items, source } = await starter.fetch();
      const bundle = new Bundle(items, starter.type, starter.label);
      pushBead('source', '●', bundle, [source], { kind: 'starter', id: starter.id });
      const sitting = items.filter((x) => x.sitting).length;
      const bridged = items.filter((x) => x.mpid).length;
      lead.innerHTML = `<b>${items.length.toLocaleString()}</b> ${starter.type}s loaded · `
        + `<b>${sitting.toLocaleString()}</b> sitting now · `
        + `<b>${bridged.toLocaleString()}</b> bridged to the Members API. `
        + `Tap a chip on the bottom bead to grow the chain.`;
    } catch (err) {
      this.shadowRoot.querySelector('#view-root').innerHTML =
        `<div class="err">load failed: ${err.message}</div>`;
    }
  }

  async _onOp({ op, bundle }) {
    if (op.kind === 'static') {
      const out = op.run(bundle);
      const src = makeSource({
        kind: `filter:${op.id}`, ms: 0,
        note: `client-side filter "${op.label}" applied to ${bundle.size} → ${out.size}`,
      });
      pushBead(op.label, op.icon, out, [src], { kind: 'op', op: op.id });
      return;
    }
    if (op.kind === 'async') {
      const lead = this.shadowRoot.querySelector('#lead');
      const prev = lead.innerHTML;
      lead.textContent = `${op.icon} ${op.label} — running over ${bundle.size.toLocaleString()} ${bundle.type}s…`;
      try {
        const out = await op.run(bundle);
        const newBundle = out instanceof Bundle ? out : out.bundle;
        const sources = out instanceof Bundle ? [] : [out.source];
        pushBead(op.label, op.icon, newBundle, sources, { kind: 'op', op: op.id });
        lead.innerHTML = prev;
      } catch (err) {
        lead.innerHTML = `<span style="color:#c33">${escapeHTML(op.label)} failed: ${escapeHTML(err.message)}</span>`;
      }
      return;
    }
    if (op.kind === 'rel-picker') {
      const sheet = document.createElement('daisy-rel-picker');
      sheet.addEventListener('rel-pick', async (e) => {
        const { template, variant } = e.detail;
        const lead = this.shadowRoot.querySelector('#lead');
        const prev = lead.innerHTML;
        lead.textContent = `⇄ ${template.label} · ${variant.label} (${variant.kind}) — running…`;
        try {
          const out = await applyRelation(template, variant, bundle);
          pushBead(`${template.label} · ${variant.label}`, '⇄',
                   out.bundle, [out.source],
                   { kind: 'op', op: 'rel-pivot',
                     template: template.id, variant: variant.id });
          lead.innerHTML = prev;
        } catch (err) {
          lead.innerHTML = `<span style="color:#c33">${escapeHTML(template.label)} / ${escapeHTML(variant.label)} failed: ${escapeHTML(err.message)}</span>`;
        }
      });
      sheet.open(bundle);
      return;
    }
    // picker
    const sheet = document.createElement('daisy-picker');
    sheet.addEventListener('pick', (e) => {
      const out = e.detail.op.run(bundle, e.detail.value);
      const extra = out._opNote ? ` · ${out._opNote}` : '';
      const src = makeSource({
        kind: `filter:${e.detail.op.id}:${e.detail.value}`, ms: 0,
        note: `client-side picker "${e.detail.op.label}" = "${e.detail.value}" applied to ${bundle.size} → ${out.size}${extra}`,
      });
      pushBead(`${e.detail.op.label.replace(/…$/, '')}: ${e.detail.value}`, e.detail.op.icon, out, [src],
               { kind: 'op', op: e.detail.op.id, value: e.detail.value });
    });
    sheet.open(op, bundle);
  }

  // Replay a saved chain step-by-step. Awaits async ops; surfaces failures.
  async _replay(entry) {
    state.beads = [];
    state.starter = null;
    publish();
    for (const step of entry.steps || []) {
      try {
        if (step.kind === 'starter') {
          const s = STARTERS.find((x) => x.id === step.id);
          if (!s) throw new Error('unknown starter ' + step.id);
          await this._kickoff(s);
        } else if (step.kind === 'op') {
          const front = state.beads[state.beads.length - 1];
          if (!front?.bundle) throw new Error('no frontier bead for op ' + step.op);
          const ops = OPS[front.bundle.type] || [];
          const op = ops.find((o) => o.id === step.op);
          if (!op) throw new Error(`op "${step.op}" not in OPS[${front.bundle.type}]`);
          if (op.kind === 'static') {
            await this._onOp({ op, bundle: front.bundle });
          } else if (op.kind === 'async') {
            await this._onOp({ op, bundle: front.bundle });
          } else if (op.kind === 'picker') {
            // Use the saved value directly, skipping the picker sheet.
            const out = op.run(front.bundle, step.value);
            const extra = out._opNote ? ` · ${out._opNote}` : '';
            const src = makeSource({
              kind: `filter:${op.id}:${step.value}`, ms: 0,
              note: `replay picker "${op.label}" = "${step.value}"${extra}`,
            });
            pushBead(`${op.label.replace(/…$/, '')}: ${step.value}`, op.icon, out, [src],
                     { kind: 'op', op: op.id, value: step.value });
          } else if (op.kind === 'rel-picker') {
            const tpl = REL_TEMPLATES.find((t) => t.id === step.template);
            const v   = tpl?.variants.find((x) => x.id === step.variant);
            if (!tpl || !v) throw new Error(`unknown rel template ${step.template}/${step.variant}`);
            const out = await applyRelation(tpl, v, front.bundle);
            pushBead(`${tpl.label} · ${v.label}`, '⇄', out.bundle, [out.source],
                     { kind: 'op', op: 'rel-pivot', template: tpl.id, variant: v.id });
          }
        }
      } catch (err) {
        const lead = this.shadowRoot.querySelector('#lead');
        lead.innerHTML = `<span style="color:#c33">replay failed at ${escapeHTML(step.kind)} ${escapeHTML(step.op || step.id || '')}: ${escapeHTML(err.message)}</span>`;
        return;
      }
    }
    if (entry.suggestView) { state.view = entry.suggestView; publish(); }
  }

  _saveChain() {
    const spec = currentChainSpec();
    if (!spec.length) return;
    const payload = { title: 'untitled chain', steps: spec };
    const text = JSON.stringify(payload, null, 2);
    try {
      navigator.clipboard?.writeText(text);
    } catch {}
    const lead = this.shadowRoot.querySelector('#lead');
    lead.innerHTML = `✓ chain copied to clipboard — <b>${spec.length}</b> steps. `
      + `<details style="display:inline"><summary>show JSON</summary><pre style="white-space:pre-wrap;font:11px ui-monospace,Menlo,monospace;">${escapeHTML(text)}</pre></details>`;
  }

  _undoTo(idx) { truncateTo(idx); }

  _reset() {
    state.starter = null;
    state.beads = [];
    publish();
    this.shadowRoot.querySelector('#lead').textContent =
      'A chain of beads. Tap a starter to begin.';
  }

  _render() {
    // Sync the view-segment buttons to current state.
    for (const btn of this.shadowRoot.querySelectorAll('.seg button')) {
      btn.classList.toggle('on', btn.dataset.v === state.view);
    }
    const root = this.shadowRoot.querySelector('#view-root');
    root.innerHTML = '';
    if (!state.beads.length) {
      const starter = document.createElement('daisy-starter');
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.appendChild(starter);
      root.appendChild(empty);
      return;
    }
    // Map view button greys out unless the frontier has any item with coords.
    const front = state.beads[state.beads.length - 1];
    const hasCoords = !!front?.bundle?.items?.some((x) => x.coords || x.extra?.birthplace?.coords);
    const mapBtn = this.shadowRoot.querySelector('#v-map');
    mapBtn.disabled = !hasCoords;
    mapBtn.style.opacity = hasCoords ? '1' : '0.45';
    mapBtn.title = hasCoords
      ? 'map the frontier bead'
      : 'enrich (✨) the bead or pivot to places to populate this view';
    switch (state.view) {
      case 'graph':  this._renderGraph(root); break;
      case 'table':  this._renderTable(root); break;
      case 'tiles':  this._renderTiles(root); break;
      case 'map':    this._renderMap(root);   break;
      case 'spine':
      default:       this._renderSpine(root); break;
    }
  }

  _renderSpine(root) {
    const spine = document.createElement('div');
    spine.className = 'spine';
    const last = state.beads.length - 1;
    for (let i = 0; i <= last; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'bead-wrap';
      if (i === last) wrap.setAttribute('frontier', '');
      const bead = document.createElement('daisy-bead');
      bead.bead = state.beads[i];
      bead.index = i;
      bead.frontier = (i === last);
      wrap.appendChild(bead);
      spine.appendChild(wrap);
    }
    root.appendChild(spine);
    requestAnimationFrame(() => {
      const last = spine.querySelector('.bead-wrap[frontier]');
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }

  _renderGraph(root) {
    // Horizontal DAG of the linear chain — same data as the spine,
    // laid out left-to-right with curved SVG edges between cards.
    const wrap = document.createElement('div');
    wrap.className = 'graph-wrap';
    const g = document.createElement('div');
    g.className = 'graph';
    const last = state.beads.length - 1;
    for (let i = 0; i <= last; i++) {
      const b = state.beads[i];
      const card = document.createElement('div');
      card.className = 'gnode' + (i === last ? ' frontier' : '');
      const thumbs = (b.bundle?.items || []).filter((x) => x.image).slice(0, 6);
      const stripHTML = thumbs.map((p) =>
        `<img alt="" data-src="${commonsThumb(p.image, 56)}">`).join('');
      card.innerHTML = `
        <span class="kind">${i === 0 ? 'source' : (last && i === last ? 'frontier' : 'step')}</span>
        <div class="title"></div>
        <div class="cnt"></div>
        <div class="strip">${stripHTML}</div>
        <div style="font-size:11px;color:var(--ink-mute);">${b.opIcon || ''} ${b.opLabel || ''}</div>
      `;
      card.querySelector('.title').textContent = b.bundle?.label || '';
      card.querySelector('.cnt').textContent = (b.bundle?.size ?? 0).toLocaleString();
      card.addEventListener('click', () => {
        if (i === last) return;
        // Same back-gesture as spine: tap an older node to truncate.
        this._undoTo(i);
      });
      for (const img of card.querySelectorAll('img[data-src]')) tileIo.observe(img);
      g.appendChild(card);
    }
    // SVG overlay for edges
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('gedges');
    svg.innerHTML = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--spine)"/>
        </marker>
      </defs>
      <g class="paths"></g>
    `;
    wrap.appendChild(g);
    wrap.appendChild(svg);
    root.appendChild(wrap);
    requestAnimationFrame(() => this._drawGraphEdges(wrap, g, svg));
  }

  _drawGraphEdges(wrap, g, svg) {
    const cards = g.querySelectorAll('.gnode');
    const wrapBox = wrap.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${wrap.scrollWidth} ${wrap.clientHeight}`);
    svg.setAttribute('width', wrap.scrollWidth);
    svg.setAttribute('height', wrap.clientHeight);
    svg.style.width = wrap.scrollWidth + 'px';
    svg.style.height = wrap.clientHeight + 'px';
    const paths = svg.querySelector('.paths');
    paths.innerHTML = '';
    for (let i = 0; i < cards.length - 1; i++) {
      const a = cards[i].getBoundingClientRect();
      const b = cards[i + 1].getBoundingClientRect();
      const x1 = a.right - wrapBox.left + wrap.scrollLeft;
      const y1 = a.top   - wrapBox.top + a.height / 2;
      const x2 = b.left  - wrapBox.left + wrap.scrollLeft;
      const y2 = b.top   - wrapBox.top + b.height / 2;
      const dx = Math.max(20, (x2 - x1) / 2);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2 - 4} ${y2}`);
      paths.appendChild(path);
    }
    // Scroll to frontier
    const front = g.querySelector('.gnode.frontier');
    if (front) front.scrollIntoView({ behavior: 'smooth', inline: 'end', block: 'nearest' });
  }

  _renderTable(root) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const last = state.beads.length - 1;
    const rows = state.beads.map((b, i) => {
      const sitting = b.bundle?.items?.filter((x) => x.sitting).length || 0;
      const bridged = b.bundle?.items?.filter((x) => x.mpid).length || 0;
      return `
        <tr data-i="${i}" class="${i === last ? 'frontier' : ''}">
          <td>${i + 1}</td>
          <td>${b.opIcon || ''} ${b.opLabel || ''}</td>
          <td>${escapeHTML(b.bundle?.label || '')}</td>
          <td class="cnt">${(b.bundle?.size ?? 0).toLocaleString()}</td>
          <td class="cnt">${sitting.toLocaleString()}</td>
          <td class="cnt">${bridged.toLocaleString()}</td>
        </tr>
      `;
    }).join('');
    wrap.innerHTML = `
      <table class="beads">
        <thead><tr>
          <th>#</th><th>op</th><th>set</th><th>n</th><th>sitting</th><th>w/ MP id</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    for (const tr of wrap.querySelectorAll('tbody tr')) {
      tr.addEventListener('click', () => {
        const idx = +tr.dataset.i;
        if (idx !== last) this._undoTo(idx);
      });
    }
    root.appendChild(wrap);
  }

  _renderMap(root) {
    // Collect points from the frontier bundle. Places carry coords directly;
    // enriched humans carry them under .extra.birthplace.coords.
    const last = state.beads[state.beads.length - 1];
    if (!last?.bundle) return;
    const points = [];
    for (const x of last.bundle.items) {
      const c = x.coords || x.extra?.birthplace?.coords;
      if (!c) continue;
      const lbl = x.label || x.extra?.birthplace?.label || '';
      const wt  = x.originCount || 1;  // place: how many MPs map here
      points.push({ ...c, label: lbl, weight: wt, uri: x.uri });
    }
    const wrap = document.createElement('div');
    wrap.className = 'map-wrap';
    if (!points.length) {
      wrap.innerHTML = `<div style="padding:16px;color:var(--ink-mute);font-size:13px;">
        No coords on the frontier bead yet — try ✨ enrich (on a human bead)
        or → birthplaces.</div>`;
      root.appendChild(wrap);
      return;
    }
    // Auto-fit bbox with padding.
    let minLat = +Infinity, maxLat = -Infinity, minLon = +Infinity, maxLon = -Infinity;
    for (const p of points) {
      if (p.lat < minLat) minLat = p.lat; if (p.lat > maxLat) maxLat = p.lat;
      if (p.lon < minLon) minLon = p.lon; if (p.lon > maxLon) maxLon = p.lon;
    }
    const padLat = Math.max(0.5, (maxLat - minLat) * 0.08);
    const padLon = Math.max(0.5, (maxLon - minLon) * 0.08);
    minLat -= padLat; maxLat += padLat;
    minLon -= padLon; maxLon += padLon;
    const W = 1200, H = 600;
    const proj = (lat, lon) => ({
      x: ((lon - minLon) / (maxLon - minLon)) * W,
      y: ((maxLat - lat) / (maxLat - minLat)) * H,
    });
    const maxWt = points.reduce((m, p) => Math.max(m, p.weight), 1);
    const radius = (w) => 3 + Math.sqrt(w / maxWt) * 14;
    // Cluster identical (lat,lon) so coincident pins stack visibly.
    const byKey = new Map();
    for (const p of points) {
      const k = `${p.lat.toFixed(3)}_${p.lon.toFixed(3)}`;
      if (!byKey.has(k)) byKey.set(k, { ...p, weight: 0, members: [] });
      const g = byKey.get(k); g.weight += p.weight; g.members.push(p);
    }
    const dots = [...byKey.values()].sort((a, b) => b.weight - a.weight).map((p) => {
      const { x, y } = proj(p.lat, p.lon);
      const r = radius(p.weight);
      const title = `${p.members.length === 1 ? p.label : `${p.label} (+${p.members.length - 1} co-located)`} — ${p.weight}`;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"><title>${escapeHTML(title)}</title></circle>`;
    }).join('');
    wrap.innerHTML = `
      <div class="map-head">
        <span class="n">${points.length.toLocaleString()}</span>
        <span>points · bbox ${minLat.toFixed(1)}…${maxLat.toFixed(1)} N, ${minLon.toFixed(1)}…${maxLon.toFixed(1)} E</span>
      </div>
      <svg class="map-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${dots}
      </svg>
    `;
    root.appendChild(wrap);
  }

  _renderTiles(root) {
    // The frontier bundle, full grid. Older beads accessible via the
    // table / spine; this view is about the live result.
    const last = state.beads[state.beads.length - 1];
    if (!last?.bundle) return;
    const head = document.createElement('div');
    head.className = 'tiles-head';
    head.innerHTML = `
      <span class="n">${last.bundle.size.toLocaleString()}</span>
      <span>${escapeHTML(last.bundle.label)}</span>
    `;
    root.appendChild(head);
    const grid = document.createElement('div');
    grid.className = 'tiles';
    const slice = last.bundle.items.slice(0, 3000);
    const bundleType = last.bundle.type;
    const html = new Array(slice.length);
    for (let i = 0; i < slice.length; i++) {
      const p = slice[i];
      let mt = '';
      if (bundleType === 'human') {
        const years = p.sitting && p.firstYr ? `${p.firstYr}–`
                    : p.firstYr && p.lastYr   ? (p.firstYr === p.lastYr ? `${p.firstYr}` : `${p.firstYr}–${p.lastYr}`)
                    : p.lastYr                 ? `${p.lastYr}` : (p.firstYr ? `${p.firstYr}–` : '');
        mt = [years, p.parties?.[0] || ''].filter(Boolean).join(' · ');
      } else if (bundleType === 'building') {
        mt = [p.year ? String(p.year) : '', p.country || '', p.originCount ? `×${p.originCount}` : '']
          .filter(Boolean).join(' · ');
      } else if (bundleType === 'si') {
        mt = [p.year ? String(p.year) : '', p.number ? `№ ${p.number}` : '',
              p.madeDate ? 'made ' + p.madeDate.slice(0, 10) : '']
          .filter(Boolean).join(' · ');
      } else {
        // place / org / appg / party / formal_body / concept …
        const ct = p.originCount ? `${p.originCount}` : (p.count ? `${p.count}` : '');
        mt = [ct, p.country || ''].filter(Boolean).join(' · ');
      }
      html[i] = `<div class="tile">`
        + `<div class="th">${p.image ? `<img alt="" data-src="${commonsThumb(p.image, 220)}">` : ''}</div>`
        + `<div class="body"><div class="nm">${escapeHTML(p.label)}</div>`
        + (mt ? `<div class="mt">${escapeHTML(mt)}</div>` : '')
        + `</div></div>`;
    }
    grid.innerHTML = html.join('');
    for (const img of grid.querySelectorAll('img[data-src]')) tileIo.observe(img);
    root.appendChild(grid);
  }
}
// escapeHTML → /kgx/lib/node-flow.mjs (imported at top).
customElements.define('daisy-app', DaisyApp);
</script>

</body>
</html>
