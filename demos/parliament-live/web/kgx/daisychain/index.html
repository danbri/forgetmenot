<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>daisychain — node-flow as a chain of beads</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:       light-dark(#fbf9f3, #0d0e10);
    --surface:  light-dark(#ffffff, #161719);
    --surface-2:light-dark(#f3efe6, #1f2125);
    --ink:      light-dark(#171717, #f1efe9);
    --ink-soft: light-dark(#3e3e3e, #cac6bd);
    --ink-mute: light-dark(#6a6a6a, #8d8e90);
    --rule:     light-dark(#d6d2c8, #2a2c30);
    --rule-soft:light-dark(#e8e3d6, #232529);
    --accent:   light-dark(#2a4f76, #6aa3d4);
    --accent-on:light-dark(#ffffff, #0a1018);
    --good:     light-dark(#3a8050, #6db384);
    --spine:    color-mix(in oklab, var(--accent) 35%, var(--rule));
    --shadow:        0 1px 2px rgba(0,0,0,0.05);
    --shadow-lift:   0 4px 12px rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  a { color: var(--accent); }
  code, .mono { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<daisy-app></daisy-app>

<script type="module">
// ============================================================================
// /kgx/daisychain/ — bead-spine interaction over the same Bundle / Bloom
// engine as /kgx/pivcab/. One linear chain of [data] · op · [data] · op · …
// beads scrolling top-to-bottom. The contextual op chip row on the frontier
// bead is the only place the user makes decisions; older beads are history.
// Tapping an earlier bead truncates the chain back to that point (an "undo
// from here"). Forks (V2) would let two chains share the prefix.
// ============================================================================

const QLEVER = 'https://qlever.dev/api/wikidata';
const SEED_LIMIT = 7000;

const POST1900_MPS_QUERY = `
PREFIX wd:     <http://www.wikidata.org/entity/>
PREFIX wdt:    <http://www.wikidata.org/prop/direct/>
PREFIX p:      <http://www.wikidata.org/prop/>
PREFIX ps:     <http://www.wikidata.org/prop/statement/>
PREFIX pq:     <http://www.wikidata.org/prop/qualifier/>
PREFIX rdfs:   <http://www.w3.org/2000/01/rdf-schema#>

SELECT ?p (SAMPLE(?lbl) AS ?l)
       (SAMPLE(?image) AS ?imgUri)
       (SAMPLE(?mp)    AS ?mpid)
       (MIN(?startYr)  AS ?firstYr)
       (MAX(?startYr)  AS ?latestStart)
       (MAX(?effEnd)   AS ?lastYr)
       (MAX(?openNow)  AS ?sittingFlag)
       (GROUP_CONCAT(DISTINCT ?partyLbl; separator="|") AS ?parties)
WHERE {
  ?p wdt:P39 ?pos .
  ?pos wdt:P279* wd:Q16707842 .
  ?p p:P39 ?stmt . ?stmt ps:P39 ?pos .
  OPTIONAL { ?stmt pq:P580 ?start . BIND(YEAR(?start) AS ?startYr) }
  OPTIONAL { ?stmt pq:P582 ?end   . BIND(YEAR(?end)   AS ?endYr)   }
  BIND(IF(BOUND(?endYr), ?endYr, 9999) AS ?effEnd)
  BIND(IF(BOUND(?startYr) && !BOUND(?endYr) && ?startYr >= 2024, 1, 0) AS ?openNow)
  FILTER( (BOUND(?startYr) && ?startYr >= 1900) ||
          (BOUND(?endYr)   && ?endYr   >= 1900) )
  OPTIONAL { ?p wdt:P18    ?image }
  OPTIONAL { ?p wdt:P10428 ?mp }
  OPTIONAL { ?p wdt:P102   ?party0 .
             ?party0 rdfs:label ?partyLbl . FILTER(lang(?partyLbl) = "en") }
  OPTIONAL { ?p rdfs:label ?lbl . FILTER(lang(?lbl) = "en") }
}
GROUP BY ?p
LIMIT ${SEED_LIMIT}`;

// ============================================================================
// Bloom + Bundle — set-membership and typed set algebra. Copied from pivcab;
// will lift into a shared module once both pages settle.
// ============================================================================
class Bloom {
  constructor(n = 1000, p = 0.01) {
    const m = Math.ceil(-n * Math.log(p) / (Math.LN2 ** 2));
    this.m = Math.max(64, m);
    this.k = Math.max(2, Math.round((this.m / n) * Math.LN2));
    this.bits = new Uint32Array(Math.ceil(this.m / 32));
  }
  _h1(s) { let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0; }
  _h2(s) { let h = this._h1(s);
    h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    return (h ^ (h >>> 16)) >>> 0; }
  add(s) { const h1 = this._h1(s), h2 = this._h2(s);
    for (let i = 0; i < this.k; i++) {
      const b = (h1 + i * h2) % this.m;
      this.bits[b >>> 5] |= (1 << (b & 31));
    }
    return this; }
  has(s) { const h1 = this._h1(s), h2 = this._h2(s);
    for (let i = 0; i < this.k; i++) {
      const b = (h1 + i * h2) % this.m;
      if (!(this.bits[b >>> 5] & (1 << (b & 31)))) return false;
    }
    return true; }
  static from(items, p = 0.01) {
    const bf = new Bloom(items.length || 1, p);
    for (const x of items) bf.add(String(x));
    return bf;
  }
}

class Bundle {
  constructor(items, type = 'human', label = 'set') {
    this.items = items; this.type = type; this.label = label;
    this._ids = null; this._bf = null;
  }
  get ids() { if (!this._ids) this._ids = new Set(this.items.map((x) => x.uri)); return this._ids; }
  get bloom() { if (!this._bf) this._bf = Bloom.from([...this.ids], 0.005); return this._bf; }
  get size() { return this.items.length; }
}

// ============================================================================
// Net helper.
// ============================================================================
async function sparql(endpoint, query, label = 'sparql') {
  const u = new URL(endpoint);
  u.searchParams.set('query', query);
  const t0 = performance.now();
  const r = await fetch(u.toString(), { headers: { 'Accept': 'application/sparql-results+json' } });
  if (!r.ok) throw new Error(`${label}: HTTP ${r.status}`);
  const j = await r.json();
  console.log('[sparql]', label, { ms: Math.round(performance.now() - t0), rows: j.results.bindings.length });
  return j;
}

function httpsify(u) { return String(u || '').replace(/^http:\/\//, 'https://'); }
function commonsThumb(url, w = 220) {
  if (!url) return '';
  const v = httpsify(url);
  if (/commons\.wikimedia\.org\/wiki\/Special:FilePath\//i.test(v)) {
    return v + (v.includes('?') ? '&' : '?') + 'width=' + w;
  }
  return v;
}

// ============================================================================
// Parse + filter ops (same shape as pivcab — same engine).
// ============================================================================
function parseMpRows(bindings) {
  return bindings.map((b) => {
    const uri = b.p.value;
    const firstYr = b.firstYr?.value ? +b.firstYr.value : null;
    const latestStart = b.latestStart?.value ? +b.latestStart.value : null;
    const rawEnd = b.lastYr?.value ? +b.lastYr.value : null;
    const sitting = b.sittingFlag?.value === '1';
    const lastYr = (rawEnd === 9999 || rawEnd === null) ? null : rawEnd;
    const decadeYr = sitting ? latestStart : lastYr;
    const parties = (b.parties?.value || '').split('|').filter(Boolean);
    return {
      uri, label: b.l?.value || uri.replace(/^.*\//, ''),
      image: b.imgUri?.value || null,
      mpid: b.mpid?.value || null,
      firstYr, lastYr, latestStart, sitting, parties,
      decade: decadeYr ? `${Math.floor(decadeYr / 10) * 10}s` : null,
    };
  });
}

const opFilters = {
  party:   (b, v) => new Bundle(b.items.filter((x) => x.parties.includes(v)), b.type, v),
  decade:  (b, v) => new Bundle(b.items.filter((x) => x.decade === v),         b.type, v + ' '),
  sitting: (b)    => new Bundle(b.items.filter((x) => x.sitting),              b.type, 'sitting now'),
  bridged: (b)    => new Bundle(b.items.filter((x) => !!x.mpid),               b.type, 'has Members API id'),
};

// ============================================================================
// Enrich + pivot — every item is its own mini-graph (`item.extra`). Enrich
// grows the per-item graph in place; pivot walks one of the edges and
// produces a new bundle of a new entity type.
// ============================================================================
const ENRICH_MAX = 500;  // soft cap: bundles bigger than this won't enrich

function parsePoint(s) {
  // QLever returns "POINT(lon lat)" as a literal; some endpoints return
  // a WKT geography. Parse loosely.
  const m = String(s || '').match(/POINT\s*\(\s*([-\d.]+)\s+([-\d.]+)\s*\)/i);
  if (!m) return null;
  const lon = +m[1], lat = +m[2];
  if (!Number.isFinite(lon) || !Number.isFinite(lat)) return null;
  return { lat, lon };
}

function valuesClause(uris) {
  // Turn ["http://www.wikidata.org/entity/Q1", ...] into "wd:Q1 wd:Q2 …"
  return uris
    .map((u) => u.match(/Q\d+$/)?.[0])
    .filter(Boolean)
    .map((q) => `wd:${q}`)
    .join(' ');
}

async function enrichHumans(bundle) {
  const uris = bundle.items.map((x) => x.uri);
  if (!uris.length) return bundle;
  if (uris.length > ENRICH_MAX) {
    throw new Error(`bundle of ${uris.length} is too big to enrich (cap ${ENRICH_MAX}); narrow first.`);
  }
  const q = `
    PREFIX wd:   <http://www.wikidata.org/entity/>
    PREFIX wdt:  <http://www.wikidata.org/prop/direct/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?p
      (SAMPLE(?bp)      AS ?birthplace)
      (SAMPLE(?bpLbl)   AS ?birthplaceLabel)
      (SAMPLE(?bpCoord) AS ?birthplaceCoord)
      (SAMPLE(?ctryLbl) AS ?country)
      (SAMPLE(?dobRaw)  AS ?dobOut)
      (SAMPLE(?dodRaw)  AS ?dodOut)
      (GROUP_CONCAT(DISTINCT ?amLbl;     separator="|") AS ?almaMaters)
      (GROUP_CONCAT(DISTINCT ?spouseLbl; separator="|") AS ?spouses)
      (GROUP_CONCAT(DISTINCT ?occLbl;    separator="|") AS ?occupations)
    WHERE {
      VALUES ?p { ${valuesClause(uris)} }
      OPTIONAL { ?p wdt:P19 ?bp .
                 OPTIONAL { ?bp rdfs:label ?bpLbl . FILTER(lang(?bpLbl)="en") }
                 OPTIONAL { ?bp wdt:P625 ?bpCoord }
                 OPTIONAL { ?bp wdt:P17 ?ctry .
                            OPTIONAL { ?ctry rdfs:label ?ctryLbl . FILTER(lang(?ctryLbl)="en") } }
      }
      OPTIONAL { ?p wdt:P569 ?dobRaw }
      OPTIONAL { ?p wdt:P570 ?dodRaw }
      OPTIONAL { ?p wdt:P69  ?am .     OPTIONAL { ?am rdfs:label ?amLbl . FILTER(lang(?amLbl)="en") } }
      OPTIONAL { ?p wdt:P26  ?sp .     OPTIONAL { ?sp rdfs:label ?spouseLbl . FILTER(lang(?spouseLbl)="en") } }
      OPTIONAL { ?p wdt:P106 ?occ .    OPTIONAL { ?occ rdfs:label ?occLbl . FILTER(lang(?occLbl)="en") } }
    }
    GROUP BY ?p`;
  const j = await sparql(QLEVER, q, `enrich(${uris.length})`);
  const byUri = new Map();
  for (const b of j.results.bindings) byUri.set(b.p.value, b);
  // Mutate items in place — same identity, richer .extra.
  const out = bundle.items.map((x) => {
    const b = byUri.get(x.uri);
    if (!b) return x;
    const extra = {
      dob:        b.dobOut?.value || null,
      dod:        b.dodOut?.value || null,
      birthplace: b.birthplace ? {
        uri:    b.birthplace.value,
        label:  b.birthplaceLabel?.value || null,
        country:b.country?.value || null,
        coords: parsePoint(b.birthplaceCoord?.value),
      } : null,
      almaMaters:  (b.almaMaters?.value  || '').split('|').filter(Boolean),
      spouses:     (b.spouses?.value     || '').split('|').filter(Boolean),
      occupations: (b.occupations?.value || '').split('|').filter(Boolean),
    };
    return { ...x, extra: { ...(x.extra || {}), ...extra } };
  });
  const enriched = new Bundle(out, bundle.type, `${bundle.label} + facts`);
  enriched.enriched = true;
  return enriched;
}

// Pivot from a human bundle to the set of their birthplaces. Each output
// item is a `place` with its own coords / country / count-of-MPs-from-here.
async function pivotBirthplaces(bundle) {
  const uris = bundle.items.map((x) => x.uri);
  if (!uris.length) return new Bundle([], 'place', 'birthplaces');
  if (uris.length > ENRICH_MAX) {
    throw new Error(`bundle of ${uris.length} is too big to pivot (cap ${ENRICH_MAX}); narrow first.`);
  }
  const q = `
    PREFIX wd:   <http://www.wikidata.org/entity/>
    PREFIX wdt:  <http://www.wikidata.org/prop/direct/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?bp
      (SAMPLE(?bpLbl)   AS ?label)
      (SAMPLE(?bpCoord) AS ?coord)
      (SAMPLE(?img)     AS ?image)
      (SAMPLE(?ctryLbl) AS ?country)
      (COUNT(DISTINCT ?p) AS ?n)
    WHERE {
      VALUES ?p { ${valuesClause(uris)} }
      ?p wdt:P19 ?bp .
      OPTIONAL { ?bp rdfs:label ?bpLbl . FILTER(lang(?bpLbl)="en") }
      OPTIONAL { ?bp wdt:P625 ?bpCoord }
      OPTIONAL { ?bp wdt:P18  ?img }
      OPTIONAL { ?bp wdt:P17  ?ctry .
                 OPTIONAL { ?ctry rdfs:label ?ctryLbl . FILTER(lang(?ctryLbl)="en") } }
    }
    GROUP BY ?bp
    ORDER BY DESC(?n)`;
  const j = await sparql(QLEVER, q, `pivot:birthplaces(${uris.length})`);
  const items = j.results.bindings.map((b) => ({
    uri: b.bp.value,
    label: b.label?.value || b.bp.value.replace(/^.*\//, ''),
    image: b.image?.value || null,
    country: b.country?.value || null,
    coords: parsePoint(b.coord?.value),
    originCount: +(b.n?.value || 0),
  }));
  return new Bundle(items, 'place', `birthplaces of ${bundle.label}`);
}

// Pivot from a human bundle to their alma maters. Each item is an `org`.
async function pivotAlmaMaters(bundle) {
  const uris = bundle.items.map((x) => x.uri);
  if (!uris.length) return new Bundle([], 'org', 'alma maters');
  if (uris.length > ENRICH_MAX) {
    throw new Error(`bundle of ${uris.length} is too big to pivot (cap ${ENRICH_MAX}); narrow first.`);
  }
  const q = `
    PREFIX wd:   <http://www.wikidata.org/entity/>
    PREFIX wdt:  <http://www.wikidata.org/prop/direct/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?am
      (SAMPLE(?amLbl)   AS ?label)
      (SAMPLE(?img)     AS ?image)
      (SAMPLE(?coord)   AS ?coord)
      (SAMPLE(?ctryLbl) AS ?country)
      (COUNT(DISTINCT ?p) AS ?n)
    WHERE {
      VALUES ?p { ${valuesClause(uris)} }
      ?p wdt:P69 ?am .
      OPTIONAL { ?am rdfs:label ?amLbl . FILTER(lang(?amLbl)="en") }
      OPTIONAL { ?am wdt:P18  ?img }
      OPTIONAL { ?am wdt:P625 ?coord }
      OPTIONAL { ?am wdt:P17  ?ctry .
                 OPTIONAL { ?ctry rdfs:label ?ctryLbl . FILTER(lang(?ctryLbl)="en") } }
    }
    GROUP BY ?am
    ORDER BY DESC(?n)`;
  const j = await sparql(QLEVER, q, `pivot:almaMaters(${uris.length})`);
  const items = j.results.bindings.map((b) => ({
    uri: b.am.value,
    label: b.label?.value || b.am.value.replace(/^.*\//, ''),
    image: b.image?.value || null,
    country: b.country?.value || null,
    coords: parsePoint(b.coord?.value),
    originCount: +(b.n?.value || 0),
  }));
  return new Bundle(items, 'org', `alma maters of ${bundle.label}`);
}

// ============================================================================
// Op registry — keyed on bead type. Each op is one chip on the frontier bead.
// Static ops produce a child bead immediately; picker ops open a sheet with
// dynamically-computed values (top-N by frequency from the parent bundle).
// Async ops show a "running…" hint while the network call is in flight.
// ============================================================================
const OPS = {
  human: [
    { id: 'sitting', label: 'sitting now', icon: '◉', kind: 'static',
      run: (b) => opFilters.sitting(b) },
    { id: 'bridged', label: 'has MP id',   icon: '🔗', kind: 'static',
      run: (b) => opFilters.bridged(b) },
    { id: 'party',   label: 'party…',      icon: '⚑', kind: 'picker',
      values: (b) => topCounts(b.items.flatMap((x) => x.parties)),
      run:    (b, v) => opFilters.party(b, v) },
    { id: 'decade',  label: 'decade…',     icon: '⌚', kind: 'picker',
      values: (b) => sortByKey(countBy(b.items, 'decade')),
      run:    (b, v) => opFilters.decade(b, v) },
    { id: 'enrich',  label: 'enrich (facts)', icon: '✨', kind: 'async',
      hint: 'fetch birthplace + coords + dates + alma maters + spouses + occupations',
      run: (b) => enrichHumans(b) },
    { id: 'pivot-bp',label: '→ birthplaces',    icon: '⌖',  kind: 'async',
      hint: 'walk P19 to a set of places',
      run: (b) => pivotBirthplaces(b) },
    { id: 'pivot-am',label: '→ alma maters',    icon: '🎓', kind: 'async',
      hint: 'walk P69 to a set of institutions',
      run: (b) => pivotAlmaMaters(b) },
  ],
  place: [
    { id: 'top-country', label: 'group by country', icon: '🌐', kind: 'static',
      run: (b) => groupBy(b, (x) => x.country, 'country') },
    { id: 'has-coord',   label: 'has coords', icon: '⌖', kind: 'static',
      run: (b) => new Bundle(b.items.filter((x) => x.coords), 'place', `${b.label} · located`) },
  ],
  org: [
    { id: 'has-coord',   label: 'has coords', icon: '⌖', kind: 'static',
      run: (b) => new Bundle(b.items.filter((x) => x.coords), 'org', `${b.label} · located`) },
  ],
};

// Generic group-by: emit a synthetic "group" bundle where each item is a
// pseudo-entity with a label + count. Type kept the same so the op
// palette is still applicable to the underlying type (a "by country"
// of places is still 'place'-flavoured for the next pivot).
function groupBy(bundle, keyFn, asLabel) {
  const groups = new Map();
  for (const x of bundle.items) {
    const k = keyFn(x);
    if (!k) continue;
    if (!groups.has(k)) groups.set(k, { uri: 'group:' + k, label: k, count: 0, image: null });
    groups.get(k).count++;
  }
  const items = [...groups.values()].sort((a, b) => b.count - a.count);
  return new Bundle(items, bundle.type, `${bundle.label} by ${asLabel}`);
}

function countBy(items, field) {
  const m = new Map();
  for (const x of items) { const v = x[field]; if (v) m.set(v, (m.get(v) || 0) + 1); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function sortByKey(pairs) { return [...pairs].sort((a, b) => a[0].localeCompare(b[0])); }
function topCounts(strs) {
  const m = new Map();
  for (const s of strs) m.set(s, (m.get(s) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 30);
}

// ============================================================================
// Starter gallery — kickoff sources. V1: just the post-1900 MPs seed.
// ============================================================================
const STARTERS = [
  {
    id: 'uk-mps-1900',
    label: 'UK MPs since 1900',
    sub: '6,917 Wikidata people · QLever',
    type: 'human',
    fetch: async () => {
      const j = await sparql(QLEVER, POST1900_MPS_QUERY, 'seed:uk-mps-1900');
      return parseMpRows(j.results.bindings);
    },
  },
];

// ============================================================================
// State — one ordered list of beads. Each bead carries the bundle it produced.
// ============================================================================
const state = {
  starter: null,         // STARTERS entry once chosen
  beads: [],             // [{ id, opLabel, opIcon, bundle }]  ordered
  view: 'spine',         // 'spine' | 'graph' | 'table' | 'tiles'
};
const listeners = new Set();
function publish() { for (const fn of listeners) fn(); }

let _ids = 0;
function pushBead(opLabel, opIcon, bundle) {
  state.beads.push({ id: 'b' + (++_ids), opLabel, opIcon, bundle });
  publish();
}
function truncateTo(idx) {
  state.beads.length = idx + 1;
  publish();
}

// ============================================================================
// Shared lazy-image observer (same trick as pivcab).
// ============================================================================
const tileIo = new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (en.isIntersecting) {
      const img = en.target, src = img.dataset.src;
      if (src && !img._loaded) {
        img._loaded = true; img.src = src;
        img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
        tileIo.unobserve(img);
      }
    }
  }
}, { rootMargin: '200px 0px' });

// ============================================================================
// <daisy-starter> — the empty-state kickoff gallery.
// ============================================================================
class DaisyStarter extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.shadowRoot.innerHTML = `
      <style>
        :host { display: block; padding: 24px 16px; }
        .lead { font-size: 14px; color: var(--ink-soft); margin: 0 0 14px; }
        .gallery { display: grid; gap: 12px;
                   grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        .card { background: var(--surface); border: 1px solid var(--rule-soft);
                border-radius: 12px; padding: 14px;
                box-shadow: var(--shadow); cursor: pointer;
                transition: transform 0.12s, box-shadow 0.12s; }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
        .title { font-weight: 700; font-size: 15px; color: var(--ink); }
        .sub { font-size: 12px; color: var(--ink-mute); margin-top: 4px; }
      </style>
      <p class="lead">Start a chain from…</p>
      <div class="gallery"></div>
    `;
    const gal = this.shadowRoot.querySelector('.gallery');
    for (const s of STARTERS) {
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = `<div class="title"></div><div class="sub"></div>`;
      c.querySelector('.title').textContent = s.label;
      c.querySelector('.sub').textContent = s.sub;
      c.addEventListener('click', () => {
        this.dispatchEvent(new CustomEvent('starter-pick', { detail: s, bubbles: true, composed: true }));
      });
      gal.appendChild(c);
    }
  }
}
customElements.define('daisy-starter', DaisyStarter);

// ============================================================================
// <daisy-bead> — one bead in the chain. Renders count, op verb, thumb strip,
// and (if this is the frontier) the contextual op chip row.
// ============================================================================
class DaisyBead extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }
  set bead(b)     { this._bead = b; this.render(); }
  set frontier(f) { this._frontier = f; this.render(); }
  set index(i)    { this._index = i; this.render(); }
  render() {
    const b = this._bead;
    if (!b) return;
    const front = !!this._frontier;
    const idx = this._index ?? 0;
    const thumbs = (b.bundle?.items || []).filter((x) => x.image).slice(0, 8);
    this.shadowRoot.innerHTML = `
      <style>
        :host { display: block; position: relative; }
        .card {
          background: var(--surface); border: 1px solid var(--rule-soft);
          border-radius: 14px; padding: 12px 14px;
          box-shadow: var(--shadow);
          position: relative;
        }
        :host([frontier]) .card {
          border-color: var(--accent);
          box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent),
                      var(--shadow-lift);
        }
        .head { display: flex; gap: 8px; align-items: baseline; }
        .idx { font-size: 11px; color: var(--ink-mute); width: 18px; flex: 0 0 18px;
               font-variant-numeric: tabular-nums; }
        .op { font-size: 12px; color: var(--ink-mute); }
        .verb { color: var(--accent); font-weight: 600; }
        .title { font-weight: 700; font-size: 15px; color: var(--ink);
                 overflow: hidden; text-overflow: ellipsis; }
        .count { margin-left: auto; font-variant-numeric: tabular-nums;
                 font-size: 13px; color: var(--ink-soft); font-weight: 600; }
        .strip { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
        .strip img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px;
                     background: var(--surface-2); opacity: 0;
                     transition: opacity 0.4s; }
        .strip img.loaded { opacity: 1; }
        .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
        .chip {
          background: var(--surface-2); color: var(--ink);
          border: 1px solid var(--rule-soft);
          border-radius: 999px; padding: 6px 12px;
          font: 13px/1 -apple-system, system-ui, sans-serif;
          cursor: pointer; user-select: none;
          transition: background 0.12s, border-color 0.12s;
        }
        .chip:hover, .chip:focus {
          background: color-mix(in oklab, var(--accent) 12%, var(--surface-2));
          border-color: var(--accent); outline: none;
        }
        .chip .ic { font-size: 12px; margin-right: 4px; }
        .meta { font-size: 12px; color: var(--ink-mute); margin-top: 6px;
                display: flex; gap: 8px; flex-wrap: wrap; }
        .hist-hint {
          font-size: 11px; color: var(--ink-mute); margin-top: 8px;
          cursor: pointer;
        }
        .hist-hint:hover { color: var(--ink-soft); }
        .grow {
          margin-top: 10px; padding: 8px 0 0;
          border-top: 1px dashed var(--rule-soft);
          font-size: 12px; color: var(--ink-mute);
        }
      </style>
      <div class="card">
        <div class="head">
          <span class="idx"></span>
          <span class="op"><span class="ic"></span> <span class="verb"></span></span>
          <span class="title"></span>
          <span class="count"></span>
        </div>
        <div class="strip"></div>
        <div class="meta"></div>
        ${front ? `<div class="grow">tap a chip to grow the chain</div><div class="chips"></div>`
                : `<div class="hist-hint">↺ tap to undo back to here</div>`}
      </div>
    `;
    if (front) this.setAttribute('frontier', ''); else this.removeAttribute('frontier');
    this.shadowRoot.querySelector('.idx').textContent = `${idx + 1}.`;
    this.shadowRoot.querySelector('.ic').textContent = b.opIcon || '';
    this.shadowRoot.querySelector('.verb').textContent = b.opLabel || '';
    this.shadowRoot.querySelector('.title').textContent = b.bundle?.label || '';
    this.shadowRoot.querySelector('.count').textContent = (b.bundle?.size ?? 0).toLocaleString();

    // Thumb strip
    const strip = this.shadowRoot.querySelector('.strip');
    for (const p of thumbs) {
      const img = document.createElement('img');
      img.alt = ''; img.dataset.src = commonsThumb(p.image, 96);
      strip.appendChild(img);
      tileIo.observe(img);
    }

    // Meta line — what we surface depends on the bead type and whether
    // the per-item multigraph has been enriched.
    const meta = this.shadowRoot.querySelector('.meta');
    meta.innerHTML = '';
    if (b.bundle?.items?.length) {
      const items = b.bundle.items;
      const bits = [];
      if (b.bundle.type === 'human') {
        const sitting = items.filter((x) => x.sitting).length;
        const topParty = topCounts(items.flatMap((x) => x.parties)).slice(0, 1)[0];
        const topDec   = countBy(items, 'decade').slice(0, 1)[0];
        if (sitting > 0) bits.push(`sitting: ${sitting}`);
        if (topParty)    bits.push(`top party: ${topParty[0]} (${topParty[1]})`);
        if (topDec)      bits.push(`peak: ${topDec[0]} (${topDec[1]})`);
        // Enrichment summary — only present if the bundle has been through ✨ enrich.
        const enriched = items.filter((x) => x.extra);
        if (enriched.length) {
          const withBp = enriched.filter((x) => x.extra.birthplace).length;
          const withCoord = enriched.filter((x) => x.extra.birthplace?.coords).length;
          const topBp = topCounts(enriched.map((x) => x.extra.birthplace?.label).filter(Boolean)).slice(0, 1)[0];
          const topAm = topCounts(enriched.flatMap((x) => x.extra.almaMaters || [])).slice(0, 1)[0];
          const topOcc= topCounts(enriched.flatMap((x) => x.extra.occupations || [])).slice(0, 1)[0];
          bits.push(`✨ ${enriched.length} enriched`);
          if (withBp)  bits.push(`born known: ${withBp} (mapped: ${withCoord})`);
          if (topBp)   bits.push(`top birthplace: ${topBp[0]} (${topBp[1]})`);
          if (topAm)   bits.push(`top alma: ${topAm[0]} (${topAm[1]})`);
          if (topOcc)  bits.push(`top occ: ${topOcc[0]} (${topOcc[1]})`);
        }
      } else if (b.bundle.type === 'place' || b.bundle.type === 'org') {
        const withCoord = items.filter((x) => x.coords).length;
        const topCountry = topCounts(items.map((x) => x.country).filter(Boolean)).slice(0, 1)[0];
        const topOrigin = [...items].sort((a, b) => (b.originCount || 0) - (a.originCount || 0))[0];
        bits.push(`mapped: ${withCoord}`);
        if (topCountry) bits.push(`top country: ${topCountry[0]} (${topCountry[1]})`);
        if (topOrigin?.originCount) bits.push(`heaviest: ${topOrigin.label} (${topOrigin.originCount})`);
      }
      meta.textContent = bits.join('  ·  ');
    }

    if (front) {
      const chipRow = this.shadowRoot.querySelector('.chips');
      const ops = OPS[b.bundle?.type] || [];
      for (const op of ops) {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.innerHTML = `<span class="ic"></span><span class="lbl"></span>`;
        chip.querySelector('.ic').textContent = op.icon + ' ';
        chip.querySelector('.lbl').textContent = op.label;
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          this.dispatchEvent(new CustomEvent('op-tap', {
            detail: { op, bundle: b.bundle }, bubbles: true, composed: true,
          }));
        });
        chipRow.appendChild(chip);
      }
    } else {
      // Tapping an older bead truncates the chain back to it.
      this.shadowRoot.querySelector('.card').addEventListener('click', () => {
        this.dispatchEvent(new CustomEvent('bead-undo', {
          detail: { index: idx }, bubbles: true, composed: true,
        }));
      });
    }
  }
}
customElements.define('daisy-bead', DaisyBead);

// ============================================================================
// <daisy-picker> — sheet that opens for picker ops (party, decade, …).
// Renders top values with their counts; tap one to commit.
// ============================================================================
class DaisyPicker extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
  }
  open(op, bundle) {
    this._op = op; this._bundle = bundle;
    const values = op.values(bundle);
    this.shadowRoot.innerHTML = `
      <style>
        :host { position: fixed; inset: 0; z-index: 100;
                background: color-mix(in oklab, var(--ink) 50%, transparent);
                display: flex; align-items: flex-end; justify-content: center;
                animation: fade 0.18s ease-out; }
        @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
        @keyframes slide { from { transform: translateY(20px) } to { transform: translateY(0) } }
        .sheet {
          width: 100%; max-width: 560px;
          background: var(--surface); color: var(--ink);
          border-radius: 14px 14px 0 0;
          padding: 14px; max-height: 75vh; overflow-y: auto;
          box-shadow: 0 -8px 20px rgba(0,0,0,0.15);
          animation: slide 0.22s ease-out;
        }
        .h { display: flex; align-items: baseline; gap: 8px;
             padding-bottom: 8px; border-bottom: 1px solid var(--rule-soft); }
        .title { font-weight: 700; font-size: 15px; }
        .close { margin-left: auto; background: none; border: 0; color: var(--ink-mute);
                 font-size: 18px; cursor: pointer; padding: 4px 8px; }
        .list { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
        .row {
          display: flex; align-items: baseline; gap: 8px;
          padding: 10px 8px; border-radius: 8px; cursor: pointer;
          font-size: 14px;
        }
        .row:hover, .row:focus {
          background: color-mix(in oklab, var(--accent) 12%, transparent);
        }
        .val { color: var(--ink); }
        .ct { margin-left: auto; color: var(--ink-mute);
              font-variant-numeric: tabular-nums; font-size: 12px; }
      </style>
      <div class="sheet">
        <div class="h">
          <span class="title"></span>
          <button class="close" aria-label="close">×</button>
        </div>
        <div class="list"></div>
      </div>
    `;
    this.shadowRoot.querySelector('.title').textContent = `${op.icon} ${op.label}`;
    this.shadowRoot.querySelector('.close').addEventListener('click', () => this.remove());
    this.addEventListener('click', (e) => { if (e.target === this) this.remove(); });
    const list = this.shadowRoot.querySelector('.list');
    for (const [val, ct] of values) {
      const r = document.createElement('button');
      r.className = 'row';
      r.innerHTML = `<span class="val"></span><span class="ct"></span>`;
      r.querySelector('.val').textContent = val;
      r.querySelector('.ct').textContent = ct.toLocaleString();
      r.addEventListener('click', () => {
        this.dispatchEvent(new CustomEvent('pick', {
          detail: { op, value: val }, bubbles: true, composed: true,
        }));
        this.remove();
      });
      list.appendChild(r);
    }
    document.body.appendChild(this);
  }
}
customElements.define('daisy-picker', DaisyPicker);

// ============================================================================
// <daisy-app> — orchestration. Hosts the spine, listens for ops, runs them.
// ============================================================================
class DaisyApp extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.shadowRoot.innerHTML = `
      <style>

        #view-root { padding: 8px 0 0; }
        .empty { padding: 28px 4px; }
        .foot { font-size: 11px; color: var(--ink-mute);
                padding: 32px 4px 0; line-height: 1.55; }

        .bead-wrap { padding: 8px 0 8px 36px; position: relative; }

        .gnode {

          box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent),
                      var(--shadow-lift); }
        .gnode .kind {
          font: 10px/1 ui-monospace, Menlo, monospace;
          background: var(--accent); color: var(--accent-on);

        table.beads { width: 100%; border-collapse: collapse;
                      font-size: 13px; color: var(--ink); }
        table.beads th, table.beads td {
          text-align: left; padding: 8px 10px;
          border-bottom: 1px solid var(--rule-soft);
        }
        table.beads th { background: var(--surface-2); color: var(--ink-soft);
                         font-size: 11px; text-transform: uppercase;
                         letter-spacing: 0.04em; }

                             text-align: right; font-weight: 600; }
        table.beads tr { cursor: pointer; }
        table.beads tr:hover td {

        }

        /* map view: equirectangular projection over auto-fit bbox */
        .map-wrap { background: var(--surface); border: 1px solid var(--rule-soft);

        .map-svg circle { fill: var(--accent); fill-opacity: 0.7;
                          stroke: var(--surface); stroke-width: 1; cursor: pointer; }
        .map-svg circle:hover { fill: var(--good); fill-opacity: 0.95; }
        .map-svg .label { font: 11px ui-monospace, Menlo, monospace; fill: var(--ink); }

        /* tiles view: full grid of the frontier bead */
        .tiles-head { font-size: 13px; color: var(--ink-soft);
                      padding: 4px 4px 10px; display: flex; gap: 8px; align-items: baseline; }
        .tiles-head .n { font-weight: 700; color: var(--ink); }
        .tiles {
          display: grid; gap: 8px;
          grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        }
        .tile {
          background: var(--surface); border: 1px solid var(--rule-soft);
          border-radius: 8px; overflow: hidden; box-shadow: var(--shadow);
        }
        .tile .th { aspect-ratio: 1/1; background: var(--surface-2); }
        .tile .th img { width: 100%; aspect-ratio: 1/1; object-fit: cover;
                        display: block; opacity: 0; transition: opacity 0.35s; }
        .tile .th img.loaded { opacity: 1; }
        .tile .body { padding: 6px 8px 8px; }
        .tile .nm { font-size: 12px; color: var(--ink); line-height: 1.3;
                    display: -webkit-box; -webkit-line-clamp: 2;
                    -webkit-box-orient: vertical; overflow: hidden; }
        .tile .mt { font-size: 10px; color: var(--ink-mute); margin-top: 2px;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      </style>
      <header>
        <h1>daisychain</h1>
        <span class="crumb">· <a href="/kgx/">kgx</a></span>
        <div class="actions">
          <div class="seg" role="tablist" aria-label="view">
            <button id="v-spine" data-v="spine" class="on" title="vertical bead spine">spine</button>
            <button id="v-graph" data-v="graph" title="DAG of the chain">graph</button>
            <button id="v-table" data-v="table" title="bead table">table</button>
            <button id="v-tiles" data-v="tiles" title="full tile grid of the frontier bead">tiles</button>
            <button id="v-map"   data-v="map"   title="map of the frontier bead (when coords are known)">map</button>
          </div>
          <button id="reset-btn" title="start over">↺ reset</button>
        </div>
      </header>
      <p class="lead" id="lead">
        A chain of beads. Each bead is a typed set; each chip on the frontier
        bead grows the chain. Four views of the same chain: spine, graph,
        table, tiles.
      </p>
      <div id="view-root"></div>
      <div class="foot">
        Contains Parliamentary information licensed under the
        <a href="https://www.parliament.uk/site-information/copyright-parliament/open-parliament-licence/"
           target="_blank" rel="noopener">Open Parliament Licence v3.0</a>.
        Wikidata content via QLever, CC0.
      </div>
    `;
    this.addEventListener('starter-pick', (e) => this._kickoff(e.detail));
    this.addEventListener('op-tap',       (e) => this._onOp(e.detail));
    this.addEventListener('bead-undo',    (e) => this._undoTo(e.detail.index));
    this.shadowRoot.querySelector('#reset-btn').addEventListener('click', () => this._reset());
    for (const btn of this.shadowRoot.querySelectorAll('.seg button')) {
      btn.addEventListener('click', () => { state.view = btn.dataset.v; publish(); });
    }
    listeners.add(() => this._render());
    this._render();
  }

  async _kickoff(starter) {
    state.starter = starter;
    const lead = this.shadowRoot.querySelector('#lead');
    lead.textContent = `loading ${starter.label} …`;
    try {
      const items = await starter.fetch();
      const bundle = new Bundle(items, starter.type, starter.label);
      pushBead('source', '●', bundle);
      const sitting = items.filter((x) => x.sitting).length;
      const bridged = items.filter((x) => x.mpid).length;
      lead.innerHTML = `<b>${items.length.toLocaleString()}</b> ${starter.type}s loaded · `
        + `<b>${sitting.toLocaleString()}</b> sitting now · `
        + `<b>${bridged.toLocaleString()}</b> bridged to the Members API. `
        + `Tap a chip on the bottom bead to grow the chain.`;
    } catch (err) {
      this.shadowRoot.querySelector('#view-root').innerHTML =
        `<div class="err">load failed: ${err.message}</div>`;
    }
  }

  async _onOp({ op, bundle }) {
    if (op.kind === 'static') {
      const out = op.run(bundle);
      pushBead(op.label, op.icon, out);
      return;
    }
    if (op.kind === 'async') {
      const lead = this.shadowRoot.querySelector('#lead');
      const prev = lead.innerHTML;
      lead.textContent = `${op.icon} ${op.label} — running over ${bundle.size.toLocaleString()} ${bundle.type}s…`;
      try {
        const out = await op.run(bundle);
        pushBead(op.label, op.icon, out);
        lead.innerHTML = prev;
      } catch (err) {
        lead.innerHTML = `<span style="color:#c33">${escapeHTML(op.label)} failed: ${escapeHTML(err.message)}</span>`;
      }
      return;
    }
    // picker
    const sheet = document.createElement('daisy-picker');
    sheet.addEventListener('pick', (e) => {
      const out = e.detail.op.run(bundle, e.detail.value);
      pushBead(`${e.detail.op.label.replace(/…$/, '')}: ${e.detail.value}`, e.detail.op.icon, out);
    });
    sheet.open(op, bundle);
  }

  _undoTo(idx) { truncateTo(idx); }

  _reset() {
    state.starter = null;
    state.beads = [];
    publish();
    this.shadowRoot.querySelector('#lead').textContent =
      'A chain of beads. Tap a starter to begin.';
  }

  _render() {
    // Sync the view-segment buttons to current state.
    for (const btn of this.shadowRoot.querySelectorAll('.seg button')) {
      btn.classList.toggle('on', btn.dataset.v === state.view);
    }
    const root = this.shadowRoot.querySelector('#view-root');
    root.innerHTML = '';
    if (!state.beads.length) {
      const starter = document.createElement('daisy-starter');
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.appendChild(starter);
      root.appendChild(empty);
      return;
    }
    // Map view button greys out unless the frontier has any item with coords.
    const front = state.beads[state.beads.length - 1];
    const hasCoords = !!front?.bundle?.items?.some((x) => x.coords || x.extra?.birthplace?.coords);
    const mapBtn = this.shadowRoot.querySelector('#v-map');
    mapBtn.disabled = !hasCoords;
    mapBtn.style.opacity = hasCoords ? '1' : '0.45';
    mapBtn.title = hasCoords
      ? 'map the frontier bead'
      : 'enrich (✨) the bead or pivot to places to populate this view';
    switch (state.view) {
      case 'graph':  this._renderGraph(root); break;
      case 'table':  this._renderTable(root); break;
      case 'tiles':  this._renderTiles(root); break;
      case 'map':    this._renderMap(root);   break;
      case 'spine':
      default:       this._renderSpine(root); break;
    }
  }

  _renderSpine(root) {
    const spine = document.createElement('div');
    spine.className = 'spine';
    const last = state.beads.length - 1;
    for (let i = 0; i <= last; i++) {
      const wrap = document.createElement('div');
      wrap.className = 'bead-wrap';
      if (i === last) wrap.setAttribute('frontier', '');
      const bead = document.createElement('daisy-bead');
      bead.bead = state.beads[i];
      bead.index = i;
      bead.frontier = (i === last);
      wrap.appendChild(bead);
      spine.appendChild(wrap);
    }
    root.appendChild(spine);
    requestAnimationFrame(() => {
      const last = spine.querySelector('.bead-wrap[frontier]');
      if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  }

  _renderGraph(root) {
    // Horizontal DAG of the linear chain — same data as the spine,
    // laid out left-to-right with curved SVG edges between cards.
    const wrap = document.createElement('div');
    wrap.className = 'graph-wrap';
    const g = document.createElement('div');
    g.className = 'graph';
    const last = state.beads.length - 1;
    for (let i = 0; i <= last; i++) {
      const b = state.beads[i];
      const card = document.createElement('div');
      card.className = 'gnode' + (i === last ? ' frontier' : '');
      const thumbs = (b.bundle?.items || []).filter((x) => x.image).slice(0, 6);
      const stripHTML = thumbs.map((p) =>
        `<img alt="" data-src="${commonsThumb(p.image, 56)}">`).join('');
      card.innerHTML = `
        <span class="kind">${i === 0 ? 'source' : (last && i === last ? 'frontier' : 'step')}</span>
        <div class="title"></div>
        <div class="cnt"></div>
        <div class="strip">${stripHTML}</div>
        <div style="font-size:11px;color:var(--ink-mute);">${b.opIcon || ''} ${b.opLabel || ''}</div>
      `;
      card.querySelector('.title').textContent = b.bundle?.label || '';
      card.querySelector('.cnt').textContent = (b.bundle?.size ?? 0).toLocaleString();
      card.addEventListener('click', () => {
        if (i === last) return;
        // Same back-gesture as spine: tap an older node to truncate.
        this._undoTo(i);
      });
      for (const img of card.querySelectorAll('img[data-src]')) tileIo.observe(img);
      g.appendChild(card);
    }
    // SVG overlay for edges
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('gedges');
    svg.innerHTML = `
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--spine)"/>
        </marker>
      </defs>
      <g class="paths"></g>
    `;
    wrap.appendChild(g);
    wrap.appendChild(svg);
    root.appendChild(wrap);
    requestAnimationFrame(() => this._drawGraphEdges(wrap, g, svg));
  }

  _drawGraphEdges(wrap, g, svg) {
    const cards = g.querySelectorAll('.gnode');
    const wrapBox = wrap.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${wrap.scrollWidth} ${wrap.clientHeight}`);
    svg.setAttribute('width', wrap.scrollWidth);
    svg.setAttribute('height', wrap.clientHeight);
    svg.style.width = wrap.scrollWidth + 'px';
    svg.style.height = wrap.clientHeight + 'px';
    const paths = svg.querySelector('.paths');
    paths.innerHTML = '';
    for (let i = 0; i < cards.length - 1; i++) {
      const a = cards[i].getBoundingClientRect();
      const b = cards[i + 1].getBoundingClientRect();
      const x1 = a.right - wrapBox.left + wrap.scrollLeft;
      const y1 = a.top   - wrapBox.top + a.height / 2;
      const x2 = b.left  - wrapBox.left + wrap.scrollLeft;
      const y2 = b.top   - wrapBox.top + b.height / 2;
      const dx = Math.max(20, (x2 - x1) / 2);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2 - 4} ${y2}`);
      paths.appendChild(path);
    }
    // Scroll to frontier
    const front = g.querySelector('.gnode.frontier');
    if (front) front.scrollIntoView({ behavior: 'smooth', inline: 'end', block: 'nearest' });
  }

  _renderTable(root) {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    const last = state.beads.length - 1;
    const rows = state.beads.map((b, i) => {
      const sitting = b.bundle?.items?.filter((x) => x.sitting).length || 0;
      const bridged = b.bundle?.items?.filter((x) => x.mpid).length || 0;
      return `
        <tr data-i="${i}" class="${i === last ? 'frontier' : ''}">
          <td>${i + 1}</td>
          <td>${b.opIcon || ''} ${b.opLabel || ''}</td>
          <td>${escapeHTML(b.bundle?.label || '')}</td>
          <td class="cnt">${(b.bundle?.size ?? 0).toLocaleString()}</td>
          <td class="cnt">${sitting.toLocaleString()}</td>
          <td class="cnt">${bridged.toLocaleString()}</td>
        </tr>
      `;
    }).join('');
    wrap.innerHTML = `
      <table class="beads">
        <thead><tr>
          <th>#</th><th>op</th><th>set</th><th>n</th><th>sitting</th><th>w/ MP id</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
    for (const tr of wrap.querySelectorAll('tbody tr')) {
      tr.addEventListener('click', () => {
        const idx = +tr.dataset.i;
        if (idx !== last) this._undoTo(idx);
      });
    }
    root.appendChild(wrap);
  }

  _renderMap(root) {
    // Collect points from the frontier bundle. Places carry coords directly;
    // enriched humans carry them under .extra.birthplace.coords.
    const last = state.beads[state.beads.length - 1];
    if (!last?.bundle) return;
    const points = [];
    for (const x of last.bundle.items) {
      const c = x.coords || x.extra?.birthplace?.coords;
      if (!c) continue;
      const lbl = x.label || x.extra?.birthplace?.label || '';
      const wt  = x.originCount || 1;  // place: how many MPs map here
      points.push({ ...c, label: lbl, weight: wt, uri: x.uri });
    }
    const wrap = document.createElement('div');
    wrap.className = 'map-wrap';
    if (!points.length) {
      wrap.innerHTML = `<div style="padding:16px;color:var(--ink-mute);font-size:13px;">
        No coords on the frontier bead yet — try ✨ enrich (on a human bead)
        or → birthplaces.</div>`;
      root.appendChild(wrap);
      return;
    }
    // Auto-fit bbox with padding.
    let minLat = +Infinity, maxLat = -Infinity, minLon = +Infinity, maxLon = -Infinity;
    for (const p of points) {
      if (p.lat < minLat) minLat = p.lat; if (p.lat > maxLat) maxLat = p.lat;
      if (p.lon < minLon) minLon = p.lon; if (p.lon > maxLon) maxLon = p.lon;
    }
    const padLat = Math.max(0.5, (maxLat - minLat) * 0.08);
    const padLon = Math.max(0.5, (maxLon - minLon) * 0.08);
    minLat -= padLat; maxLat += padLat;
    minLon -= padLon; maxLon += padLon;
    const W = 1200, H = 600;
    const proj = (lat, lon) => ({
      x: ((lon - minLon) / (maxLon - minLon)) * W,
      y: ((maxLat - lat) / (maxLat - minLat)) * H,
    });
    const maxWt = points.reduce((m, p) => Math.max(m, p.weight), 1);
    const radius = (w) => 3 + Math.sqrt(w / maxWt) * 14;
    // Cluster identical (lat,lon) so coincident pins stack visibly.
    const byKey = new Map();
    for (const p of points) {
      const k = `${p.lat.toFixed(3)}_${p.lon.toFixed(3)}`;
      if (!byKey.has(k)) byKey.set(k, { ...p, weight: 0, members: [] });
      const g = byKey.get(k); g.weight += p.weight; g.members.push(p);
    }
    const dots = [...byKey.values()].sort((a, b) => b.weight - a.weight).map((p) => {
      const { x, y } = proj(p.lat, p.lon);
      const r = radius(p.weight);
      const title = `${p.members.length === 1 ? p.label : `${p.label} (+${p.members.length - 1} co-located)`} — ${p.weight}`;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"><title>${escapeHTML(title)}</title></circle>`;
    }).join('');
    wrap.innerHTML = `
      <div class="map-head">
        <span class="n">${points.length.toLocaleString()}</span>
        <span>points · bbox ${minLat.toFixed(1)}…${maxLat.toFixed(1)} N, ${minLon.toFixed(1)}…${maxLon.toFixed(1)} E</span>
      </div>
      <svg class="map-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${dots}
      </svg>
    `;
    root.appendChild(wrap);
  }

  _renderTiles(root) {
    // The frontier bundle, full grid. Older beads accessible via the
    // table / spine; this view is about the live result.
    const last = state.beads[state.beads.length - 1];
    if (!last?.bundle) return;
    const head = document.createElement('div');
    head.className = 'tiles-head';
    head.innerHTML = `
      <span class="n">${last.bundle.size.toLocaleString()}</span>
      <span>${escapeHTML(last.bundle.label)}</span>
    `;
    root.appendChild(head);
    const grid = document.createElement('div');
    grid.className = 'tiles';
    const slice = last.bundle.items.slice(0, 3000);
    const isHuman = last.bundle.type === 'human';
    const html = new Array(slice.length);
    for (let i = 0; i < slice.length; i++) {
      const p = slice[i];
      let mt = '';
      if (isHuman) {
        const years = p.sitting && p.firstYr ? `${p.firstYr}–`
                    : p.firstYr && p.lastYr   ? (p.firstYr === p.lastYr ? `${p.firstYr}` : `${p.firstYr}–${p.lastYr}`)
                    : p.lastYr                 ? `${p.lastYr}` : (p.firstYr ? `${p.firstYr}–` : '');
        mt = [years, p.parties?.[0] || ''].filter(Boolean).join(' · ');
      } else {
        // place / org / group: show originCount and country if present.
        const ct = p.originCount ? `${p.originCount}` : (p.count ? `${p.count}` : '');
        mt = [ct, p.country || ''].filter(Boolean).join(' · ');
      }
      html[i] = `<div class="tile">`
        + `<div class="th">${p.image ? `<img alt="" data-src="${commonsThumb(p.image, 220)}">` : ''}</div>`
        + `<div class="body"><div class="nm">${escapeHTML(p.label)}</div>`
        + (mt ? `<div class="mt">${escapeHTML(mt)}</div>` : '')
        + `</div></div>`;
    }
    grid.innerHTML = html.join('');
    for (const img of grid.querySelectorAll('img[data-src]')) tileIo.observe(img);
    root.appendChild(grid);
  }
}
function escapeHTML(s) {
  return String(s ?? '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}
customElements.define('daisy-app', DaisyApp);
</script>

</body>
</html>
