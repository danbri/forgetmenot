<script type="module">
// ============================================================================
// /kgx/daisychain/ — bead-spine interaction over the same Bundle / Bloom
// engine as /kgx/pivcab/. One linear chain of [data] · op · [data] · op · …
// beads scrolling top-to-bottom. The contextual op chip row on the frontier
// bead is the only place the user makes decisions; older beads are history.
// Tapping an earlier bead truncates the chain back to that point (an "undo
// from here"). Forks (V2) would let two chains share the prefix.
// ============================================================================

const QLEVER = 'https://qlever.dev/api/wikidata';
// Substrate (Bloom, Bundle, helpers) lifted to /kgx/lib/node-flow.mjs.
// pivcab imports the same module — single source of truth.
// ============================================================================
import {
  Bloom, Bundle,
  httpsify, commonsThumb, parsePoint, escapeHTML, valuesQids,
} from '/kgx/lib/node-flow.mjs';
import { REL_TEMPLATES, valuesMnisPersons } from '/kgx/lib/rel-templates.mjs';
import {
  opFilters, nameGender,
  countBy, sortByKey, topCounts,
} from '/kgx/lib/restrict.mjs';
import {
  STARTERS as LIB_STARTERS,
  POST1900_MPS_QUERY, parseMpRows, SEED_LIMIT,
} from '/kgx/lib/starters.mjs';
import { LIBRARY } from '/kgx/lib/library.mjs';
import { AUGMENT_OPS } from '/kgx/lib/augment.mjs';

// The shared Bundle also exposes static union / intersect / difference
// (previously only used by pivcab) — daisychain now has them too at no
// extra cost, ready when a future op wants them.

// ============================================================================
// Net helper.
// ============================================================================
// ============================================================================
// Engines — pluggable SPARQL execution. All queries (seed, enrich, pivot)
// route through `engine.query()` so the engine can later be swapped between
// HTTP (today: QLever, FPKG, Wikidata) and in-page Oxigraph wasm without
// touching the op code. Beads record which engine produced each named graph.
// ============================================================================
class SparqlEngine {
  constructor({ id, endpoint, label, kind = 'remote' }) {
    this.id = id; this.endpoint = endpoint; this.label = label; this.kind = kind;
  }
  async query(query, queryLabel = 'sparql') {
    if (this.kind !== 'remote') {
      throw new Error(`engine ${this.id}: kind=${this.kind} not implemented`);
    }
    // `new URL(relative)` throws — pass the page origin as the base so
    // engines that point at this server's own paths (`/kgx/query`,
    // `/api/sparql`) resolve. Absolute URLs (qlever.dev, …) ignore the
    // second arg, so this is safe for every engine in ENGINES.
    const endpointUrl = new URL(this.endpoint, window.location.origin).toString();
    const t0 = performance.now();
    // GET fits in URL line; POST when the query is large enough to risk
    // Cloudflare / server URL caps (~8 KB; URL-encoding inflates by ~1.5×,
    // so 2 KB raw is the safe-ish threshold). Same shape as bin/kgx.mjs.
    let r;
    if (query.length > 2048) {
      r = await fetch(endpointUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/sparql-query',
          'Accept': 'application/sparql-results+json',
        },
        body: query,
      });
    } else {
      const u = new URL(endpointUrl);
      u.searchParams.set('query', query);
      r = await fetch(u.toString(), {
        headers: { 'Accept': 'application/sparql-results+json' },
      });
    }
    if (!r.ok) throw new Error(`${queryLabel}: HTTP ${r.status}`);
    const json = await r.json();
    const ms = Math.round(performance.now() - t0);
    console.log('[sparql]', this.id, queryLabel, { ms, rows: json.results.bindings.length });
    return { json, query, endpoint: this.endpoint, engineId: this.id, ms, label: queryLabel };
  }
}

const ENGINES = {
  'qlever-wikidata': new SparqlEngine({
    id: 'qlever-wikidata', endpoint: QLEVER, label: 'QLever ⇒ Wikidata' }),
  'fpkg': new SparqlEngine({
    id: 'fpkg', endpoint: '/kgx/query', label: 'FPKG (Oxigraph, server-side)' }),
  // The official UK Parliament SPARQL (the DDP store). Routed through our
  // proxy at /api/sparql per CLAUDE.md rule 3 — gives caching, TTL, and
  // the OPL attribution header even though the upstream already sends CORS.
  'parl-sparql': new SparqlEngine({
    id: 'parl-sparql', endpoint: '/api/sparql', label: 'UK Parliament SPARQL (DDP)' }),
  // Slot for V2: an in-page Oxigraph wasm engine that operates over each
  // bead's union dataset. Today's ops don't use it, but the API is here.
  // 'oxigraph-wasm': new SparqlEngine({ id: 'oxigraph-wasm', kind: 'wasm', label: 'Oxigraph (in-page wasm)' }),
};
function engine(id) {
  const e = ENGINES[id];
  if (!e) throw new Error('unknown engine: ' + id);
  return e;
}

async function sparql(endpoint, query, label = 'sparql') {
  // Back-compat shim: most call sites still pass an endpoint URL.
  // Look up the matching engine, or fall back to ad-hoc remote.
  for (const e of Object.values(ENGINES)) {
    if (e.endpoint === endpoint) return e.query(query, label);
  }
  const adhoc = new SparqlEngine({ id: 'adhoc', endpoint, label: endpoint });
  return adhoc.query(query, label);
}

// ============================================================================
// Parameterised-query helper — api.parliament.uk/query/ via the local proxy.
//
// PQ is the canonical catalogue of pre-canned SPARQL templates over the DDP
// store (same graph the `parl-sparql` engine queries directly). Returns
// JSON-LD with `@context` + `@graph`; we treat the `@graph` array as the
// row bindings. Not a SparqlEngine — the call doesn't take a SPARQL string,
// just a template name + params.
// ============================================================================
async function pqFetch(template, params = {}, label = 'pq') {
  const u = new URL('/api/query/' + template, window.location.origin);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const t0 = performance.now();
  const r = await fetch(u.toString(), { headers: { 'Accept': 'application/json' } });
  if (!r.ok) throw new Error(`${label}: HTTP ${r.status}`);
  const json = await r.json();
  const ms = Math.round(performance.now() - t0);
  const rows = Array.isArray(json['@graph']) ? json['@graph'] : [];
  console.log('[pq]', label, { ms, rows: rows.length });
  return { json, rows, query: u.toString(), endpoint: '/api/query/', engineId: 'parl-query', ms, label };
}

// Provenance: a Source is one fetched/computed contribution to a bead. Each
// gets a synthesised named-graph IRI so the bead is — formally — a SPARQL
// dataset whose contents come from the union of its source graphs. The
// items[] facade the UI consumes is one projection of that dataset.
let _ngSeq = 0;
function newNG(kind) {
  _ngSeq++;
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  return `urn:fmn:bead/${ts}/${_ngSeq}/${kind}`;
}
function makeSource({ kind, endpoint = null, engineId = null, query = null, ms = 0, bindings = [], note = null, relTemplate = null, variant = null, namedGraphs = [] }) {
  return {
    ng: newNG(kind),
    kind,                  // 'seed' | 'enrich' | 'rel:children:sons' | …
    endpoint,              // null for client-side ops
    engineId,              // which engine ran this (null for client-side)
    query,                 // SPARQL text, or null
    ms,
    rowCount: bindings.length,
    bindings,              // kept verbatim so we can render TriG without refetching
    ts: Date.now(),
    note,
    // Relation-template provenance (set when this Source came from a
    // RelationTemplate variant — see REL_TEMPLATES below). Makes the chain
    // legible in the design's vocabulary: "via template 'children', variant
    // 'sons', engine 'qlever-wikidata', named graph: ∅".
    relTemplate,           // e.g. 'children' | 'appg_officer'
    variant,               // e.g. 'default' | 'sons' | 'broaden:family'
    namedGraphs,           // explicit GRAPH IRIs queried (FPKG NGs etc.)
  };
}

// httpsify, commonsThumb → /kgx/lib/node-flow.mjs (imported at top).

// ============================================================================
// Parse + filter ops (same shape as pivcab — same engine).
// ============================================================================


// ============================================================================
// Enrich + pivot — every item is its own mini-graph (`item.extra`). Enrich
// grows the per-item graph in place; pivot walks one of the edges and
// produces a new bundle of a new entity type.
// ============================================================================
const ENRICH_MAX = 500;  // soft cap: bundles bigger than this won't enrich

// parsePoint → /kgx/lib/node-flow.mjs (imported at top).

function valuesClause(uris) {
  // Turn ["http://www.wikidata.org/entity/Q1", ...] into "wd:Q1 wd:Q2 …"
  return uris
    .map((u) => u.match(/Q\d+$/)?.[0])
    .filter(Boolean)
    .map((q) => `wd:${q}`)
    .join(' ');
}


// Pivot from a human bundle to the set of their birthplaces. Each output
// item is a `place` with its own coords / country / count-of-MPs-from-here.
async function pivotBirthplaces(bundle) {
  const uris = bundle.items.map((x) => x.uri);
  if (!uris.length) return new Bundle([], 'place', 'birthplaces');
  if (uris.length > ENRICH_MAX) {
    throw new Error(`bundle of ${uris.length} is too big to pivot (cap ${ENRICH_MAX}); narrow first.`);
  }
  const q = `
    PREFIX wd:   <http://www.wikidata.org/entity/>
    PREFIX wdt:  <http://www.wikidata.org/prop/direct/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?bp
      (SAMPLE(?bpLbl)   AS ?label)
      (SAMPLE(?bpCoord) AS ?coord)
      (SAMPLE(?img)     AS ?image)
      (SAMPLE(?ctryLbl) AS ?country)
      (COUNT(DISTINCT ?p) AS ?n)
    WHERE {
      VALUES ?p { ${valuesClause(uris)} }
      ?p wdt:P19 ?bp .
      OPTIONAL { ?bp rdfs:label ?bpLbl . FILTER(lang(?bpLbl)="en") }
      OPTIONAL { ?bp wdt:P625 ?bpCoord }
      OPTIONAL { ?bp wdt:P18  ?img }
      OPTIONAL { ?bp wdt:P17  ?ctry .
                 OPTIONAL { ?ctry rdfs:label ?ctryLbl . FILTER(lang(?ctryLbl)="en") } }
    }
    GROUP BY ?bp
    ORDER BY DESC(?n)`;
  const res = await sparql(QLEVER, q, `pivot:birthplaces(${uris.length})`);
  const items = res.json.results.bindings.map((b) => ({
    uri: b.bp.value,
    label: b.label?.value || b.bp.value.replace(/^.*\//, ''),
    image: b.image?.value || null,
    country: b.country?.value || null,
    coords: parsePoint(b.coord?.value),
    originCount: +(b.n?.value || 0),
  }));
  return {
    bundle: new Bundle(items, 'place', `birthplaces of ${bundle.label}`),
    source: makeSource({
      kind: 'pivot:P19', endpoint: res.endpoint, engineId: res.engineId, query: res.query, ms: res.ms,
      bindings: res.json.results.bindings,
      note: `walked P19 (place of birth) over ${uris.length} subjects`,
    }),
  };
}

// Pivot from a human bundle to their alma maters. Each item is an `org`.
async function pivotAlmaMaters(bundle) {
  const uris = bundle.items.map((x) => x.uri);
  if (!uris.length) return new Bundle([], 'org', 'alma maters');
  if (uris.length > ENRICH_MAX) {
    throw new Error(`bundle of ${uris.length} is too big to pivot (cap ${ENRICH_MAX}); narrow first.`);
  }
  const q = `
    PREFIX wd:   <http://www.wikidata.org/entity/>
    PREFIX wdt:  <http://www.wikidata.org/prop/direct/>
    PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
    SELECT ?am
      (SAMPLE(?amLbl)   AS ?label)
      (SAMPLE(?img)     AS ?image)
      (SAMPLE(?coord)   AS ?coord)
      (SAMPLE(?ctryLbl) AS ?country)
      (COUNT(DISTINCT ?p) AS ?n)
    WHERE {
      VALUES ?p { ${valuesClause(uris)} }
      ?p wdt:P69 ?am .
      OPTIONAL { ?am rdfs:label ?amLbl . FILTER(lang(?amLbl)="en") }
      OPTIONAL { ?am wdt:P18  ?img }
      OPTIONAL { ?am wdt:P625 ?coord }
      OPTIONAL { ?am wdt:P17  ?ctry .
                 OPTIONAL { ?ctry rdfs:label ?ctryLbl . FILTER(lang(?ctryLbl)="en") } }
    }
    GROUP BY ?am
    ORDER BY DESC(?n)`;
  const res = await sparql(QLEVER, q, `pivot:almaMaters(${uris.length})`);
  const items = res.json.results.bindings.map((b) => ({
    uri: b.am.value,
    label: b.label?.value || b.am.value.replace(/^.*\//, ''),
    image: b.image?.value || null,
    country: b.country?.value || null,
    coords: parsePoint(b.coord?.value),
    originCount: +(b.n?.value || 0),
  }));
  return {
    bundle: new Bundle(items, 'org', `alma maters of ${bundle.label}`),
    source: makeSource({
      kind: 'pivot:P69', endpoint: res.endpoint, engineId: res.engineId, query: res.query, ms: res.ms,
      bindings: res.json.results.bindings,
      note: `walked P69 (educated at) over ${uris.length} subjects`,
    }),
  };
}

// ============================================================================
// Relation Templates — the design's `relationTemplate` concept made concrete.
//
// A pivot is not a raw predicate. It is a semantic relation with a default
// implementation, optional `tighten` variants (narrower / stricter), and
// optional `broaden` variants (wider / weaker). The variant a user picks is
// recorded as provenance on the resulting bead, so the chain is legible as
// "via template `children`, variant `sons`" rather than as opaque SPARQL.
//
// Each template specifies:
//   - id, label, gloss           — UI identity
//   - inputType / outputType     — type signature; chip enabled only on a
//                                  bundle of inputType
//   - engineId                   — which engine in ENGINES runs the SPARQL
//   - requires (optional)        — predicate over a bundle; controls
//                                  whether the variant is reachable
//                                  ("appg_officer needs mpid; some seeds
//                                  don't carry it")
//   - variants: [
//       { id, kind: 'default'|'tighten'|'broaden',
//         label, gloss,
//         namedGraphs: [],       — explicit GRAPH IRIs (FPKG NGs etc.)
//         build(items) → SPARQL,
//         parse(bindings) → items, — optional output transformer
//       }, …
//     ]
//
// Output items follow the same shape conventions as the existing pivots:
//   { uri, label, image?, country?, coords?, originCount?,
//     extra?: { … per-template details … } }
// ============================================================================

async function applyRelation(template, variant, bundle) {
  if (!template) throw new Error('no template');
  if (!variant)  throw new Error('no variant');
  if (template.requires && !template.requires(bundle)) {
    throw new Error(`bundle does not satisfy requires() for "${template.id}"`);
  }
  const sparqlText = variant.build(bundle.items);
  const res = await engine(template.engineId).query(
    sparqlText, `rel:${template.id}:${variant.id}(${bundle.size})`
  );
  const rows = res.json.results.bindings;
  // Per-variant parse fn; otherwise pass bindings through a sensible default.
  const items = (variant.parse || ((rs) => rs.map((b) => {
    // Take the first URI column as subject, the first non-URI as label.
    const cols = Object.keys(b);
    const sCol = cols.find((c) => b[c]?.type === 'uri');
    return {
      uri: b[sCol]?.value || '',
      label: b.label?.value || (sCol && b[sCol].value.replace(/^.*\//, '')) || '',
      originCount: +(b.n?.value || 0),
      image: null, country: null, coords: null,
    };
  })))(rows);
  return {
    bundle: new Bundle(items, template.outputType,
                       `${template.label} (${variant.label}) of ${bundle.label}`),
    source: makeSource({
      kind: `rel:${template.id}:${variant.id}`,
      endpoint: res.endpoint, engineId: res.engineId,
      query: sparqlText, ms: res.ms, bindings: rows,
      relTemplate: template.id, variant: variant.id,
      namedGraphs: variant.namedGraphs || [],
      note: `${template.gloss} · variant=${variant.kind}:${variant.id}`,
    }),
  };
}



// ============================================================================
// Op registry — keyed on bead type. Each op is one chip on the frontier bead.
// Static ops produce a child bead immediately; picker ops open a sheet with
// dynamically-computed values (top-N by frequency from the parent bundle).
// Async ops show a "running…" hint while the network call is in flight.
// ============================================================================
const OPS = {
  human: [
    { id: 'sitting', label: 'sitting now', icon: '◉', kind: 'static',
      relevant: (b) => b.items.some((x) => x.sitting === true),
      run: (b) => opFilters.sitting(b) },
    { id: 'bridged', label: 'has MP id',   icon: '🔗', kind: 'static',
      relevant: (b) => b.items.some((x) => x.mpid),
      run: (b) => opFilters.bridged(b) },
    { id: 'party',   label: 'party…',      icon: '⚑', kind: 'picker',
      relevant: (b) => b.items.some((x) => x.parties && x.parties.length),
      values: (b) => topCounts(b.items.flatMap((x) => x.parties)),
      run:    (b, v) => opFilters.party(b, v) },
    { id: 'decade',  label: 'decade…',     icon: '⌚', kind: 'picker',
      relevant: (b) => b.items.some((x) => x.decade),
      values: (b) => sortByKey(countBy(b.items, 'decade')),
      run:    (b, v) => opFilters.decade(b, v) },
    { id: 'gender',  label: 'gender…',     icon: '⚧', kind: 'picker',
      // Picker rows: for each gender, an "exact P21" count and (when any items
      // have a null gender) a separate "+ heuristic from first name" count.
      // Heuristic is an explicit choice — never silently merged with exact.
      // Hide the chip on bundles where NO items have an explicit P21 value
      // (e.g. architects after a pivot) — the heuristic alone isn't worth
      // surfacing as a primary action when authoritative data is absent.
      relevant: (b) => b.items.some((x) => x.gender === 'female' || x.gender === 'male'),
      values: (b) => {
        const rows = [];
        const noGender = b.items.filter((x) => !x.gender);
        for (const g of ['female', 'male']) {
          const exact = b.items.filter((x) => x.gender === g).length;
          if (exact) rows.push([`${g} (exact P21)`, exact]);
          if (noGender.length) {
            const heu = noGender.filter((x) => nameGender(x.label) === g).length;
            if (heu) rows.push([`${g} (+ first-name heuristic)`, exact + heu]);
          }
        }
        return rows;
      },
      run: (b, v) => {
        // Back-compat: legacy library entries used plain 'female' / 'male'.
        const legacy = (v === 'female' || v === 'male');
        const m = legacy ? [null, v] : v.match(/^(female|male)\b/);
        const g = m?.[1];
        if (!g) return new Bundle([], b.type, `${b.label} · ${v}`);
        const useHeuristic = /heuristic/.test(v);
        const filtered = b.items.filter((x) =>
          x.gender === g ||
          (useHeuristic && !x.gender && nameGender(x.label) === g));
        const out = new Bundle(filtered, b.type, `${b.label} · ${v}`);
        // Stash a breakdown for the Source note (read by _onOp's picker branch).
        out._opNote = (() => {
          const ex  = b.items.filter((x) => x.gender === g).length;
          const heu = filtered.length - ex;
          return useHeuristic
            ? `gender=${g}; exact P21: ${ex} · first-name heuristic: ${heu} (ambiguous names — Alex, Sam, Chris, Pat, Jamie, Lee, Robin, Kim, Jo — explicitly excluded by the dictionary)`
            : `gender=${g}; exact P21 only: ${ex}`;
        })();
        return out;
      } },
    { id: 'citizenship', label: 'citizenship…', icon: '🌎', kind: 'picker',
      relevant: (b) => b.items.some((x) => x.citizenships && x.citizenships.length),
      values: (b) => topCounts(b.items.flatMap((x) => x.citizenships || [])),
      run:    (b, v) => new Bundle(
        b.items.filter((x) => (x.citizenships || []).includes(v)),
        b.type, `${b.label} · cit:${v}`) },
    { id: 'enrich',  label: 'enrich (Wikidata)', icon: '✨', kind: 'async',
      hint: 'Wikidata: birthplace + coords + dates + alma maters + spouses + occupations',
      run: (b) => runAugment('enrich', b) },
    { id: 'parl-enrich', label: 'enrich (Parliament)', icon: '🏛', kind: 'async',
      hint: 'UK Parliament SPARQL: current constituency + party via rdfs:seeAlso bridge',
      relevant: (b) => b.items.some((x) => /Q\d+$/.test(x.uri || '') && (x.sitting || x.mpid)),
      run: (b) => runAugment('parl-enrich', b) },
    { id: 'pivot-bp',label: '→ birthplaces',    icon: '⌖',  kind: 'async',
      hint: 'walk P19 to a set of places',
      relevant: (b) => b.items.some((x) => /Q\d+$/.test(x.uri || '')),
      run: (b) => pivotBirthplaces(b) },
    { id: 'pivot-am',label: '→ alma maters',    icon: '🎓', kind: 'async',
      hint: 'walk P69 to a set of institutions',
      relevant: (b) => b.items.some((x) => /Q\d+$/.test(x.uri || '')),
      run: (b) => pivotAlmaMaters(b) },
    { id: 'identity-bridge', label: 'bridge (cross-source)', icon: '🔗', kind: 'async',
      hint: 'FPKG identity-graph: resolve to DDP person / Wikidata QID / GOV.UK slug / scraped site, all via parl:memberId',
      relevant: (b) => b.items.some((x) => x.mpid),
      run: (b) => runAugment('identity-bridge', b) },
    { id: 'pivot', label: '→ pivot…', icon: '⇄', kind: 'rel-picker',
      hint: 'relation templates: tighten / broaden across Wikidata, Parliament DDP and FPKG NGs' },
  ],
  // Result types from non-Wikidata sources — minimal palettes so the chain
  // can continue (group, narrow). They show that the bead-type vocabulary
  // doesn't bottom out at human/place/org.
  constituency: [
    { id: 'has-origin', label: 'top-weighted', icon: '★', kind: 'static',
      run: (b) => new Bundle(
        [...b.items].sort((a, b2) => (b2.originCount || 0) - (a.originCount || 0)).slice(0, 50),
        'constituency', `${b.label} · top 50`) },
    // For constituency_current items (PQ-seeded), the embedded current MP's
    // party is on the item; offer a quick party narrow without a server hit.
    { id: 'by-mp-party', label: 'by current MP party…', icon: '⚑', kind: 'picker',
      values: (b) => topCounts(b.items.map((x) => x.currentMpParty).filter(Boolean)),
      run:    (b, v) => new Bundle(
        b.items.filter((x) => x.currentMpParty === v),

// Generic group-by: emit a synthetic "group" bundle where each item is a
// pseudo-entity with a label + count. Type kept the same so the op
// palette is still applicable to the underlying type (a "by country"
// of places is still 'place'-flavoured for the next pivot).
function groupBy(bundle, keyFn, asLabel) {
  const groups = new Map();
  for (const x of bundle.items) {
    const k = keyFn(x);
    if (!k) continue;
    if (!groups.has(k)) groups.set(k, { uri: 'group:' + k, label: k, count: 0, image: null });
    groups.get(k).count++;
  }
  const items = [...groups.values()].sort((a, b) => b.count - a.count);
  return new Bundle(items, bundle.type, `${bundle.label} by ${asLabel}`);
}

// ============================================================================
// Cardinality response — turns the bead's size into actionable chips.
//
// Sparse bundles (1..4 items) usually mean the chain narrowed too far. If
// the last step was a `rel-pivot`, surface every broaden variant of the
// same template as a one-tap retry — runs the alternative against the
// *previous* bundle (so it really is a broaden, not a no-op).
//
// Large bundles (> 1000 items) usually mean the chain didn't narrow
// enough. Surface a "★ top N by …" chip that picks a reasonable ranking
// field per type and emits a Bundle of the top 100.
//
// Returns an array of chip descriptors:
//   { icon, label, title, kind, … }
// kind ∈ { 'broaden-variant', 'top-n' }
// ============================================================================
function defaultRankField(type) {
  return ({
    human: 'latestStart', building: 'year', si: 'madeDate',
    place: 'originCount', org: 'originCount', appg: 'originCount',
    party: 'originCount', formal_body: null, concept: null,
    constituency: 'originCount',
  })[type] || null;
}
function rankValue(item, field) {
  if (!field) return null;
  const v = item[field];
  return v == null ? null : (typeof v === 'string' ? v : +v);
}
// Data-driven OPS palette: hide a chip when its values would be empty so
// politics-flavoured chips don't leak onto architect / building bundles.
// Heuristics:
//   - explicit op.relevant(bundle) wins.
//   - pickers without explicit relevant: show only if values() returns ≥ 1.
//   - everything else: show by default.
function isRelevantOp(op, bundle) {
  try {
    if (typeof op.relevant === 'function') return !!op.relevant(bundle);
    if (op.kind === 'picker' && typeof op.values === 'function') {
      return (op.values(bundle) || []).length > 0;
    }
    return true;
  } catch { return true; }
}

function cardinalityChips(bead, idx) {
  const out = [];
  const n = bead?.bundle?.size || 0;

  if (n > 0 && n < 5 && bead?.spec?.op === 'rel-pivot') {
    const tpl = REL_TEMPLATES.find((t) => t.id === bead.spec.template);
    if (tpl) {
      const prev = state.beads[idx - 1];
      for (const v of tpl.variants) {
        if (v.id === bead.spec.variant) continue;
        if (v.kind !== 'broaden') continue;
        out.push({
          icon: '🔧',
          label: `broaden: ${v.label}`,
          title: `Re-run "${tpl.label}" against the previous bead with the broaden variant "${v.label}".`,
          kind: 'broaden-variant',
          template: tpl, variant: v,
          parentIdx: idx - 1,
          parentBundleType: prev?.bundle?.type,
        });
      }
    }
  }

  if (n > 1000) {
    const field = defaultRankField(bead.bundle.type);
    if (field) {
      out.push({
        icon: '🔧',
        label: `top 100 by ${field}`,
        title: `Narrow to the 100 items with the highest ${field}. ` +
               `Helps enrich / pivot stay under the 500-item cap.`,
        kind: 'top-n',
        n: 100, field,
      });
    }
  }
  return out;
}


// ============================================================================
// Starter gallery — kickoff sources. V1: just the post-1900 MPs seed.
// ============================================================================
// Generic loader: declarative starters from lib expose `{engineId, query,
// parse, note, namedGraphs?}`; old-style starters in this file expose an
// inline `fetch:` closure. Either shape produces `{ items, source }`. As
// more starters migrate to lib, the `fetch:` branch goes away.
async function loadStarter(s) {
  if (s.pqTemplate && s.parse) {
    const res = await pqFetch(s.pqTemplate, {}, `pq:${s.pqTemplate}`);
    return {
      items: s.parse(res.rows),
      source: makeSource({
        kind: `seed:${s.id}`,
        endpoint: res.endpoint, engineId: res.engineId,
        query: res.query, ms: res.ms,
        bindings: res.rows,
        note: s.note,
      }),
    };
  }
  if (s.query && s.parse) {
    const res = await engine(s.engineId).query(s.query, `seed:${s.id}`);
    return {
      items: s.parse(res.json.results.bindings),
      source: makeSource({
        kind: `seed:${s.id}`,
        endpoint: res.endpoint, engineId: res.engineId,
        query: res.query, ms: res.ms,
        bindings: res.json.results.bindings,
        note: s.note,
        namedGraphs: s.namedGraphs || [],
      }),
    };
  }
  return s.fetch();
}

// Generic runner for AUGMENT ops (enrich / parl-enrich / identity-bridge).
// Wraps the lib's pure plan with the page's engine() resolver + makeSource
// + the .enriched flag the UI reads. Replaces the inline enrichHumans /
// enrichFromParliament / enrichFromIdentity that used to live in this file.
async function runAugment(opId, bundle) {
  const aug = AUGMENT_OPS[opId];
  if (!aug) throw new Error(`unknown augment op: ${opId}`);
  if (aug.requires && !aug.requires(bundle)) {
    throw new Error(`bundle does not satisfy requires() for "${opId}"`);
  }
  if (aug.cap && bundle.size > aug.cap) {
    throw new Error(`bundle of ${bundle.size} too big to enrich (cap ${aug.cap})`);
  }
  const sparql = aug.query(bundle.items);
  const res = await engine(aug.engineId).query(sparql, `${aug.id}(${bundle.size})`);
  const newItems = aug.parse(res.json.results.bindings, bundle.items);
  const enriched = new Bundle(newItems, bundle.type, `${bundle.label} + ${aug.id}`);
  enriched.enriched = true;
  return {
    bundle: enriched,
    source: makeSource({
      kind: aug.id, endpoint: res.endpoint, engineId: res.engineId,
      query: res.query, ms: res.ms, bindings: res.json.results.bindings,
      note: aug.note,
      namedGraphs: aug.namedGraphs || [],
    }),
  };
}

// Library — named daisychains the page ships with. Each is a sequence of
// {starter} then {op[, value]} steps. Tapping a library card replays the
// chain by reusing the kickoff + op dispatch paths. Saved chains land here
// too (V1: in-memory; V2: persisted via #hash / fetched from a JSON file).
// ============================================================================

// ============================================================================
// State — one ordered list of beads. Each bead carries the bundle it produced.
// ============================================================================
const state = {
  starter: null,         // STARTERS entry once chosen
  beads: [],             // [{ id, opLabel, opIcon, bundle }]  ordered
  view: 'spine',         // 'spine' | 'graph' | 'table' | 'tiles'
};
const listeners = new Set();
function publish() { for (const fn of listeners) fn(); }

let _ids = 0;
function pushBead(opLabel, opIcon, bundle, sources = [], spec = null) {
  state.beads.push({
    id: 'b' + (++_ids),
    opLabel, opIcon, bundle,
    // A bead's content is, formally, a SPARQL dataset whose named graphs
    // are these sources (plus the ancestor beads' sources, accessible by
    // walking back through state.beads). Default graph is empty.
    sources: Array.isArray(sources) ? sources : [sources],
    // Structured spec that produced this bead — serialised for the library
    // and replayed when a saved chain is opened.
    spec,
  });
  publish();
}
function currentChainSpec() {
  return state.beads.map((b) => b.spec).filter(Boolean);
}
function truncateTo(idx) {
  state.beads.length = idx + 1;
  publish();
}

// ============================================================================
// TriG serialiser — render a bead as a SPARQL dataset (one named graph per
// source). Pseudo-ontology under <urn:fmn:p/> for the SELECT-column-as-
// predicate convention; literal subjects fall back to a blank-node-style URI.
// ============================================================================
function trigTerm(b) {
  if (!b) return '""';
  const v = b.value ?? '';
  if (b.type === 'uri') return `<${v}>`;
  // Datatyped literals
  if (b.datatype) {
    if (b.datatype.endsWith('#integer') || b.datatype.endsWith('#int') ||
        b.datatype.endsWith('#decimal') || b.datatype.endsWith('#double')) {
      return `"${v}"^^<${b.datatype}>`;
    }
    if (b.datatype.endsWith('#dateTime') || b.datatype.endsWith('#date')) {
      return `"${v}"^^<${b.datatype}>`;
    }
    return `"${v.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"^^<${b.datatype}>`;
  }
  if (b['xml:lang']) return `"${v.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"@${b['xml:lang']}`;
  return `"${v.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n')}"`;
}

function beadToTrig(bead) {
  const lines = [
    '# Bead exported as TriG. Each <urn:fmn:bead/…> named graph is a',
    '# verbatim record of one fetch (or one client-side op) that fed this',
    '# bead. Predicates use <urn:fmn:p/> because the SELECT projection',
    '# does not name them; for a normative shape, replace the predicate',
    '# IRI in each line below with whatever ontology you want.',
    '@prefix wd:    <http://www.wikidata.org/entity/> .',
    '@prefix wdt:   <http://www.wikidata.org/prop/direct/> .',
    '@prefix fmn:   <urn:fmn:p/> .',
    '@prefix xsd:   <http://www.w3.org/2001/XMLSchema#> .',
    '@prefix prov:  <http://www.w3.org/ns/prov#> .',
    '',
  ];
  for (const src of bead.sources || []) {
    lines.push(`# ${src.kind} — endpoint=${src.endpoint || '(client)'} ms=${src.ms} rows=${src.rowCount} ts=${new Date(src.ts).toISOString()}`);
    if (src.note)  lines.push(`# note: ${src.note}`);
    if (src.query) lines.push('# query:' + src.query.split('\n').map((l) => '\n#   ' + l).join(''));
    lines.push(`<${src.ng}> {`);
    for (const row of (src.bindings || [])) {
      // Choose the row's subject: prefer ?p, then ?bp/?am etc.; otherwise
      // the first URI-typed binding.
      let subjVar = null;
      for (const k of ['p', 'bp', 'am', 'person', 'subject']) {
        if (row[k] && row[k].type === 'uri') { subjVar = k; break; }
      }
      if (!subjVar) {
        for (const [k, v] of Object.entries(row)) {
          if (v.type === 'uri') { subjVar = k; break; }
        }
      }
      if (!subjVar) continue;
      const s = trigTerm(row[subjVar]);
      for (const [k, v] of Object.entries(row)) {
        if (k === subjVar) continue;
        lines.push(`  ${s} fmn:${k} ${trigTerm(v)} .`);
      }
    }
    lines.push('}', '');
  }
  return lines.join('\n');
}

// ============================================================================
// Shared lazy-image observer (same trick as pivcab).
// ============================================================================
const tileIo = new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (en.isIntersecting) {
      const img = en.target, src = img.dataset.src;
      if (src && !img._loaded) {
        img._loaded = true; img.src = src;
        img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
        tileIo.unobserve(img);
      }
    }
  }
}, { rootMargin: '200px 0px' });

      </style>

    this.shadowRoot.querySelector('.verb').textContent = b.opLabel || '';
    this.shadowRoot.querySelector('.title').textContent = b.bundle?.label || '';
    this.shadowRoot.querySelector('.count').textContent = (b.bundle?.size ?? 0).toLocaleString();

    // propagation so the click doesn't fire the bead-undo gesture.

    // the per-item multigraph has been enriched.

    meta.innerHTML = '';
    if (b.bundle?.items?.length) {
      const items = b.bundle.items;
      const bits = [];
      if (b.bundle.type === 'human') {
        const sitting = items.filter((x) => x.sitting).length;
        const topParty = topCounts(items.flatMap((x) => x.parties)).slice(0, 1)[0];
        const topDec   = countBy(items, 'decade').slice(0, 1)[0];
        const topGnd   = topCounts(items.map((x) => x.gender).filter(Boolean)).slice(0, 1)[0];
        if (sitting > 0) bits.push(`sitting: ${sitting}`);
        if (topParty)    bits.push(`top party: ${topParty[0]} (${topParty[1]})`);
        if (topDec)      bits.push(`peak: ${topDec[0]} (${topDec[1]})`);
        if (topGnd)      bits.push(`${topGnd[0]}: ${topGnd[1]}`);
        // Wikidata enrichment summary — only present after ✨.
        const wdEnriched = items.filter((x) => x.extra && (x.extra.birthplace || x.extra.almaMaters?.length));
        if (wdEnriched.length) {
          const withBp = wdEnriched.filter((x) => x.extra.birthplace).length;
          const withCoord = wdEnriched.filter((x) => x.extra.birthplace?.coords).length;
          const topBp = topCounts(wdEnriched.map((x) => x.extra.birthplace?.label).filter(Boolean)).slice(0, 1)[0];
          const topAm = topCounts(wdEnriched.flatMap((x) => x.extra.almaMaters || [])).slice(0, 1)[0];
          const topOcc= topCounts(wdEnriched.flatMap((x) => x.extra.occupations || [])).slice(0, 1)[0];
          bits.push(`✨ ${wdEnriched.length} from WD`);
          if (withBp)  bits.push(`born known: ${withBp} (mapped: ${withCoord})`);
          if (topBp)   bits.push(`top birthplace: ${topBp[0]} (${topBp[1]})`);
          if (topAm)   bits.push(`top alma: ${topAm[0]} (${topAm[1]})`);
          if (topOcc)  bits.push(`top occ: ${topOcc[0]} (${topOcc[1]})`);
        }
        // Parliament-DDP enrichment summary — only present after 🏛.
        const parlEnriched = items.filter((x) => x.extra?.parl);
        if (parlEnriched.length) {
          const withConst = parlEnriched.filter((x) => x.extra.parl.constituency).length;
          const topConst = topCounts(parlEnriched.map((x) => x.extra.parl.constituency).filter(Boolean)).slice(0, 1)[0];
          const topParlParty = topCounts(parlEnriched.map((x) => x.extra.parl.currentParty).filter(Boolean)).slice(0, 1)[0];
          bits.push(`🏛 ${parlEnriched.length} from DDP`);
          if (withConst)    bits.push(`constituency known: ${withConst}`);
          if (topConst)     bits.push(`top constituency: ${topConst[0]}`);
          if (topParlParty) bits.push(`Parl party top: ${topParlParty[0]} (${topParlParty[1]})`);
        }
        // identity-graph bridge enrichment (fpkg engine, 4 NGs).
        const bridged = items.filter((x) => x.extra?.identity);
        if (bridged.length) {
          const ddp   = bridged.filter((x) => x.extra.identity.ddpUri).length;
          const wd    = bridged.filter((x) => x.extra.identity.wikidataQid).length;
          const govuk = bridged.filter((x) => x.extra.identity.govukSlug).length;
          const site  = bridged.filter((x) => x.extra.identity.scrapedSite).length;
          bits.push(`🔗 ${bridged.length} bridged`);
          if (ddp)   bits.push(`DDP: ${ddp}`);
          if (wd)    bits.push(`Wikidata: ${wd}`);
          if (govuk) bits.push(`GOV.UK: ${govuk}`);
          if (site)  bits.push(`site scraped: ${site}`);
        }
      } else if (b.bundle.type === 'place' || b.bundle.type === 'org') {
        const withCoord = items.filter((x) => x.coords).length;
        const topCountry = topCounts(items.map((x) => x.country).filter(Boolean)).slice(0, 1)[0];
        const topOrigin = [...items].sort((a, b) => (b.originCount || 0) - (a.originCount || 0))[0];
        bits.push(`mapped: ${withCoord}`);
        if (topCountry) bits.push(`top country: ${topCountry[0]} (${topCountry[1]})`);
        if (topOrigin?.originCount) bits.push(`heaviest: ${topOrigin.label} (${topOrigin.originCount})`);
      } else if (b.bundle.type === 'building') {
        const withCoord = items.filter((x) => x.coords).length;
        const withImg   = items.filter((x) => x.image).length;
        const topCountry = topCounts(items.map((x) => x.country).filter(Boolean)).slice(0, 1)[0];
        bits.push(`mapped: ${withCoord}`);
        if (withImg)    bits.push(`photo: ${withImg}`);
        if (topCountry) bits.push(`top country: ${topCountry[0]} (${topCountry[1]})`);
      } else if (b.bundle.type === 'si') {
        const withYear = items.filter((x) => x.year).length;
        const topYear  = countBy(items, 'year').slice(0, 1)[0];
        const withCif  = items.filter((x) => x.comingIntoForce).length;
        if (withYear) bits.push(`year known: ${withYear}`);
        if (topYear)  bits.push(`peak year: ${topYear[0]} (${topYear[1]})`);
        if (withCif)  bits.push(`with CIF date: ${withCif}`);
      }
      // -- Cardinality hint — non-blocking, advisory only.
      // The thresholds catch the two common pain points: a pivot that
      // returned almost nothing (often a "broaden" candidate), or one
      // that returned thousands (often a "narrow before enrich" candidate).
      const n = b.bundle.size;
      // Cardinality flag in the meta line — the actionable broaden /
      // top-N chips appear separately in the chip row below.
      if (n === 0) {
        // CLAUDE.md rule 2 + 11: fail loud + honest about missing data. When
        // a DDP-shaped query returns 0 it is much more likely "DDP is one
        // Parliament behind" than a real empty set (DDP still treats the 2019
        // cohort as open — see /kgx/queries/08, 09). Surface that explicitly
        // and point at the sidecar.
        const fromDdp = (b.sources || []).some((s) => s.engineId === 'parl-sparql');
        bits.push(fromDdp
          ? '⚠ 0 rows — DDP may be stale (one Parliament behind). Try the parl-current-mps starter (FPKG sidecar).'
          : '⚠ 0 rows');
      } else if (n > 0 && n < 5) {
        bits.push('⚠ sparse — see 🔧 chip below');
      } else if (n > 1000) {
        bits.push('⚠ large — see 🔧 chip to narrow');
      }
      meta.textContent = bits.join('  ·  ');
    }

    // ⓘ — open lineage / TriG sheet
    const infoBtn = this.shadowRoot.querySelector('.info');
    if (infoBtn) {
      infoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const sheet = document.createElement('daisy-info-sheet');
        sheet.open(b);
      });
    }

    if (front) {
      const chipRow = this.shadowRoot.querySelector('.chips');
      const ops = (OPS[b.bundle?.type] || []).filter((op) => isRelevantOp(op, b.bundle));
      for (const op of ops) {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.innerHTML = `<span class="ic"></span><span class="lbl"></span>`;
        chip.querySelector('.ic').textContent = op.icon + ' ';
        chip.querySelector('.lbl').textContent = op.label;
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          this.dispatchEvent(new CustomEvent('op-tap', {
            detail: { op, bundle: b.bundle }, bubbles: true, composed: true,
          }));
        });
        chipRow.appendChild(chip);
      }
      // Cardinality response — chips that appear conditionally on bundle
      // size, so a sparse bead surfaces its template's broaden variants
      // for one-tap retry, and a large bead surfaces a "top-N by …" auto-
      // narrow. Distinguished from regular ops with the 🔧 mark.
      const cardChips = cardinalityChips(b, idx);
      for (const cc of cardChips) {
        const chip = document.createElement('button');
        chip.className = 'chip card-chip';
        chip.innerHTML = `<span class="ic"></span><span class="lbl"></span>`;
        chip.querySelector('.ic').textContent = cc.icon + ' ';
        chip.querySelector('.lbl').textContent = cc.label;
        chip.title = cc.title || '';
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          this.dispatchEvent(new CustomEvent('card-chip', {
            detail: cc, bubbles: true, composed: true,
          }));
        });
        chipRow.appendChild(chip);
      }
    } else {
      // Tapping an older bead truncates the chain back to it — except when
      // the click landed on the .info button (handled above).
      this.shadowRoot.querySelector('.card').addEventListener('click', (e) => {
        if (e.target.closest('.info')) return;
        this.dispatchEvent(new CustomEvent('bead-undo', {
          detail: { index: idx }, bubbles: true, composed: true,
        }));
      });
    }
  }
}

// ============================================================================
// Modal a11y helper. The three sheet-style overlays (rel-picker, info-sheet,
// thing-sheet) share the same envelope: a `:host` overlay + a `.sheet` panel
// with a `.close` button. This wires up the keyboard contract we owe:
//   - Escape → close
//   - role=dialog + aria-modal=true on the host element
//   - initial focus moves to the first focusable inside the shadow root
//   - previously-focused element is restored when the modal disconnects
//   - Tab cycles within the shadow root (basic focus trap)
// Each modal calls setupModalA11y(this) right after `document.body.appendChild`
// and implements disconnectedCallback so the keydown listener is removed and
// focus restored even when the modal is closed by click-outside / button.
// ============================================================================
const _FOCUSABLE = 'a[href],button:not([disabled]),[tabindex]:not([tabindex="-1"]),input:not([disabled]),select:not([disabled]),textarea:not([disabled])';

// Walk from document.activeElement down through any nested shadow roots so we
// capture the actual focused leaf, not just the topmost shadow host. Without
// this, `document.activeElement` returns the outermost custom element (e.g.
// <daisy-app>) and `prevFocus.focus()` becomes a no-op — focus falls to body
// on modal close instead of restoring to the trigger.
function _deepActiveElement() {
  let n = document.activeElement;
  while (n && n.shadowRoot && n.shadowRoot.activeElement) n = n.shadowRoot.activeElement;
  return n;
}

function setupModalA11y(host) {
  host.setAttribute('role', 'dialog');
  host.setAttribute('aria-modal', 'true');
  const prevFocus = _deepActiveElement();
  const onKey = (e) => {
    if (e.key === 'Escape') {
      e.stopPropagation();
      host.remove();
      return;
    }
    if (e.key !== 'Tab') return;
    const fs = host.shadowRoot.querySelectorAll(_FOCUSABLE);
    if (!fs.length) return;
    const first = fs[0], last = fs[fs.length - 1];
    const active = host.shadowRoot.activeElement;
    if (e.shiftKey && (active === first || !active)) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && active === last) {
      e.preventDefault(); first.focus();
    }
  };
  document.addEventListener('keydown', onKey);
  // Defer to next microtask so the just-rendered DOM is focusable.
  Promise.resolve().then(() => {
    const f = host.shadowRoot.querySelector(_FOCUSABLE);
    f?.focus();
  });
  host._modalCleanup = () => {
    document.removeEventListener('keydown', onKey);
    if (prevFocus && typeof prevFocus.focus === 'function') {
      try { prevFocus.focus(); } catch { /* element may be gone */ }
    }
  };
}

          <button class="close" aria-label="close">×</button>
        </div>
        ${tplSections || '<div style="padding:14px;color:var(--ink-mute);font-size:13px;">No templates registered for this bundle type yet.</div>'}

    this.addEventListener('click', (e) => { if (e.target === this) this.remove(); });
    for (const btn of this.shadowRoot.querySelectorAll('.vrow')) {
      btn.addEventListener('click', () => {

// ============================================================================
// <daisy-thing-sheet> — single-item details overlay opened from thumb-strip
// click-through or tile-grid tap. Shows the item's image (larger than the
// 44px strip thumb), the URI as a clickable link, and every scalar / nested
// field the item carries. Wikidata-style URIs get a direct "view on
// Wikidata" link; everything else just gets the canonical URI.
// ============================================================================
class DaisyThingSheet extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: 'open' }); }
  open(item, bundleType) {
    const wdMatch = String(item.uri || '').match(/\/(Q\d+)$/);
    const wdUrl = wdMatch ? `https://www.wikidata.org/wiki/${wdMatch[1]}` : null;
    // Best-effort prettified field table — only emit rows that have data.
    const rows = [];
    const push = (k, v) => { if (v !== null && v !== undefined && v !== '' && !(Array.isArray(v) && !v.length)) rows.push([k, v]); };
    push('label',     item.label);
    push('type',      bundleType);
    push('image',     item.image);
    if (item.coords)        push('coords',     `${item.coords.lat.toFixed(4)}, ${item.coords.lon.toFixed(4)}`);
    push('country',   item.country);
    push('year',      item.year);
    if (item.firstYr || item.lastYr)
      push('years',   `${item.firstYr || '?'}${item.firstYr === item.lastYr ? '' : ' – ' + (item.lastYr || (item.sitting ? 'present' : '?'))}`);
    if (item.parties?.length) push('parties', item.parties.join(' · '));
    push('decade',    item.decade);
    push('gender',    item.gender);
    if (item.citizenships?.length) push('citizenships', item.citizenships.join(' · '));
    push('Members API id', item.mpid);
    push('originCount', item.originCount);
    push('madeDate',   item.madeDate);
    push('comingIntoForce', item.comingIntoForce);
    push('number',     item.number);
    // extra (enrich results)
    if (item.extra?.birthplace) push('birthplace (✨)', item.extra.birthplace.label);
    if (item.extra?.almaMaters?.length) push('alma maters (✨)', item.extra.almaMaters.join(' · '));
    if (item.extra?.spouses?.length)    push('spouses (✨)',     item.extra.spouses.join(' · '));
    if (item.extra?.occupations?.length) push('occupations (✨)', item.extra.occupations.join(' · '));
    if (item.extra?.parl?.constituency) push('constituency (🏛)', item.extra.parl.constituency);
    if (item.extra?.parl?.currentParty) push('Parl party (🏛)',   item.extra.parl.currentParty);
    if (item.extra?.identity?.ddpUri)      push('DDP person (🔗)',   item.extra.identity.ddpUri);
    if (item.extra?.identity?.wikidataQid) push('Wikidata (🔗)',    item.extra.identity.wikidataQid);
    if (item.extra?.identity?.govukSlug)   push('GOV.UK (🔗)',      item.extra.identity.govukSlug);
    if (item.extra?.identity?.scrapedSite) push('scraped site (🔗)', item.extra.identity.scrapedSite);

    const rowsHTML = rows.map(([k, v]) =>
      `<dt>${escapeHTML(k)}</dt><dd>${escapeHTML(String(v))}</dd>`).join('');

    this.shadowRoot.innerHTML = `
      <style>
        :host { position: fixed; inset: 0; z-index: 100;
                background: color-mix(in oklab, var(--ink) 55%, transparent);
                display: flex; align-items: flex-end; justify-content: center;
                animation: fade 0.18s ease-out; }
        @keyframes fade  { from { opacity: 0 } to { opacity: 1 } }
        @keyframes slide { from { transform: translateY(20px) } to { transform: translateY(0) } }
        .sheet {
          width: 100%; max-width: 700px;
          background: var(--surface); color: var(--ink);
          border-radius: 14px 14px 0 0;
          padding: 14px 16px;
          max-height: 90vh; overflow-y: auto;
          box-shadow: 0 -8px 20px rgba(0,0,0,0.18);
          animation: slide 0.22s ease-out;
        }
        .h { display: flex; align-items: baseline; gap: 8px;
             padding-bottom: 10px; border-bottom: 1px solid var(--rule-soft); }
        .title { font-weight: 700; font-size: 16px; }
        .sub { color: var(--ink-mute); font-size: 12px; }
        .close { margin-left: auto; background: none; border: 0; color: var(--ink-mute);
                 font-size: 20px; cursor: pointer; padding: 4px 8px; }
        .body { padding-top: 12px; display: grid;
                grid-template-columns: 1fr; gap: 14px; }
        @media (min-width: 540px) {
          .body { grid-template-columns: 220px 1fr; }
        }
        .hero {
          background: var(--surface-2); border-radius: 10px;
          overflow: hidden; min-height: 160px;
          display: flex; align-items: center; justify-content: center;
        }
        .hero img { width: 100%; height: auto; max-height: 260px;
                    object-fit: cover; display: block; }
        .hero .placeholder { color: var(--ink-mute); font-size: 13px;
                             padding: 24px; text-align: center; }
        dl { margin: 0; display: grid; grid-template-columns: 130px 1fr;
             gap: 4px 12px; font-size: 13px; }
        dt { color: var(--ink-mute); font-weight: 600; }
        dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
        .links { margin-top: 14px; padding-top: 10px;
                 border-top: 1px solid var(--rule-soft);
                 display: flex; gap: 8px; flex-wrap: wrap; }

          border-color: var(--accent);
        }
      </style>
      <div class="sheet">
        <div class="h">
          <span class="title">${escapeHTML(item.label || item.uri || 'item')}</span>
          <span class="sub">${escapeHTML(bundleType || '')}</span>
          <button class="close" aria-label="close">×</button>
        </div>
        <div class="body">
          <div class="hero">
            ${item.image
              ? `<img alt="" src="${commonsThumb(item.image, 600)}">`
              : `<div class="placeholder">no image on record</div>`}

          ${wdUrl    ? `<a href="${wdUrl}"    target="_blank" rel="noopener">view on Wikidata ↗</a>` : ''}

          ${item.image ? `<a href="${commonsThumb(item.image, 1200)}" target="_blank" rel="noopener">full image ↗</a>` : ''}
        </div>
      </div>
    `;
    this.shadowRoot.querySelector('.close').addEventListener('click', () => this.remove());
    this.addEventListener('click', (e) => { if (e.target === this) this.remove(); });
    document.body.appendChild(this);
    setupModalA11y(this);
  }
