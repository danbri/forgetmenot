# fly.toml — fpkg (Forgetmeknot Palace)
#
# Deploy from the *repo root* so the Docker build can COPY third_party/
# N-Quads dumps for the bundled SPARQL endpoint:
#
#   flyctl deploy . --config demos/parliament-live/fly.toml
#
# Path semantics, learned the hard way:
#   - [build].dockerfile is resolved relative to fly.toml's directory,
#     NOT the cwd. So we use bare 'Dockerfile' (which lives next to
#     this fly.toml).
#   - The positional WORKING_DIRECTORY argument ('.' above) is what
#     sets the Docker build context — that's how the Dockerfile's
#     COPY third_party/... lines reach into the repo root.

app = 'fpkg'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  # Bundled-Oxigraph SPARQL endpoint lives at localhost:7878 inside the
  # container; the Node server proxies /sparql/* to it.
  OXIGRAPH_BIND = '127.0.0.1:7878'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm. With auto_stop='stop' + min=0 the box
  # stopped when idle, so returning to a demo paid a ~30s cold start (VM
  # boot + Oxigraph open + /_health grace). min=1 + auto_stop off pins it
  # up so return visits are instant. (Small always-on shared-cpu-1x cost.)
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'      # RocksDB is now pre-baked into the image —
                              # cold-start cost is "open files", not a load
    method = 'GET'
    path = '/_health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'            # serve-read-only against a pre-built RocksDB
                              # sits at ~100-150 MB; the 1 GB bump that
                              # covered peak-load memory is no longer needed
