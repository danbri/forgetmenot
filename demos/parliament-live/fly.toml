# fly.toml — fpkg (Forgetmeknot Palace)
#
# Deploy from the *repo root* so the Docker build can COPY third_party/
# N-Quads dumps for the bundled SPARQL endpoint:
#
#   flyctl deploy --config demos/parliament-live/fly.toml
#

app = 'fpkg'
primary_region = 'lhr'

[build]
  # Path is relative to the directory you run `flyctl deploy` in (the
  # repo root, per the comment above).
  dockerfile = 'demos/parliament-live/Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  # Bundled-Oxigraph SPARQL endpoint lives at localhost:7878 inside the
  # container; the Node server proxies /sparql/* to it.
  OXIGRAPH_BIND = '127.0.0.1:7878'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'      # bumped from 10s — N-Quads load on cold start
    method = 'GET'
    path = '/_health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'            # bumped from 256mb — Oxigraph in-memory store
